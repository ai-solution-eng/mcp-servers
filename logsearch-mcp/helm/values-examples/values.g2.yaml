# logsearch-mcp — values for the SE-G2 lab cluster
# (your-cluster.example — proxied corporate PCAI site)
#
# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document (PCAI's Helm Values editor replaces the
# chart's bundled values.yaml). Secret-free; real site values live in
# helm/local/ (never committed, never packaged).

# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. API-key Secret, out of band — never created/inlined by the chart; the pod
#      sits in CreateContainerConfigError until it exists (ref: logsearch-mcp-apikey,
#      key api-keys; pod logs are sensitive — /mcp must never trust network position).
#   2. ezua.virtualService.endpoint WHEN ezua.enabled — `helm required` render guard;
#      must resolve ${DOMAIN_NAME}; unique per release.

# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer, don't improvise)
#   Namespace policy (THE access control; default-deny): logsearch.allowedNamespaces /
#     blockedNamespaces, or the emptyAllowsAll lab escape hatch — documentation/DEPLOYMENT.md
#   RBAC scope: rbac.clusterWide (release-ns default; cluster-wide = lab only) — documentation/DEPLOYMENT.md
#   Network zone (default off) — values-examples/values-hardened-g2.yaml (overlay)
#   Metrics + ServiceMonitor: metrics.enabled/serviceMonitor — documentation/DEPLOYMENT.md
#   export_matches destination: logsearch.exportRoot (workbench-shared) — documentation/DEPLOYMENT.md
#   Blast-radius caps: logsearch.maxPods/maxLinesPerPod/maxTotalLines/maxLineChars — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment / Image
# ============================================================================

deployment:
  name: logsearch-mcp
  appName: logsearch-mcp
  replicaCount: 1

# Release-managed (lockstep with Chart.yaml) — leave at the chart default.
image:
  repository: ghcr.io/ai-solution-eng/logsearch-mcp
  tag: v0.4.0
  pullPolicy: IfNotPresent

imagePullSecrets: []   # only needed if the GHCR package stays PRIVATE

# ============================================================================
# API Keys
# ============================================================================

# Shared fleet key Secret (key: api-keys).
apiKey:
  existingSecret: "mcp-fleet-apikeys"
  existingSecretKey: "api-keys"

# ============================================================================
# Namespace Policy
# ============================================================================

# THE server's only access control: pod logs routinely carry sensitive
# strings, and an EMPTY allowedNamespaces DENIES ALL namespaces (default-deny).
logsearch:
  # Lab keeps the open default EXPLICITLY. Tighten for prod:
  #   emptyAllowsAll: false + allowedNamespaces: "team-a,team-b-*"
  allowedNamespaces: ""
  blockedNamespaces: ""     # punch holes back out of a broad allow-list here
  emptyAllowsAll: true      # lab: open default, set EXPLICITLY — remove for prod
  exportRoot: ""            # default: export_matches refuses with setup instructions;
                            # convention: point at a workbench-shared dir (see DEPLOYMENT.md)
  # Blast-radius caps: fetch width/budget/line + regex-size limits per fan-out.
  maxPods: 50
  maxLinesPerPod: 1000
  maxTotalLines: 300
  maxLineChars: 2000
  fetchConcurrency: 8
  maxRegexChars: 512

extraAllowedHosts: []   # EXTRA Host headers for in-cluster svc-DNS callers (`host:*` form)

# ============================================================================
# Metrics
# ============================================================================

metrics:
  enabled: true             # per-tool counters + ServiceMonitor
  interval: 30s             # ServiceMonitor scrape interval (chart default, now explicit)
  serviceMonitor: true      # render the monitoring.coreos.com/v1 ServiceMonitor

# ============================================================================
# Web Console
# ============================================================================

# Human front-end over the SAME seams/policy/caps as the MCP tools.
webui:
  enabled: true   # false = MCP-only surface (/health, /healthz, /mcp only)

# ============================================================================
# Resources
# ============================================================================

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001

# ============================================================================
# RBAC
# ============================================================================

# clusterWide: false = release namespace only; a one-time admin bootstrap is
# the alternative for targeted cross-namespace grants — documentation/DEPLOYMENT.md.
rbac:
  create: true
  clusterWide: true   # G2 lab: cluster-wide reads via the opt-in knob

# ============================================================================
# Networking
# ============================================================================

service:
  type: ClusterIP
  port: 9101
  targetPort: 9101

# Per-key proxy wiring (fleet convention: searxng-mcp); the only peer is the
# in-cluster Kubernetes API, so the block is fleet consistency only.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.16.0.0/12,localhost"

# ============================================================================
# PCAI Networking
# ============================================================================

# Gateway exposure on, with literal hosts (this file must not rely on
# ${DOMAIN_NAME} resolution).
ezua:
  enabled: true   # deploy the VirtualService on this cluster
  domainName: your-cluster.example   # informational only — no template reads it
  virtualService:
    endpoint: logsearch-mcp.your-cluster.example   # /mcp -> MCP server (9101); / -> web console
    istioGateway: istio-system/ezaf-gateway
    timeout: 300s

# ============================================================================
# Network Zone
# ============================================================================

# MCP network zone — ADDITIVE, DEFAULT OFF. Ingress allowlist (ns selectors):
# once on, anything not matched is DENIED. Zone OFF in this plain G2 profile.
networkPolicy:
  enabled: false
  sameNamespace: true
  authorizedClients:
    namespaces: []
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway
  probeCidrs: []
  probeExceptCidrs: []
  egress:
    enabled: false
    extraEgress: []
