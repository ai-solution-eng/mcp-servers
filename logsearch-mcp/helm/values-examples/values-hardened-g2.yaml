# logsearch-mcp — HARDENED-G2 example: the MCP network zone ON.
# Admin-surface MCP: the zone locks IN-CLUSTER access to the allowlisted
# namespaces; the browser/console path stays OPEN through the SSO-gated edge
# gateway (fleet doctrine 2026-09 — the browser is behind admin sign-ins).
#
# ⚠️ Enable AFTER confirming the LLM gateway's relay namespace is listed —
# with the zone on, every unlisted caller times out (deny by absence).
#
# Zone list (G2 live facts, inventory §6): least-privilege — the namespaces
# the LIVE gateway netpol already names as authorized MCP callers, plus
# monitoring for the ServiceMonitor scrape. Widen deliberately via the
# operator recipe in the RUNBOOK, one ns at a time.
networkPolicy:
  enabled: true
  sameNamespace: true
  authorizedClients:
    namespaces:
      - pcai-llm            # LLM Gateway relay (in-cluster MCP relay)
      - dsh-web-helm        # DSH web (live gateway allowlist, inventory §6)
      - owebui0-11-0        # OWUI instance on the live gateway allowlist
      - opencode-web-helm   # OpenCode web
      - prometheus         # the ACTUAL Prometheus scraper (kubeprom stack,
                            # ns `prometheus`) — the monitoring ns holds otel/UA,
                            # NOT the scraper; omit and up=0 within one interval
      - monitoring          # Prometheus scraping /metrics (ServiceMonitor) —
                            # omit and metrics scraping dies SILENTLY
                            # (check Prometheus targets after enabling)
  # Browser path stays OPEN (fleet doctrine 2026-09): the zone restricts
  # IN-CLUSTER callers only; external traffic rides the SSO-gated edge gateway
  # exactly as pre-zone (the browser is behind admin sign-ins).
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)
  # Kubelet probes originate at the NODE: allow node IPs only (inventory §4:
  # node IPs 172.28.1.61-63 masters, .161-.162 workers), with the pod CIDR
  # carved out so pod traffic stays governed by the zone rules above.
  probeCidrs:
    - 172.28.1.61/32
    - 172.28.1.62/32
    - 172.28.1.63/32
    - 172.28.1.161/32
    - 172.28.1.162/32
  # probeExceptCidrs stays EMPTY with per-node /32 allows: ipBlock.except must
  # be a STRICT SUBSET of the cidr — pod IPs (10.224.x) are not inside a node
  # /32 (172.28.1.x), so there is nothing to carve out. Only a BROAD probe
  # allow (e.g. 0.0.0.0/0) pairs with a carve-out.
  probeExceptCidrs: []
  egress:
    enabled: false          # admin MCP egress intentionally unrestricted
    extraEgress: []

# The VirtualService STAYS rendered (fleet doctrine 2026-09): external/browser
# traffic keeps flowing through the SSO-gated edge gateway exactly as pre-zone.
