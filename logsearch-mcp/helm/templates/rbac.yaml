{{- if .Values.rbac.create }}
# READ-ONLY RBAC — the entire point of this file. logsearch-mcp is a log
# SEARCH service: it needs to see pods and read their logs, and nothing
# else. Explicitly NOT granted, ever:
#   - secrets / configmaps / events of any kind
#   - pods/exec, pods/attach (no command execution into any container)
#   - any create/patch/delete/update verb, on any resource
# Namespaced Role in the release namespace only — never a ClusterRole — so
# the release's blast radius is exactly one namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
rules:
  # Pod discovery (list_log_sources): names, containers, restarts, age.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Log reads (get_pod_logs / search_logs / count_matches). pods/log has no
  # list/watch semantics — "get" is the only verb it supports, and it is
  # inherently read-only.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.deployment.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.deployment.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
