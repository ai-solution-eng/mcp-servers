# logsearch-mcp — read-only, namespace-scoped Kubernetes pod-log search over
# MCP, exposed at /mcp (through the PCAI Istio gateway when ezua is enabled)
# so MCP clients outside the cluster can search pod logs. The same port also
# serves the HPE-branded log-search web console (/ and /api/*) when
# webui.enabled.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: logsearch-mcp
  appName: logsearch-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/logsearch-mcp
  tag: v0.1.4
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously, the ddgs-mcp convention).
imagePullSecrets: []

# -- Namespace policy (LOUD — this is the server's ONLY access control) --------
# READ-ONLY by design, but pod logs routinely contain sensitive strings
# (tokens in stack traces, PII, internal hostnames). The namespace policy is
# the control that bounds what an agent harness can reach.
#
#   allowedNamespaces: comma-separated fnmatch globs. EMPTY STRING = ALL
#   namespaces allowed. Set it EXPLICITLY for anything beyond a lab cluster:
#     "team-a,team-b-*"
#   blockedNamespaces: comma-separated fnmatch globs; ALWAYS wins over the
#   allowed list — use it to punch holes back out ("*", except "kube-*"):
#     "kube-system,kube-public,kube-node-lease"
logsearch:
  allowedNamespaces: ""     # "" = ALL namespaces allowed — tighten for prod!
  blockedNamespaces: ""     # e.g. "kube-system,kube-public,kube-node-lease"

# -- Caps (blast-radius limits for agent harnesses) -----------------------------
# A fan-out search touches up to maxPods pods, tailing maxLinesPerPod lines
# each, and returns at most maxTotalLines merged matches. These bound both
# API-server load and the MCP response size (an agent's context window).
  maxPods: 50
  maxLinesPerPod: 1000
  maxTotalLines: 300

# -- Service exposure ---------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9101
  targetPort: 9101

# -- Web console (fleet pattern: prometheus-mcp's webui) --------------------------------------------
# The HPE-branded log-search console at / and the /api/* JSON endpoints are a
# HUMAN front-end over the SAME seams, namespace policy, and caps that back
# the MCP tools — the UI has no powers the tools don't (server-side gate:
# LOGSEARCH_WEBUI_ENABLED, see templates/deployment.yaml). ON by default;
# set false for an MCP-only surface (then only /health, /healthz, /mcp are
# served).
webui:
  enabled: true

# -- Resources --------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# -- Security ---------------------------------------------------------------------------------
# The image runs as USER 10001 (non-root, no shell needed); enforce it here too.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001

# -- RBAC --------------------------------------------------------------------------------------
# READ-ONLY, deliberately minimal: pods get/list + pods/log get, in the
# release namespace ONLY. No secrets, no exec, no write verbs, no cluster
# scope — see templates/rbac.yaml. Set false to skip creation entirely.
rbac:
  create: true

# -- HPE corporate proxy (fleet convention: searxng-mcp) -----------------------------------------
# Route outbound HTTP(S) traffic through the HPE corporate proxy. Default
# false: open-internet systems must NOT use the proxy (DNS/egress failures).
# Set true (and configure proxy.*) only behind the HPE proxy — when true the
# standard *_PROXY / NO_PROXY env vars are wired into the container.
#
# REALITY NOTE for THIS server: its only network peer is the Kubernetes API,
# which is IN-CLUSTER (kubernetes config.load_incluster_config -> the
# kube-apiserver Service). The standard NO_PROXY cluster-local entries below
# (.svc, .cluster.local, 10.0.0.0/8 ...) cover that path, so the proxy env is
# effectively inert here — it is present purely for fleet consistency and in
# case a future egress need (remote kubeconfig, webhook) appears.
hpe_proxies: false

proxy:
  http: http://hpeproxy.its.hpecorp.net:8080
  https: http://hpeproxy.its.hpecorp.net:8080
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.0.0.0/8,localhost"

# -- Corporate MITM CA: deliberately NOT wired for this server -------------------------------
# Other fleet charts (searxng-mcp's browser sidecar) mount the ezaf-root-ca
# ConfigMap because their workloads make OUTBOUND TLS through the MITM proxy
# (browser fetches verify against the OS trust store). logsearch-mcp has no
# such egress: the Kubernetes API is reached in-cluster with the SERVICE
# ACCOUNT's CA (config.load_incluster_config), plain HTTP by default, and
# there is no other TLS peer to trust — so there is no caCert block here to
# misconfigure. If a future egress need ever appears, copy searxng-mcp's
# browser.caCert wiring (values block + ConfigMap volume + trust-store
# install) rather than inventing a new one.

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------------------------
# Deploys the Istio VirtualService through the ezaf-gateway. OFF by default;
# enable per site in helm/local/values.<site>.yaml. /mcp is the agent path;
# the web console rides the root route when webui.enabled.
ezua:
  enabled: false
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "logsearch-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s
