# Email: andrew.bydlon@hpe.com
# Prefer: Slack

# logsearch-mcp — read-only, namespace-scoped Kubernetes pod-log search over
# MCP, exposed at /mcp (through the PCAI Istio gateway when ezua is enabled)
# so MCP clients outside the cluster can search pod logs. The same port also
# serves the HPE-branded log-search web console (/ and /api/*) when
# webui.enabled.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: logsearch-mcp
  appName: logsearch-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/logsearch-mcp
  tag: v0.2.1
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously, the ddgs-mcp convention).
imagePullSecrets: []

# -- Namespace policy (LOUD — this is the server's ONLY access control) --------
# READ-ONLY by design, but pod logs routinely contain sensitive strings
# (tokens in stack traces, PII, internal hostnames). The namespace policy is
# the control that bounds what an agent harness can reach.
#
# DEFAULT-DENY (fleet decision D8, 2026-09): an EMPTY allowedNamespaces denies
# ALL namespaces — an unconfigured release answers nothing instead of
# everything. Point it at an explicit allowlist (recommended), or set
# emptyAllowsAll: true to restore the pre-D8 open default on a trusted lab
# cluster.
#
#   allowedNamespaces: comma-separated fnmatch globs. EMPTY = DENY ALL unless
#   emptyAllowsAll: true. Set it EXPLICITLY for anything beyond a lab cluster:
#     "team-a,team-b-*"
#   blockedNamespaces: comma-separated fnmatch globs; ALWAYS wins over the
#   allowed list — use it to punch holes back out ("*", except "kube-*"):
#     "kube-system,kube-public,kube-node-lease"
#   emptyAllowsAll: the LOGSEARCH_EMPTY_ALLOWS_ALL escape hatch. false (the
#   default) keeps the server closed on an empty allowlist; true re-opens it.
logsearch:
  allowedNamespaces: ""     # "" = DENY ALL (D8) — set globs, or emptyAllowsAll: true
  blockedNamespaces: ""     # e.g. "kube-system,kube-public,kube-node-lease"
  emptyAllowsAll: false     # true = pre-D8 open default (trusted lab clusters only)
  # Caps (blast-radius limits for agent harnesses):
  # A fan-out search touches up to maxPods pods, tailing maxLinesPerPod lines
  # each, and stops FETCHING as soon as maxTotalLines merged matches are in
  # hand (the budget is enforced during the fan-out, not after a full fetch;
  # what was skipped is reported in the response). Every returned line is
  # additionally capped at maxLineChars characters with an explicit
  # "...[truncated N chars]" marker, and user regexes are screened for
  # catastrophic backtracking and refused above maxRegexChars characters (see
  # README "Regex safety"). fetchConcurrency is the width of the parallel
  # pod-fetch fan-out (asyncio.gather under a bounded semaphore; 1 = sequential).
  # NOTE: these keys sat accidentally indented under `apiKey:` before Wave 1,
  # which rendered the three pre-existing cap env vars EMPTY (the server
  # silently ran on its built-in defaults, which matched these numbers). Wave 1
  # moved them under `logsearch:`; the rendered env now matches exactly.
  maxPods: 50
  maxLinesPerPod: 1000
  maxTotalLines: 300
  maxLineChars: 2000
  fetchConcurrency: 8
  maxRegexChars: 512
  # -- export_matches destination (Wave-5 F3, ADDITIVE, DEFAULT OFF) ------------
  # The export_matches MCP tool writes matched search lines to
  # <exportRoot>/<dest_name> so a result set too big for a context window can
  # be read back from disk. DEFAULT "" renders NO env var at all → the tool
  # refuses with setup instructions and writes nothing (byte-identical default
  # server). Set it to an ABSOLUTE directory on a writable volume agents can
  # read back — fleet convention: a path on the workbench/shared PVC (e.g.
  # /data/exports, plus workbench's WORKBENCH_SHARED_PATHS=/data/exports) so
  # any workbench workspace can read exports. dest_name is validated to a
  # bare file name (no separators/'..'), writes are bounded by the same caps
  # as search_logs, and the file carries a small #-prefixed header.
  exportRoot: ""

# -- API keys (MANDATORY — fleet decision 2026-09, fleet pattern: K8S-MCP) -----
# /mcp requires a key; pod logs routinely contain sensitive strings, so the
# endpoint must never trust network position alone. The chart NEVER creates a
# key and NEVER inlines one in values — an envsubst apply once emptied a live
# key Secret (the K8S-MCP lesson). The deployment references an
# operator-created Secret and fails loud (CreateContainerConfigError) until
# it exists:
#   kubectl -n <ns> create secret generic logsearch-mcp-apikey \
#     --from-literal=api-keys='key-old,key-new'
# Comma-SEPARATED keys all authenticate: that is the rotation mechanism —
# append the new key, move clients over, drop the old one, no downtime. The
# UNIVERSAL MCP_API_KEYS env is honored too (either var authenticates).
apiKey:
  existingSecret: logsearch-mcp-apikey
  existingSecretKey: api-keys

# -- Service exposure ---------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9101
  targetPort: 9101

# -- /metrics + ServiceMonitor (Wave-3 C3 — ADDITIVE, DEFAULT OFF) -------------------
# Prometheus self-metrics on the MCP container: ONE counter family,
# logsearch_mcp_tool_requests_total{tool,outcome} — per-tool request counts
# with outcome ok|error (which tools agents call, how often, how often they
# fail — namespace-policy denials surface as errors). No namespace names, pod
# names, regex patterns, or log content are ever exported. DEFAULT false: the
# chart renders NOTHING extra (no env, no ServiceMonitor) and the server
# serves no /metrics route — the default render is byte-identical to the
# pre-metrics baseline. Flip to true per site values to enable; /metrics is
# then served key-free (like the probes) on the same port so the
# ServiceMonitor can scrape it.
metrics:
  enabled: false
  # Render the monitoring.coreos.com/v1 ServiceMonitor (requires enabled).
  serviceMonitor: true
  # Scrape interval rendered into the ServiceMonitor.
  interval: 30s

# -- Fleet audit-JSONL searchability convention (Wave-3 C3, documentation only) -----
# THIS server writes no audit JSONL of its own (read-only search surface) —
# it is the SEARCH side of the fleet convention: audit-writing servers expose
# their JSONL trail so logsearch can search it. Workbench writes
# <root>/.audit.jsonl (see the workbench-mcp chart values, "Fleet audit-JSONL
# searchability convention"); applygate's side of the convention is owned by
# the applygate chart/agent. FLEET CONVENTION (fleet-audit item 11, plan
# §7 C3): an audit trail nobody can search is unauditable in practice —
# operators mount/expose an audit JSONL as pod logs (e.g. a log-tailing
# sidecar shipping the file to a pod's stdout), keep that namespace inside
# this chart's `logsearch.allowedNamespaces` policy, and search_logs /
# count_matches over that namespace then make the trail queryable.
# Documentation-only (NO behavior change): nothing in this chart renders from
# an audit.* key — an unconsumed key would be dead config, the exact
# anti-pattern the fleet audit flags.
#
#   audit:
#     searchableVia: allowedNamespaces   # namespace(s) carrying exposed audit logs

# -- Web console (fleet pattern: prometheus-mcp's webui) --------------------------------------------
# The HPE-branded log-search console at / and the /api/* JSON endpoints are a
# HUMAN front-end over the SAME seams, namespace policy, and caps that back
# the MCP tools — the UI has no powers the tools don't (server-side gate:
# LOGSEARCH_WEBUI_ENABLED, see templates/deployment.yaml). ON by default;
# set false for an MCP-only surface (then only /health, /healthz, /mcp are
# served).
webui:
  enabled: true

# -- Resources --------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# -- Security ---------------------------------------------------------------------------------
# The image runs as USER 10001 (non-root, no shell needed); enforce it here too.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001

# -- RBAC --------------------------------------------------------------------------------------
# READ-ONLY, deliberately minimal: pods get/list + pods/log get — nothing
# else (no secrets, no exec, no write verbs — see templates/rbac.yaml).
#   create: false skips RBAC creation entirely (SA falls back to default).
#   clusterWide: false (default) keeps the rules in the RELEASE namespace
#     only — blast radius exactly one namespace.
#   clusterWide: true renders the SAME two rules as a ClusterRole +
#     ClusterRoleBinding: the SA reads pods/logs cluster-wide. Lab/trusted
#     clusters only, and keep the namespace policy deliberate — RBAC bounds
#     what the SA can read, the policy bounds what agents may ask for
#     (cluster-wide inherently includes kube-system; use
#     logsearch.blockedNamespaces "kube-*" to hide system logs from agents).
rbac:
  create: true
  clusterWide: false

# -- HPE corporate proxy (fleet convention: searxng-mcp) -----------------------------------------
# Route outbound HTTP(S) traffic through the HPE corporate proxy. Default
# false: open-internet systems must NOT use the proxy (DNS/egress failures).
# Set true (and configure proxy.*) only behind the HPE proxy — when true the
# standard *_PROXY / NO_PROXY env vars are wired into the container.
#
# REALITY NOTE for THIS server: its only network peer is the Kubernetes API,
# which is IN-CLUSTER (kubernetes config.load_incluster_config -> the
# kube-apiserver Service). The standard NO_PROXY cluster-local entries below
# (.svc, .cluster.local, 10.0.0.0/8 ...) cover that path, so the proxy env is
# effectively inert here — it is present purely for fleet consistency and in
# case a future egress need (remote kubeconfig, webhook) appears.
hpe_proxies: false

proxy:
  http: http://hpeproxy.its.hpecorp.net:8080
  https: http://hpeproxy.its.hpecorp.net:8080
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.0.0.0/8,localhost"

# -- Corporate MITM CA: deliberately NOT wired for this server -------------------------------
# Other fleet charts (searxng-mcp's browser sidecar) mount the ezaf-root-ca
# ConfigMap because their workloads make OUTBOUND TLS through the MITM proxy
# (browser fetches verify against the OS trust store). logsearch-mcp has no
# such egress: the Kubernetes API is reached in-cluster with the SERVICE
# ACCOUNT's CA (config.load_incluster_config), plain HTTP by default, and
# there is no other TLS peer to trust — so there is no caCert block here to
# misconfigure. If a future egress need ever appears, copy searxng-mcp's
# browser.caCert wiring (values block + ConfigMap volume + trust-store
# install) rather than inventing a new one.

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------------------------
# Deploys the Istio VirtualService through the ezaf-gateway. OFF by default;
# enable per site in helm/local/values.<site>.yaml. /mcp is the agent path;
# the web console rides the root route when webui.enabled.
ezua:
  enabled: false
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "logsearch-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s
