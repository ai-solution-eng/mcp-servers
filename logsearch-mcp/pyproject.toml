[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsearch-mcp"
version = "0.4.0"
description = "LogSearch MCP Server — read-only, namespace-scoped Kubernetes pod-log search (fan-out regex, time bounds, provenance, caps) over MCP"
requires-python = ">=3.10"
keywords = ["mcp", "kubernetes", "logs", "observability", "model-context-protocol"]

dependencies = [
    "mcp>=2.0.0",
    "kubernetes>=29.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
logsearch-mcp = "logsearch_mcp.server:main"

[tool.setuptools]
# DEPLOY-BLOCKER (Wave-6 packaging fix): the Dockerfile does a NON-editable
# `uv pip install --system .` and runs the installed `logsearch-mcp` console
# script from site-packages. server.py imports mcp_auth (auth wave) AND
# mcp_metrics (Wave-3 C3) — both MUST ship in the wheel or the image
# crash-loops at startup with ModuleNotFoundError.
#
# Layout: the app modules live in the src layout under src/logsearch_mcp/, so
# they ship as the logsearch_mcp PACKAGE (package-dir points setuptools at
# src/). Only the repo-root mcp_auth.py — the fleet hardlink, imported as a
# top-level module — remains a top-level py-module.
package-dir = {logsearch_mcp = "src/logsearch_mcp"}
packages = ["logsearch_mcp"]
py-modules = ["mcp_auth"]

[tool.pytest.ini_options]
# "src" makes "from logsearch_mcp import ..." resolve (tests import the
# package absolutely); "." makes the top-level "import mcp_auth" resolve from
# the repo root. Both entries are required when pytest runs from there.
pythonpath = ["src", "."]
