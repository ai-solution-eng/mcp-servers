# workbench-mcp — values for a customer HOSTED-TRIAL environment
#
# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document for the PCAI Helm Values editor. Adjust the
# '# SITE:' lines, then apply.
# Secret-free by construction: nothing here needs credentials. If your PCAI
# build resolves ${DOMAIN_NAME} in ezua values, the placeholders below work as
# pasted; otherwise replace them with the literal cluster domain — an
# unresolved placeholder registers a gateway host that matches nothing.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: workbench-mcp
  appName: workbench-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
# repository/tag/pullPolicy are release-managed — leave at the chart default.
image:
  repository: ghcr.io/ai-solution-eng/workbench-mcp
  tag: v0.4.0
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously).
imagePullSecrets: []

# -- Web UI -------------------------------------------------------------------------------
# Read/write console; the HTML (/ and /ui) is public-but-inert (in-page
# unlock bar collects the key), the /api/* data routes stay key-gated — keep
# on only where the gateway ALSO enforces authn (the ezaf-gateway
# VirtualService below).
webui:
  enabled: true

# -- Workbench configuration --------------------------------------------------------
workbench:
  # Root directory holding all workspaces — MUST match persistence.mountPath.
  root: /data
  # argv[0] allowlist for run_command (comma-separated); no shells by design.
  # NOTE (fleet decision D18): pip/python3 are NOT here — re-add only if the
  # trial genuinely needs them (an allow-listed interpreter can sidestep the
  # argv-level workspace confinement; see README "Honest limits").
  execAllowlist: "ls,cat,head,tail,grep,find,wc,du,df,mkdir,touch,cp,mv,tar,git,diff,sort,uniq"
  # Hard deny (WINS over the allowlist): network/escalation binaries.
  execDenylist: "curl,wget,sudo,su,nc,ncat,ssh,scp,setsid"
  # Per-command timeout bounds (seconds).
  execTimeoutDefault: 60
  execTimeoutMax: 600
  # Dedicated run_command pool width (default 4): a saturated pool
  # returns a structured busy response without executing (no queue).
  execMaxConcurrency: 4
  # Audit-JSONL rotation threshold (bytes; default 100 MiB): the active
  # .audit.jsonl renames to .audit.jsonl.1 (single generation) and a
  # fresh file starts with an audit_rotated provenance entry.
  auditMaxBytes: 104857600
  # write_file cap (bytes, 8 MiB).
  maxFileBytes: 8388608
  # stdout/stderr cap per run_command (bytes, 200 KiB).
  maxOutputBytes: 204800
  # Max entries per list_files response.
  maxListEntries: 500
  logLevel: INFO
  # sandbox_exec tool (v1, opt-in): python file execution in the
  # no-network executor pool — OFF here; flip with executors.enabled.
  sandboxExec: false
  sandboxLabel: "app=workbench-exec"
  sandboxContainer: python
  sandboxTimeoutS: 120
  sandboxMaxOutputChars: 50000
  # Workspace templates (Wave-5 F3) — SITE: chart default ({} = the
  # workspace_create tool's template parameter is refused; nothing renders).
  templates: {}

# -- Sandbox executor pool (sandbox-exec v1) ------------------------------------------------------
# No-network python executor pods for the sandbox_run tool: same image as the
# server (stdlib-only needs), deny-all NetworkPolicy, no SA token, non-root,
# caps dropped, seccomp, read-only rootfs, no GPU resource request, and NO
# tolerations (control-plane taints self-exclude). The MCP tool refuses until
# BOTH executors.enabled AND workbench.sandboxExec are true.
executors:
  enabled: false
  appName: workbench-exec
  containerName: python
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# -- In-cluster host allowlist (DNS-rebinding additions; K8S-MCP pattern) ---
# EXTRA Host header values the MCP SDK's DNS-rebinding protection accepts for
# in-cluster callers addressing the server by service DNS instead of the
# public FQDN. Joined into MCP_EXTRA_ALLOWED_HOSTS (matched verbatim or as
# `host:*`). The pinned public FQDN (ezua.virtualService.endpoint, wired as
# MCP_HOSTNAME when ezua is enabled) and loopback are always allowed; with
# neither key set the SDK's implicit dev-mode protection applies (unchanged).
# The chart AUTO-prepends the release's own service DNS
# (<deployment.name>-service.<ns>.svc.cluster.local:*) whenever transport
# security is active — the gateway relay's Host header — so this list is
# for hosts BEYOND that.
extraAllowedHosts: []

# -- Per-key proxy wiring --------------------------------------------------------------------------
# SITE: off unless the trial cluster sits behind a corporate proxy — a
# non-empty key wires proxy env on the pod and passes it through to
# run_command children so `pip` works; `proxy: {}` = fully off.
proxy: {}

# -- Corporate MITM CA (independent of the proxy wiring) ------------------------------------------
# Off — enable only when workloads must trust a corporate MITM CA (requires
# the ezaf-root-ca ConfigMap in the release namespace).
caCert:
  enabled: false
  configMap: "ezaf-root-ca"
  configMapKey: "ezaf-root-ca.crt"

# -- Kyverno vendor-label policy -------------------------------------------------------------------
# Enable only where the trial platform enforces the hpe-ezua/* vendor labels.
kyverno:
  enabled: false

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9103
  targetPort: 9103

# -- Resources (modest: a scratch pad, not a compute node) -------------------------
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Security context -----------------------------------------------------------------
# Non-root uid + fsGroup 10001 (PVC writable by the server user), RuntimeDefault
# seccomp at the pod level.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening (fleet-audit P0): read-only rootfs (run_command
# children can write only the PVC + /tmp), no privilege escalation, caps
# dropped. The pod also mounts NO service-account token (automount
# explicitly off in the chart — the server makes zero k8s calls).
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# -- Persistence ---------------------------------------------------------------------
# Workspaces survive pod restarts. RWX so every replica sees the same state;
# single-replica trials without an RWX class can use ReadWriteOnce with
# replicaCount: 1.
# SITE: shrink for a trial if 10Gi is more scratch than the tenant needs.
persistence:
  enabled: true
  size: 10Gi
  mountPath: /data
  accessModes:
    - ReadWriteMany

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------------------------
# SITE: gateway exposure. The /mcp timeout is generous because run_command can
# legitimately run to its max (600 s default).
ezua:
  enabled: true   # SITE: deploy the VirtualService
  # SITE: current PCAI builds resolve ${DOMAIN_NAME} in ezua values; if yours
  # does not, replace both placeholders with the literal cluster domain.
  domainName: ${DOMAIN_NAME}   # informational only — no template reads it
  virtualService:
    endpoint: workbench-mcp.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 660s

# Fleet API-key auth: the shared fleet key Secret (key: api-keys).
apiKey:
  existingSecret: "mcp-fleet-apikeys"
  existingSecretKey: "api-keys"

# Observability (Wave-3+): per-tool counters + ServiceMonitor.
metrics:
  # SITE: flip to true where the trial wants per-tool counters (requires the
  # prometheus-operator ServiceMonitor CRD).
  enabled: false
  serviceMonitor: true      # render the monitoring.coreos.com/v1 ServiceMonitor (requires enabled)
  interval: 30s             # ServiceMonitor scrape interval
