apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      # The server makes zero Kubernetes API calls — an automounted SA token
      # behind the exec allowlist (python3) was a live credential-theft path
      # (fleet-audit HIGH). Automount explicitly OFF.
      automountServiceAccountToken: false
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      # Scratch pad by design: non-root uid, group-writable volume.
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          # Read-only rootfs + no priv-esc + dropped caps (fleet-audit P0):
          # run_command children can write only the PVC and /tmp.
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No args: the image CMD already pins the transport/host/port, and
          # k8s `args` REPLACES the entire CMD when the image has no
          # ENTRYPOINT — passing bare flags here makes the runtime exec
          # "--transport" (the v0.1.0 CrashLoopBackOff). If the port ever
          # diverges from the image default, set container command+args
          # TOGETHER or add an ENTRYPOINT to the Dockerfile.
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: mcp
          env:
            # Rendered in the TEMPLATE from the workbench.* knobs — Helm does
            # not template inside values.yaml, so a values-file
            # 'value: "{{ .Values.workbench.root }}"' would ship as a LITERAL
            # string (the prometheus-mcp v0.1.0 release lesson).
            - name: WORKBENCH_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            - name: WORKBENCH_EXEC_ALLOWLIST
              value: {{ .Values.workbench.execAllowlist | quote }}
            - name: WORKBENCH_EXEC_DENYLIST
              value: {{ .Values.workbench.execDenylist | quote }}
            - name: WORKBENCH_EXEC_TIMEOUT_DEFAULT
              value: {{ .Values.workbench.execTimeoutDefault | quote }}
            - name: WORKBENCH_EXEC_TIMEOUT_MAX
              value: {{ .Values.workbench.execTimeoutMax | quote }}
            - name: WORKBENCH_EXEC_MAX_CONCURRENCY
              value: {{ .Values.workbench.execMaxConcurrency | quote }}
            - name: WORKBENCH_MAX_FILE_BYTES
              value: {{ .Values.workbench.maxFileBytes | quote }}
            - name: WORKBENCH_MAX_OUTPUT_BYTES
              value: {{ .Values.workbench.maxOutputBytes | quote }}
            - name: WORKBENCH_MAX_LIST_ENTRIES
              value: {{ .Values.workbench.maxListEntries | quote }}
            - name: WORKBENCH_AUDIT_MAX_BYTES
              value: {{ .Values.workbench.auditMaxBytes | quote }}
            - name: WORKBENCH_LOG_LEVEL
              value: {{ .Values.workbench.logLevel | quote }}
            {{- if .Values.workbench.sandboxExec }}
            # Sandbox-exec server switch (workbench.sandboxExec → the env
            # master switch of the sandbox_run tool). Rendered ONLY when true
            # — the default render has no WORKBENCH_SANDBOX_EXEC at all and
            # the tool refuses. Pairs with templates/executors.yaml
            # (executors.* renders the executor pool + its RBAC/netpol).
            - name: WORKBENCH_SANDBOX_EXEC
              value: "1"
            {{- end }}
            {{- if or (ne .Values.workbench.sandboxLabel "app=workbench-exec") (ne .Values.workbench.sandboxContainer "python") (ne (int .Values.workbench.sandboxTimeoutS) 120) (ne (int .Values.workbench.sandboxMaxOutputChars) 50000) }}
            # Sandbox-exec tuning — rendered ONLY when a value diverges from
            # its server default, so the default render carries no extra env.
            {{- if ne .Values.workbench.sandboxLabel "app=workbench-exec" }}
            - name: WORKBENCH_SANDBOX_LABEL
              value: {{ .Values.workbench.sandboxLabel | quote }}
            {{- end }}
            {{- if ne .Values.workbench.sandboxContainer "python" }}
            - name: WORKBENCH_SANDBOX_CONTAINER
              value: {{ .Values.workbench.sandboxContainer | quote }}
            {{- end }}
            {{- if ne (int .Values.workbench.sandboxTimeoutS) 120 }}
            - name: WORKBENCH_SANDBOX_TIMEOUT_S
              value: {{ .Values.workbench.sandboxTimeoutS | quote }}
            {{- end }}
            {{- if ne (int .Values.workbench.sandboxMaxOutputChars) 50000 }}
            - name: WORKBENCH_SANDBOX_MAX_OUTPUT_CHARS
              value: {{ .Values.workbench.sandboxMaxOutputChars | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.workbench.templates }}
            # Workspace templates (Wave-5 F3, ADDITIVE, DEFAULT OFF): the
            # optional template parameter of workspace_create. Rendered ONLY
            # when the operator defines templates — the default render has no
            # WORKBENCH_TEMPLATES env at all and the server behaves exactly
            # as before (the parameter is refused). A template can only
            # WIDEN a workspace's exec allowlist with these operator-supplied
            # binaries (denylist still wins) and pre-run canned setup argv
            # commands inside the new workspace (same guards, audited with
            # the template name).
            - name: WORKBENCH_TEMPLATES
              value: {{ .Values.workbench.templates | toJson | quote }}
            {{- end }}
            # Web UI + /api/* toggle (chart: webui.enabled). The /api/*
            # endpoints reuse the MCP tools' core functions — no new powers.
            - name: WORKBENCH_UI_ENABLED
              value: {{ .Values.webui.enabled | toString | quote }}
            {{- if .Values.metrics.enabled }}
            # /metrics self-metrics (Wave-3 C3, ADDITIVE, DEFAULT OFF): the
            # server serves per-tool request counters at /metrics only when
            # this env is set — nothing here renders when metrics.enabled is
            # false (the default), so the default pod is unchanged. Pairs
            # with templates/servicemonitor.yaml.
            - name: WORKBENCH_METRICS_ENABLED
              value: "true"
            {{- end }}
            # Read-only-rootfs scratch: HOME on a per-pod emptyDir keeps
            # pip/tempfile inside run_command functional (their writes reset
            # with the pod; workspaces persist on the PVC).
            - name: HOME
              value: /tmp
            # API keys — every route except /health requires one. Always from
            # an operator-created Secret (existingSecret-only, the K8S-MCP
            # invariant): the chart never creates or inlines a key, and the
            # pod fails loud (CreateContainerConfigError) until it exists.
            # Comma-separated keys all authenticate → zero-downtime rotation.
            - name: WORKBENCH_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- $svcHost := printf "%s-service.%s.svc.cluster.local:*" .Values.deployment.name .Release.Namespace }}
            {{- $transportActive := and .Values.ezua.enabled .Values.ezua.virtualService.endpoint }}
            {{- if $transportActive }}
            # Public FQDN — pins the Host header (DNS-rebinding protection,
            # mcp_auth.transport_security_from_env; the K8S-MCP fleet
            # pattern). Unset (ezua disabled) = dev mode: the SDK's implicit
            # loopback-only protection applies unchanged.
            - name: MCP_HOSTNAME
              value: {{ .Values.ezua.virtualService.endpoint | quote }}
            {{- end }}
            {{- if or $transportActive .Values.extraAllowedHosts }}
            # In-cluster callers (svc DNS) — DNS-rebinding allowlist. When
            # transport security is active (ezua endpoint pinned or any
            # extraAllowedHosts), the chart ALWAYS includes this release's
            # own service DNS FIRST — the same name the Service resource
            # renders (pod-log confirmed 2026-10: the gateway relay arrives
            # with "Invalid Host header: workbench-mcp-service.
            # workbench-mcp.svc.cluster.local:9103"). Site extraAllowedHosts
            # append after it; entries are matched verbatim or as `host:*`
            # by the SDK's transport security.
            - name: MCP_EXTRA_ALLOWED_HOSTS
              {{- if .Values.extraAllowedHosts }}
              value: {{ printf "%s,%s" $svcHost (join "," .Values.extraAllowedHosts) | quote }}
              {{- else }}
              value: {{ $svcHost | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.proxy.http }}
            # Corporate proxy: reaches fetch/pip from the server process AND
            # every run_command child (the server passes these through).
            # Wired only when the corresponding proxy.<key> is non-empty.
            - name: HTTP_PROXY
              value: {{ .Values.proxy.http | quote }}
            - name: http_proxy
              value: {{ .Values.proxy.http | quote }}
            {{- end }}
            {{- if .Values.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.https | quote }}
            - name: https_proxy
              value: {{ .Values.proxy.https | quote }}
            {{- end }}
            {{- if .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            - name: no_proxy
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
            {{- if .Values.caCert.enabled }}
            # Corporate MITM CA (independent of the proxy wiring): pip/requests
            # inside run_command verify TLS against these files (passed
            # through to children by the server).
            - name: SSL_CERT_FILE
              value: /workbench-certs/ca.crt
            - name: REQUESTS_CA_BUNDLE
              value: /workbench-certs/ca.crt
            - name: PIP_CERT
              value: /workbench-certs/ca.crt
            {{- end }}
          # Stateless MCP 2.0: probes hit /healthz — a plain JSON endpoint
          # that does not depend on the MCP session manager.
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.targetPort }}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caCert.enabled }}
            # The ezaf-root-ca ConfigMap key normalized to a fixed path via
            # items+subPath (the DshChart pattern) — env vars point here.
            - name: ca-cert
              mountPath: /workbench-certs/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        # PVC-backed: workspaces survive pod restarts and are shared by all
        # replicas (RWX).
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.name }}-data
        {{- else }}
        # persistence disabled: an emptyDir keeps the pod functional (a
        # scratch pad whose contents vanish with the pod — for throwaway
        # environments only).
        - name: data
          emptyDir: {}
        {{- end }}
        # Read-only-rootfs scratch (paired with HOME=/tmp): subprocess
        # tempfile/pip-cache writes land here and reset with the pod.
        - name: tmp
          emptyDir: {}
        {{- if .Values.caCert.enabled }}
        - name: ca-cert
          configMap:
            name: {{ .Values.caCert.configMap }}
            items:
              - key: {{ .Values.caCert.configMapKey }}
                path: ca.crt
        {{- end }}
