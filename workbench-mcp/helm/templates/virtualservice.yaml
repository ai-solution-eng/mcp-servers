{{- if .Values.ezua.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.deployment.name }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/app: {{ .Values.deployment.appName }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    # MCP clients (harnesses run OUTSIDE the cluster): stateless
    # streamable-http at /mcp. Generous timeout: run_command can
    # legitimately run to WORKBENCH_EXEC_TIMEOUT_MAX (600s default).
    - match:
        - uri:
            prefix: /mcp
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
    # Everything else -> same service: / and /ui serve the HPE-branded web
    # UI, /api/* its JSON API, /health /healthz for smoke tests. The UI is
    # unauthenticated at the pod — gateway authn (this ezaf-gateway
    # VirtualService) is the only thing between it and a browser.
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
