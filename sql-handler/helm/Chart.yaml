# SQLhandler MCP server — direct SQL access to columnar data. PCAI (HPE
# Ezmeral Unified Analytics) MCP 2.0 deployment. Backends: OneLake (Delta
# Lake over ABFS) or S3-compatible object storage (Parquet, e.g. MinIO).
apiVersion: v2
name: sqlhandler
description: >-
  MCP (Model Context Protocol, streamable-http) server for fast, direct SQL
  access to columnar data: Microsoft Fabric OneLake (Delta Lake) or an
  S3-compatible store (MinIO/AWS, Parquet). Exposes list_tables /
  describe_table / run_sql / scan_table as MCP tools.
type: application
version: 2.1.4
appVersion: "v2.1.4"
keywords:
  - mcp
  - onelake
  - delta
  - fabric
  - lakehouse
  - s3
  - minio
  - parquet
  - pcai
  - hpe
maintainers:
  - name: HPE AI Solution Engineering
dependencies:
  # Shared fleet helm library (type: library — renders no resources of its
  # own; audit §3.5 "extract a minimal shared helm library chart"). Adopted
  # concerns, one at a time with a byte-identical render-diff proof each:
  #   - probes (Wave-3 C5 pilot)
  # file:// path is relative to this chart directory; vendored as the
  # UNPACKED charts/pcai-fleet-lib/ dir + Chart.lock — the charts' .helmignore
  # excludes vendored *.tgz, so a tgz dependency is invisible to the loader
  # and to helm package (see pcai-helm-port/README.md).
  - name: pcai-fleet-lib
    version: 0.1.0
    repository: file://../../pcai-helm-lib/chart/pcai-fleet-lib