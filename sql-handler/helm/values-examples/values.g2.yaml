replicaCount: 4
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  extraMetrics: []
  behavior:
    scaleUpStabilizationSeconds: 30
    scaleDownStabilizationSeconds: 300
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
podDisruptionBudget:
  enabled: true
  minAvailable: 2
terminationGracePeriodSeconds: 90
image:
  repository: ghcr.io/ai-solution-eng/sqlhandler
  tag: v2.4.0
  digest: ''
  pullPolicy: IfNotPresent
backend: s3
sources: []
databases: []
# Opt back IN to DuckDB's own filesystem layer (parquet_scan/COPY/ducklake
# row reads) for the whole pod. Default false = locked down (read_csv
# '/etc/passwd', COPY TO, and extension URL fetches all fail closed).
# Turn on ONLY when an attached source genuinely needs it (ducklake row
# reads) — the attached-catalog SQL guard keeps writes refused either way.
duckdbFileAccess: false
# -- Delta Sharing backend (read-only) -----------------------------------------
# A sixth read-only source via the open Delta Sharing protocol (Databricks
# sharing, OSCAR, any Delta Sharing server): shares/schemas/tables list into
# the same catalog as every other backend, and run_sql joins them with lake
# tables (engine unchanged — the provider strip is the only new code).
# Tables address as <share>_<schema>_<table> (underscore, not dot: a dotted
# DuckDB view name is unaddressable — see sharing.py for the full rationale).
#
# Config is the standard Delta Sharing profile (endpoint + bearer token as
# YAML/JSON). Supply it ONE of two ways:
#   1. sharing.existingConfigMap (+ key) — a profile ConfigMap you own
#      (mounted read-only; preferred, since profiles carry a credential).
#   2. sharing.existingSecret (+ keys) — a Secret with endpoint + bearer
#      token as separate keys (no file; wired via secretKeyRef).
# NEVER paste a bearer token into values. With sharing.enabled the backend
# selector (backend:) must be "sharing" or empty — the render fails loudly
# on any other combination.
sharing:
  enabled: false
  existingConfigMap: ""   # profile ConfigMap name; key below must exist
  existingConfigMapKey: delta-sharing.profile
  existingSecret: ""      # alternative to the ConfigMap: endpoint+token keys
  existingSecretEndpointKey: endpoint
  existingSecretBearerTokenKey: bearer-token
# -- Prometheus scraping -------------------------------------------------------
# PodMonitor so the prometheus-operator scrapes /metrics (engine gauges:
# query rates, cache stats, RSS). The MCP prometheus tools read the same
# Prometheus, so a target here is immediately visible there.
#   security.metricsAuth true: the scrape 401s unless Prometheus presents a
#   credential — set metrics.podMonitor.bearerTokenSecret to a Secret carrying
#   SQLHANDLER_API_TOKEN or one of the /mcp API keys.
metrics:
  podMonitor:
    enabled: true
    # Extra labels on the PodMonitor itself — if the prometheus-operator's
    # podMonitorSelector requires a label (commonly release: prometheus),
    # set it here or the target silently never appears.
    additionalLabels: {}
    # Bearer token for the scrape when security.metricsAuth is true.
    # Shape: {name: <secret>, key: <key>} — omit for open scraping.
    bearerTokenSecret: {}
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: ''
  annotations: {}
service:
  type: ClusterIP
  port: 9097
  targetPort: 9097
mcp:
  transport: streamable-http
  path: /mcp
  port: 9097
  readonly: true                # G2 lab stays SELECT-only (fleet D2)
  allowedHosts: ""              # not pinned: gateway hostname fixed by the VS, but leave open for in-cluster callers
  allowedOrigins: ""
  # -- Response compression (gzip) -------------------------------------------
  # The MCP/JSON-API/UI surfaces return markdown/JSON-heavy text, which
  # gzip compresses 5-10x on the wire. minSize skips tiny responses
  # (health probes, small results) where the round-trip costs more than it
  # saves. SSE/streaming MCP responses are excluded by the middleware.
  compression:
    enabled: true
    # Bytes: responses smaller than this are served uncompressed.
    minSize: 1024
# -- Raw-format landing zone ---------------------------------------------------
# CSV / TSV / JSON / NDJSON / JSONL files (and .gz of each) under the s3 or
# nfs/file backend discover as queryable tables — mirroring Parquet discovery
# semantics exactly (file → table, folder → table, schema folders → schema/name,
# partition dirs fold in). Zero ingestion: drop files in, query them.
#
# This is a LANDING-ZONE feature, not a scan path: raw text has no row-group
# statistics, so every read parses every byte (10-100x more bytes scanned than
# parquet for selective queries) and .gz files cannot be split across cores.
# Tables carry a RAW badge in list/describe/UI; the count(*) metadata fast
# path refuses them (it would lie); the escape hatch for grown-up tables is
# the write tier's COPY (...) TO <scratch>/....parquet promotion.
rawFiles:
  # Master switch (SQLHANDLER_RAW_FORMATS=0 hides every raw table).
  enabled: true
  # Per-file size cap in MB: a table is skipped WHOLE (never partially listed)
  # when any single file exceeds it. 0 = unlimited. For .gz files the cap
  # applies to the COMPRESSED size — the uncompressed size would need a
  # decompression pass per object, so the cap is approximate there (a
  # decompression bomb can exceed it; keep the default on).
  maxFileMB: 64
# -- Query execution ------------------------------------------------------------
# Applies to the DuckDB SQL path — MCP run_sql and the web API alike.
query:
  # Fleet decision D5: per-query wall-clock timeout in seconds (0 = no
  # timeout, the pre-D5 behavior). On expiry the query is interrupted inside
  # DuckDB (no leaked threads/connections) and the caller gets a clean error.
  # The default 600s stops a runaway query from holding one of the
  # concurrency-gate slots forever; genuine >10-minute queries must raise
  # this deliberately (the gateway itself caps calls at 3600s).
  timeoutSeconds: "600"
  # Default row cap for run_sql / scan_table / query_result (0 = uncapped —
  # think hard before raising it fleet-wide; a runaway SELECT * fills both
  # the wire and the model's context). Per-call `limit` overrides downward.
  maxRows: "1000"
  # Row cap for profile_table / column_stats sampling (0 = full table).
  # Statistics over a bounded sample are what an agent needs; the exact
  # row count still comes from Parquet/Delta metadata for free.
  profileMaxRows: "1000000"
  # Max concurrent async query jobs (query_submit; HTTP 429 beyond it).
  maxJobs: 8
  # Query-memory resource depth: how many recent query outcomes the
  # sqlhandler://query-memory resource keeps (0 disables recording).
  queryMemorySize: 50
  # Bare `SELECT cols FROM t LIMIT n` previews read the FIRST data file's
  # first row group instead of enumerating every fragment of a large table
  # (the same access pattern as the count(*) fast path: an agent's first
  # look at a table). LIMIT without ORDER BY guarantees no row subset, so
  # the first physical rows are the same SQL contract, just delivered
  # without the full enumeration. false = the normal query path.
  previewFastpath: true
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 800m
    memory: 16Gi
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 20
startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 24
security:
  hardened: true
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    allowedNamespaces: []
    additionalIngress: []
  authorizationPolicy:
    enabled: false
    principals: []
    namespaces: []
  runAsUser: 1000
  readOnlyRootFilesystem: true
  automountServiceAccountToken: false
  apiKey:
    existingSecret: mcp-fleet-apikeys
    existingSecretKey: api-keys
  metricsAuth: false            # /metrics gated behind the same api-keys Secret; /ready is NEVER gated (kubelet probes cannot authenticate - gating it strands pods NotReady, seen live 2026-09-18)
  # Per-caller identity + policy-as-code (implementation review §3/§5):
  identity:
    # TRUST GATE for the oauth2-proxy browser rung (X-Auth-Request-User /
    # X-Forwarded-Groups). FALSE (default) = those headers are ignored —
    # identity resolves via the gateway's relay attribution header (over a
    # valid /mcp key), the matched-key fingerprint, or anonymous. TRUE
    # ASSERTS the workload AuthorizationPolicy pins ingress to the gateway
    # (authorizationPolicy.enabled above) — only then can a browser header
    # be trusted (anyone who can reach the pod can otherwise forge them).
    trustBrowserHeaders: false
  # Policy-as-code: per-caller row filters + column masks + hidden tables
  # from an operator-authored JSON/YAML file (hot-reloaded on mtime).
  # DEFAULT OFF = the whole feature is byte-identical to before (no policy
  # hash in any cache key, no masking views, shared query memory/saved
  # queries). Enabling requires a policy file — unbound keys then fall to
  # the file's default_group (the restricted default).
  policy:
    enabled: false
    # ConfigMap (or any readable path) carrying the policy document; wire it
    # as a volume+mount (semanticCatalog's pattern) and point this at the
    # mounted file. Empty = no policy configured (enforcement inert).
    existingConfigMap: ""
    existingConfigMapKey: policy.json
    mountPath: /etc/sqlhandler/policy
  # Optional auth gate on /metrics ONLY (audit: /metrics leaks table counts,
  # RSS and error strings unauthenticated). Default false = today's
  # behavior (open). When true, a scrape/read must present SQLHANDLER_API_TOKEN
  # or an /mcp API key (MCP_API_KEYS / SQLHANDLER_API_KEYS) as
  # X-API-Key / X-API-Token / Bearer — wire the matching header into the
  # Prometheus scrape config; liveness (/health) AND readiness (/ready)
  # probes stay open: kubelet probes cannot carry a secret, and a gated
  # /ready strands every pod NotReady (live-seen 2026-09-18). With the gate
  # on but NO credential source configured, /metrics 401s for everyone
  # (fail closed, loud startup warning).
  metricsAuth: false
  # Ingress NetworkPolicy: default-deny, then allow (a) the pod's own
  # namespace, (b) the Istio gateway namespace below, (c) allowedNamespaces.
  # Egress is NOT restricted (the server must reach AAD/OneLake/S3).
  #
  # DEFAULT OFF: in-cluster callers (MCP agents, OWUI, DSH, ...) reach the
  # Service directly with zero friction — the right posture for short-lived
  # test deployments. The Service stays ClusterIP, so nothing is exposed
  # outside the cluster. Turn this ON for production / real-data
  # deployments, and add direct-caller namespaces to allowedNamespaces
  # below (flipping it on re-breaks any caller not listed).
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    # Extra namespaces whose pods may call this service directly
    # (in-cluster MCP clients, OWUI, DSH, ...). Cluster-internal access
    # stays frictionless: add the client's namespace here.
    allowedNamespaces: []
    # Raw extra NetworkPolicy `from:` peers (CIDRs, podSelectors...),
    # appended verbatim to the ingress rules.
    additionalIngress: []
  # Pod-level Istio AuthorizationPolicy (east-west, service-to-service).
  # Off by default: principal names are deployment-specific and a wrong
  # list locks the service completely. The gateway authz (ezua.*) plus the
  # NetworkPolicy above already cover the common cases. When enabled, at
  # least one of principals/namespaces is REQUIRED (an ALLOW policy with
  # no rules would deny everything).
  authorizationPolicy:
    enabled: false
    # e.g. ["cluster.local/ns/istio-system/sa/ezaf-gateway-service-account"]
    principals: []
    # Allowed caller namespaces (Istio identity namespaces).
    namespaces: []
fabric:
  credentialsSecret:
    name: fabric-credentials
    tenantIdKey: tenant-id
    clientIdKey: client-id
    clientSecretKey: client-secret
    create: false
    values:
      tenantId: ''
      clientId: ''
      clientSecret: ''
  lakehouseAbfssUrl: ''
  workspaceId: ''
  lakehouseId: ''
  authority: onelake.dfs.fabric.microsoft.com
  storageOptions: {}
s3:
  credentialsSecret:
    name: s3-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    create: true
    values:
      accessKey: <S3_ACCESS_KEY>
      secretKey: <S3_SECRET_KEY>
  endpointUrl: http://minio.minio.svc.cluster.local:9000
  region: us-east-1
  bucket: test-parquet
  prefix: ''
  anonymous: false
  useSsl: false
  options: {}
iceberg:
  catalogType: rest
  catalogUri: ''
  catalogName: sqlhandler
  warehouse: ''
  namespace: ''
  # Nessie branch/tag pinned for reads (catalogType: nessie only). Rendered
  # as ICEBERG_NESSIE_REF; empty = the catalog's default branch.
  nessieRef: ''
  credentialsSecret:
    name: iceberg-credentials
    tokenKey: token
    accessKeyKey: access-key
    secretKeyKey: secret-key
    create: false
    values:
      token: ''
      accessKey: ''
      secretKey: ''
  storage:
    endpointUrl: ''
    region: us-east-1
    anonymous: false
nfs:
  rootDir: /data
  mount:
    enabled: false
    pvcName: ''
    mountPath: /data
    readOnly: true
# -- ADLS Gen2 backend (used when backend: adls) ----------------------------------
# Reads Parquet/Delta (and raw landing-zone files) from an Azure Data Lake
# Storage Gen2 container via pyarrow's native AzureFileSystem + delta-rs.
# Non-secret connection details (account/container/prefix) go in the
# ConfigMap; the client secret NEVER renders — ADLS_CLIENT_SECRET_ENV carries
# the NAME of the env var, and the deployment wires that var from the Secret
# below via secretKeyRef (the onelake credentials pattern).
adls:
  enabled: false
  account: ""             # storage account name (required)
  filesystem: ""          # container / filesystem name (required); alias: container
  container: ""           # alias of filesystem (set exactly one)
  prefix: ""              # optional sub-tree within the container
  auth: anon              # anon | client-secret
  tenantId: ""            # Entra tenant (client-secret mode)
  clientId: ""            # Entra app/client id (client-secret mode)
  # Secret (created out-of-band) whose key holds the client secret. NEVER put
  # the secret value in values — only the Secret NAME and KEY land here.
  existingSecret: ""
  existingSecretClientSecretKey: client-secret
  # Sovereign clouds: core.windows.net (default) | core.usgovcloudapi.net |
  # core.chinacloudapi.cn
  endpointSuffix: ""

# -- GCS backend (used when backend: gcs) -----------------------------------------
# Reads Parquet/Delta (and raw landing-zone files) from a Google Cloud Storage
# bucket via pyarrow's native GcsFileSystem + delta-rs. The service-account
# JSON key file is MOUNTED (operator supplies the volume — e.g. a Secret
# volume); GCS_CREDENTIALS_FILE points at the mounted path, never at key
# CONTENTS in values.
gcs:
  enabled: false
  bucket: ""              # bucket name (required)
  prefix: ""              # optional sub-tree within the bucket
  projectId: ""           # only needed for bucket creation; reads work without
  # Mounted path of the service-account key file (requires the operator's
  # volume mount; empty = ambient application-default credentials).
  credentialsFile: ""
  anonymous: false        # read a public bucket with no credential

cache:
  ttl: 3600
  versionCheckInterval: 10
  prewarmTables: ''
  # Data prewarm (pairs with prewarmTables + the usage-driven list): when
  # the disk block cache is enabled, the FIRST N row groups of each prewarm
  # table are read through it at startup, so the cold first query of the
  # day hits warm pod-local blocks instead of object-store round trips.
  # 0 = off (describe-cache warming only); local/NFS backends are skipped
  # (the OS page cache does that job for free — see blockCache.includeLocal).
  prewarmRowgroups: 1
  # Serve list_tables from the cache immediately and refresh it in the
  # background (plus automatically once per `ttl` seconds), so callers never
  # block on the slow S3/DFS listing. Set false for fully synchronous calls.
  # Data prewarm (pairs with prewarmTables + the usage-driven list): when
  # the disk block cache is enabled, the FIRST N row groups of each prewarm
  # table are read through it at startup, so the cold first query of the
  # day hits warm pod-local blocks instead of object-store round trips.
  # 0 = off (describe-cache warming only); local/NFS backends are skipped
  # (the OS page cache does that job for free — see blockCache.includeLocal).
  prewarmRowgroups: 1
  # Serve list_tables from the cache immediately and refresh it in the
  # background (plus automatically once per `ttl` seconds), so callers never
  # block on the slow S3/DFS listing. Set false for fully synchronous calls.
  listAsyncRefresh: true
  duckdbMemoryFraction: '0.6'
  spillDir: /tmp/sqlhandler-duckdb-spill
  cacheDir: /tmp/sqlhandler-cache
  virtualCacheDir: /var/lib/sqlhandler-catalog
  virtualCacheTtl: 3600
  virtualCacheSort: true
  resultCacheTtl: 3600
  resultCacheMaxBytes: "268435456"
  # SHOWCASE: shared L2 result cache — all 4 replicas read/write one warm
  # cache on the semantic-catalog store PVC (mounted RWX at the path below),
  # so a warm query on replica 1 serves replicas 2-4. The dir MUST sit on a
  # ReadWriteMany volume (RWO strands the other replicas' cache silently).
  # Off = the chart's byte-identical default; flip enabled to false (or ''
  # the dir) to turn it off.
  l2:
    enabled: true
    dir: /var/lib/sqlhandler-catalog/l2-cache
    ttl: '3600'
    minBytes: '262144'
    maxBytes: '2147483648'
  blockCache:
    enabled: true
    dir: ''
    blockSize: '8388608'
    maxBytes: '1073741824'
    includeLocal: false
# -- Saved-query store (query_save / query_list / query_delete / query_saved) --
# Where the saved-parameterized-queries JSON file lives. EMPTY (default) →
# next to the disk-warm cache — in every hardened deployment that is /tmp,
# an emptyDir, so a POD RESCHEDULE (image update, node drain, OOMKill
# eviction) silently forgot every user-saved query. Two durable fixes, in
# precedence order:
#   1. set savedQueriesPath here (or the env var directly) — absolute path;
#      MUST sit on a mounted volume (the readOnlyRootFilesystem posture
#      leaves only mounts writable);
#   2. leave empty + semanticCatalog.store.enabled=true (the catalog PVC) —
#      the chart then renders <store mountPath>/saved-queries.json, durable
#      with zero extra volumes. RWX store class + replicas > 1: saves race
#      benignly (last write wins, atomic per write).
# Same file semantics in every mode: atomic temp+rename, 0600, corrupt file
# degrades to an empty store rather than an error.
savedQueriesPath: ""
semanticCatalog:
  enabled: true
  mountPath: /etc/sqlhandler
  tables:
    orders:
      description: Orders fact table used by the G2 benchmark workload
      columns:
        order_id: Order identifier (bench range-filters on it)
        region: Sales region — bench groups/aggregates by it
        product: Product key — bench groups by it
        unit_price: Unit price — bench filters > 250 / averages it
        qty: Quantity sold — bench sums it
    employees:
      description: Employee dimension table used by the G2 benchmark workload
    orders_eu:
      definition: SELECT order_id, region, product, unit_price, qty FROM orders WHERE
        region = 'EU'
      description: 'EU orders slice — the simplest virtual table: a filtered view
        over the physical scan (user filters push down into it).'
    orders_line_totals:
      definition: SELECT *, unit_price * qty AS line_total FROM orders WHERE unit_price
        > 250
      description: Premium orders with a computed line_total — expressions in definitions;
        also the composition base for orders_eu_premium.
    orders_eu_premium:
      definition: SELECT order_id, product, unit_price * qty AS line_total FROM orders_line_totals
        WHERE region = 'EU'
      description: 'Composed virtual table: builds on orders_line_totals (which builds
        on orders) — definitions compose, nothing is stored.'
    revenue_by_region:
      definition: SELECT region, count(*) AS orders, sum(unit_price * qty) AS revenue,
        round(avg(unit_price), 2) AS avg_unit_price FROM orders GROUP BY region ORDER
        BY revenue DESC
      description: Region revenue rollup — an aggregate virtual table; the materialized
        cache (TTL 3600s, auto-sorted) serves repeat queries.
  json: ''
  yaml: ''
  existingConfigMap: ''
  store:
    enabled: true
    existingClaim: ''
    size: 1Gi
    storageClass: ''
    accessModes:
    - ReadWriteMany
    mountPath: /var/lib/sqlhandler-catalog
# -- Write tier (GLOBAL FLAG, DEFAULT FALSE — DECISIONS.md) ----------------------
# Agent-facing scratch writes (CREATE TABLE AS / INSERT INTO / COPY INTO)
# under subject-scoped namespaces. DEFAULT OFF = byte-identical to the
# read-only service today (the flag gates ONLY the new capability;
# mcp.readonly keeps governing multi-statement/DDL exactly as before —
# the default posture is unchanged twice over). Even when enabled, every
# target must resolve under <scratch-root>/<subject-slug>/... (no subject
# = no write, ever) and concurrent writers to one table are refused with a
# retryable conflict (single-writer lease on the scratch volume).
writes:
  enabled: false
  scratch:
    roots: ""
    # SHOWCASE example (needs an RWX scratch PVC or S3/MinIO root):
    # roots:
    #   - scratch=/mnt/scratch          # RWX PVC mounted at /mnt/scratch
    #   - iceberg://iceberg-scratch     # pyiceberg root via SQLHANDLER_WRITE_ICEBERG_*
    leaseTtl: "300"
    icebergCatalogUri: ""
    icebergWarehouse: ""
    pvc:
      enabled: false
      size: 10Gi
      storageClass: ""
      accessModes: []        # default [ReadWriteMany] (render-guarded)
      mountPath: /scratch
      existingClaim: ""      # mount an existing claim instead of creating one

# -- Per-caller policy-as-code (COMMENTED — not a values key yet) -----------
# Row filters + column masks per caller identity, from an operator-authored
# file. NOT enabled here: it needs an authored policy file to function and
# the chart does not render its env vars yet — enable by adding BOTH env
# vars below to the ConfigMap (or the deployment env) once the file exists
# on a mounted volume:
#   SQLHANDLER_POLICY_ENABLED: "1"
#   SQLHANDLER_POLICY_FILE: /var/lib/sqlhandler-catalog/policy.yaml
# (enabled-without-file is inert — enforcement resolves an empty policy —
# so an early flip is safe but demos nothing.) Minimal example file
# (masked callers never share cache entries with unmasked ones; the
# policy hash is folded into every cache key automatically):
#   version: 1
#   default_group: restricted
#   groups:
#     analysts:
#       tables:
#         "orders": {row_filter: "region != 'EU'", column_masks: {unit_price: redact}}
#   subjects: {alice: [analysts]}
containerArgs:
- --transport
- streamable-http
- --host
- 0.0.0.0
- --port
- '9097'
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
  - host: sqlhandler.local
    paths:
    - path: /
      pathType: Prefix
  tls: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
ezua:
  enabled: true
  domainName: ${DOMAIN_NAME}
  kyverno:
    enabled: true
  virtualService:
    endpoint: sqlhandler.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 60s
    longTimeout: 3600s
  authorizationPolicy:
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
