# ============================================================================
# SQLhandler — namespace bootstrap secrets (TEMPLATE / example)
# ============================================================================
#
# This is the SANITIZED twin of helm/local/secrets.g2.yaml: same structure,
# no real values. Copy it, fill in your credentials, and apply:
#
#   cp helm/local/secrets.example.yaml helm/local/secrets.yaml
#   $EDITOR helm/local/secrets.yaml          # fill in the placeholders
#   kubectl apply -f helm/local/secrets.yaml
#
# WHY THIS FILE EXISTS: Secrets and out-of-band ConfigMaps are namespace-
# scoped. Deleting a namespace takes them with it, and the chart does not
# recreate them (the credential Secrets are deliberately out-of-band; see
# helm/values.yaml s3.credentialsSecret and documentation/DEPLOYMENT.md §2).
# Re-applying a filled-in copy of this file is what restores a rebuilt
# namespace.
#
# NEVER commit real credentials. helm/local/* is gitignored precisely so a
# filled-in copy stays local; keep this template value-free so it can be
# committed as the documented starting point.
#
# ---------------------------------------------------------------------------
# ORDER MATTERS: the policy ConfigMap first, then these Secrets.
# ---------------------------------------------------------------------------
# The deployment mounts the policy ConfigMap at
# /etc/sqlhandler-policy-seed (security.policy.seedFromConfigMap) and the
# pods sit in ContainerCreating with
#   FailedMount: configmap "sqlhandler-policy" not found
# until it exists. It is a ConfigMap (not a Secret), so it is not in this
# file — create it first:
#
#   kubectl -n <namespace> create configmap sqlhandler-policy \
#     --from-file=policy.json=./policy.json
#
# Its 'admins' entries must match YOUR credentials or the Access-control
# panel stays 403:
#   - key:sha256:<12hex>   the fingerprint of a key in mcp-fleet-apikeys
#   - subject:<sso-name>   your browser-SSO subject
#
# ---------------------------------------------------------------------------
# NOT INCLUDED (rendered by the chart, do not recreate by hand)
# ---------------------------------------------------------------------------
#   sqlhandler-config              the env ConfigMap (values -> SQLHANDLER_*)
#   sqlhandler-semantic-catalog    the catalog ConfigMap (semanticCatalog.*)
# ============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: sqlhandler            # <-- your release namespace
  labels:
    app.kubernetes.io/name: sqlhandler
    app.kubernetes.io/instance: sqlhandler
type: Opaque
stringData:
  # Must match s3.credentialsSecret.accessKeyKey / secretKeyKey in your
  # values file (defaults: access-key / secret-key). Consumed by the pod as
  # S3_ACCESS_KEY / S3_SECRET_KEY.
  access-key: 'REPLACE-WITH-S3-ACCESS-KEY'
  secret-key: 'REPLACE-WITH-S3-SECRET-KEY'
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-fleet-apikeys
  namespace: sqlhandler            # <-- your release namespace
  labels:
    app.kubernetes.io/name: sqlhandler
    app.kubernetes.io/instance: sqlhandler
type: Opaque
stringData:
  # Fleet MCP API key, consumed as SQLHANDLER_API_KEYS. Comma-separate
  # multiple keys for rotation. This gates /mcp and supplies the identity
  # that the policy's 'admins' fingerprint refers to.
  #
  # NOTE: this Secret is only needed when security.apiKey.existingSecret
  # points at it (the G2/site values do). A deployment with no apiKey set
  # runs /mcp OPEN — set it unless the gateway edge already fronts the
  # service.
  api-keys: 'REPLACE-WITH-FLEET-API-KEY'
