# ============================================================================
# SQLhandler — Hosted-trial site values (EXAMPLE — sanitized, no credentials)
#
# This file lives in helm/values-examples/, a folder that is hardlink-synced
# to GitHub: it is intentionally SECRET-FREE. Real per-site values belong in
# helm/local/ (gitignored + hardlink-excluded — never commit, never package).
#
# Site        : customer-managed PCAI (hosted trial). PCAI resolves
#               ${DOMAIN_NAME} before rendering — leave it as-is.
# Standard    : ezua.virtualService.endpoint uses ${DOMAIN_NAME}, the gateway
#               AuthorizationPolicy (oauth2-proxy) stays ENABLED, credentials
#               use <UPPER_SNAKE> placeholders or an out-of-band Secret.
# Usage (PCAI): import the packaged chart once, paste this whole document into
#               the chart's Helm Values editor, adjust the '# SITE:' lines,
#               apply. Operators can render it with:
#                 helm template helm -f helm/values-examples/values.hosted-trial.yaml
# This is a FULL VALUES document (every chart key listed) — paste-ready.
# Field reference: helm/values.yaml · Deployment guide: documentation/DEPLOYMENT.md
# ============================================================================

# SQLhandler MCP server — PCAI (HPE Ezmeral Unified Analytics) deployment.
# Deploys SQLhandler as a MCP 2.0 (streamable-http) server exposed at
# <endpoint>/mcp through the PCAI Istio gateway.

# -- Deployment ---------------------------------------------------------------
# Scale OUT, not UP — benchmark evidence (G2, 2026-09-08, 9-query workload):
# a single replica's throughput COLLAPSES under concurrent clients (5.5 qps at
# 1 client -> 2.7 qps at 16, p95 17.8s) because the embedded DuckDB engine
# serializes requests per process, while 4 replicas held a flat ~6 qps at 16
# clients (p50 3.1-4.0s) using only 0.24 cores / 1.3GiB fleet-wide peak. CPU
# and memory bumps on a single replica buy nothing (limits went unused).
replicaCount: 1  # SITE: scale out, not up — enable the HPA below (see documentation/BENCHMARKS.md)

# -- Horizontal autoscaling -----------------------------------------------------
# HorizontalPodAutoscaler (autoscaling/v2). Requires metrics-server for the
# CPU metric. CAUTION, from the same benchmark: steady-state CPU is ~8% of
# limits even at full concurrent load, so the CPU target below fires only on
# heavy scan bursts (runaway-query protection) — NOT on request volume. For
# load-following scale-out add a custom metric (needs prometheus-adapter),
# e.g. requests-per-second per pod targeted at ~1.5, the measured per-pod
# saturation point:
#   extraMetrics:
#     - type: Pods
#       pods:
#         metric:
#           name: sqlhandler_http_requests_per_second
#         target:
#           type: AverageValue
#           averageValue: "1.5"
autoscaling:
  enabled: false  # SITE: recommended true for trials with concurrent agents (4-8 replicas, CPU@80%)
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  # Raw extra HPA metrics appended verbatim (autoscaling/v2 schema).
  extraMetrics: []
  behavior:
    # Scale-up reacts quickly; scale-down is deliberately slow so a burst of
    # MCP tool calls doesn't thrash the fleet.
    scaleUpStabilizationSeconds: 30
    scaleDownStabilizationSeconds: 300

# Spread replicas across nodes (ScheduleAnyway keeps scheduling permissive on
# single-node clusters).
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Budget for voluntary disruptions (node drains) once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Grace period for in-flight MCP tool calls on rollout (gateway allows up
# to 3600s per call; the pod gets this many seconds to finish draining).
terminationGracePeriodSeconds: 90

image:
  # GitHub Container Registry (ghcr.io/ai-solution-eng/...) — same registry as
  # the sibling PCAI apps.
  repository: ghcr.io/ai-solution-eng/sqlhandler
  tag: v2.4.0
  # Optional: pin by digest for production (e.g. "sha256:abcd...").
  digest: ""
  pullPolicy: IfNotPresent

# -- Backend selection -------------------------------------------------------
# One data source is read at a time:
#   s3 | minio    - S3-compatible object store (Parquet files), e.g. MinIO
#                   [default — in-cluster MinIO test bucket]
#   onelake       - Microsoft Fabric OneLake (Delta Lake over ABFS)
#   iceberg       - Apache Iceberg tables through a REST or SQL catalog
#   nfs           - mounted directory (PVC/hostPath) of Parquet/Delta
# NOTE: when using onelake you MUST set backend: onelake explicitly — the
# per-backend credential wiring (and Secret creation) is gated on it.
backend: s3

# -- Federated multi-source mode ---------------------------------------------
# When `sources` is non-empty it OVERRIDES `backend` above: the engine
# federates every source behind one endpoint (cross-source joins work).
# Each entry mirrors the per-backend env vars; `name` becomes the source
# prefix used in the UI and in SQL (name "warehouse" + table "orders" ->
# `warehouse_orders`).
#   sources:
#     - name: sales
#       backend: s3
#       endpointUrl: http://minio.minio.svc.cluster.local:9000
#       bucket: sales-bucket
#       prefix: ""
#       accessKey: ""
#       secretKey: ""
#     - name: inventory
#       backend: s3
#       endpointUrl: http://minio.minio.svc.cluster.local:9000
#       bucket: inventory-bucket
#       prefix: raw
# Credentials land in the ConfigMap (SQLHANDLER_SOURCES as JSON) — for
# production, mount that env var from a Secret instead of values.yaml.
sources: []

# -- External databases (read-only attach) ------------------------------------
# External database servers (postgres | mariadb | mysql | sqlite | sqlserver |
# ducklake | mongodb | bigquery)
# whose tables become queryable — and join-able with lake tables in ONE
# query — as <name>.<schema>.<table>. STRICTLY read-only:
# DuckDB itself rejects writes on the attached catalog (README: External
# databases). The generated SQLHANDLER_ATTACH config carries env-var NAMES
# only (SQLHANDLER_DB_PW_<NAME>); the password values come from the
# <fullname>-db-credentials Secret — rendered here ONLY for entries with a
# non-empty `password`. Prefer managing that Secret out-of-band (kubectl
# create secret) and leaving `password` empty; trust-auth entries (unix
# socket) need no password at all. The wiring is type-agnostic: EVERY entry
# gets SQLHANDLER_DB_PW_<NAME> from the same Secret path, so a new type needs
# no template change — only its `password` value (or none).
#   databases:
#     - name: ops
#       type: postgres        # postgres | mariadb | mysql | sqlite | sqlserver
#                             # (omit `type` for the postgres default)
#       host: postgresql.postgresql.svc.cluster.local
#       port: 5432            # default per type when omitted
#       database: opsdb
#       user: ro_user
#       password: ""          # -> db-credentials Secret; "" = trust-auth
#       params:               # optional TLS / driver options (README: External databases)
#         sslmode: verify-full
#     - name: mdb             # MongoDB (community `mongo` extension — OPT-IN
#       type: mongodb         # at build time, see the Dockerfile note below):
#       host: mongo.internal  # host + default port 27017, database REQUIRED
#       database: opsdb       # (the attach is scoped to one MongoDB database),
#       user: ro_user         # user optional (none by default), params carry
#       password: ""          # srv/tls for Atlas ('srv: "true"', 'tls: "true"').
#     - name: bq              # BigQuery (community `bigquery` extension —
#       type: bigquery        # OPT-IN at build time): database IS the GCP
#       database: my-project  # project or project.dataset; NO host/port/user.
#       password: ""          # Auth is Google ADC in-container (workload
#                             # identity / mounted GOOGLE_APPLICATION_
#                             # CREDENTIALS); `password` = a temporary OAuth2
#                             # access token (empty = ADC), applied by the
#                             # server as a DuckDB Secret scoped to the
#                             # attached project — never in the ATTACH DSN.
#       billing_project: ""   # optional: billing/quota project for public or
#                             # cross-project data (project-billed queries).
# sqlite entries: name, type: sqlite, database = FILE PATH - no host/port/
# user/password, and `params` are not accepted for sqlite.
# ducklake entries (DuckDB's lakehouse format — a SQL catalog database
# pointing at parquet data files): name, type: ducklake, catalog = connect
# string WITHOUT the ducklake: prefix ('sqlite:/path/catalog.db' |
# 'postgres:dbname=… host=…' | 'md:<db>' for MotherDuck), optional data_path
# (DATA_PATH — only used when the catalog is created on first attach), no
# host/port/database/user/params. password rides the SAME db-credentials
# Secret mechanism (motherduck-token catalogs). Row reads through a ducklake
# catalog need SQLHANDLER_DUCKDB_FILE_ACCESS=1 (the catalog's data paths are
# read through DuckDB's own fs layer — README: External databases); the
# attach stays READ_ONLY and writes are refused regardless. mongo + bigquery
# attach types also exist but are OPT-IN at build time (the community
# extensions are not baked into the default image — see the Dockerfile
# ducklake/mongo/bigquery note); configuring them in the default image fails
# with a clear "extension not baked" error. clickhouse and standalone
# motherduck are deliberately NOT types (verified: no 1.5.5 clickhouse ATTACH
# extension exists; a bare md: ATTACH hangs the pod in OAuth).
databases: []
# Opt back IN to DuckDB's own filesystem layer (parquet_scan/COPY/ducklake
# row reads) for the whole pod. Default false = locked down (read_csv
# '/etc/passwd', COPY TO, and extension URL fetches all fail closed).
# Turn on ONLY when an attached source genuinely needs it (ducklake row
# reads) — the attached-catalog SQL guard keeps writes refused either way.
duckdbFileAccess: false

# -- Delta Sharing backend (read-only) -----------------------------------------
# A sixth read-only source via the open Delta Sharing protocol (Databricks
# sharing, OSCAR, any Delta Sharing server): shares/schemas/tables list into
# the same catalog as every other backend, and run_sql joins them with lake
# tables (engine unchanged — the provider strip is the only new code).
# Tables address as <share>_<schema>_<table> (underscore, not dot: a dotted
# DuckDB view name is unaddressable — see sharing.py for the full rationale).
#
# Config is the standard Delta Sharing profile (endpoint + bearer token as
# YAML/JSON). Supply it ONE of two ways:
#   1. sharing.existingConfigMap (+ key) — a profile ConfigMap you own
#      (mounted read-only; preferred, since profiles carry a credential).
#   2. sharing.existingSecret (+ keys) — a Secret with endpoint + bearer
#      token as separate keys (no file; wired via secretKeyRef).
# NEVER paste a bearer token into values. With sharing.enabled the backend
# selector (backend:) must be "sharing" or empty — the render fails loudly
# on any other combination.
sharing:
  enabled: false
  existingConfigMap: ""   # profile ConfigMap name; key below must exist
  existingConfigMapKey: delta-sharing.profile
  existingSecret: ""      # alternative to the ConfigMap: endpoint+token keys
  existingSecretEndpointKey: endpoint
  existingSecretBearerTokenKey: bearer-token
# -- Prometheus scraping -------------------------------------------------------
# PodMonitor so the prometheus-operator scrapes /metrics (engine gauges:
# query rates, cache stats, RSS). The MCP prometheus tools read the same
# Prometheus, so a target here is immediately visible there.
#   security.metricsAuth true: the scrape 401s unless Prometheus presents a
#   credential — set metrics.podMonitor.bearerTokenSecret to a Secret carrying
#   SQLHANDLER_API_TOKEN or one of the /mcp API keys.
metrics:
  podMonitor:
    enabled: true
    # Extra labels on the PodMonitor itself — if the prometheus-operator's
    # podMonitorSelector requires a label (commonly release: prometheus),
    # set it here or the target silently never appears.
    additionalLabels: {}
    # Bearer token for the scrape when security.metricsAuth is true.
    # Shape: {name: <secret>, key: <key>} — omit for open scraping.
    bearerTokenSecret: {}
# -- Naming overrides (rarely needed) ----------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Service account ----------------------------------------------------------
# SQLhandler does not need RBAC to read k8s Secrets by default; keep this
# simple unless you add a SecretProvider tier that requires it.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# -- Service exposure ---------------------------------------------------------
# The MCP streamable-http endpoint is served on port 9097 at path /mcp.
# 9097 is aligned with the other MCP servers in this environment; the
# container listens on the same port (see mcp.port below).
service:
  type: ClusterIP
  port: 9097
  targetPort: 9097

# -- MCP endpoint configuration ----------------------------------------------
mcp:
  transport: streamable-http   # MCP 2.0 transport
  path: /mcp                   # FastMCP default; VirtualService routes on it
  port: 9097                   # container + service port
  readonly: true               # fleet D2: MCP run_sql is SELECT-only (0 = DDL for trusted callers)
  allowedHosts: ""             # optional strict Host allowlist (DNS-rebinding guard, 421 on mismatch)
  allowedOrigins: ""           # extra browser origins; empty = same-origin only
  # -- Response compression (gzip) -------------------------------------------
  # The MCP/JSON-API/UI surfaces return markdown/JSON-heavy text, which
  # gzip compresses 5-10x on the wire. minSize skips tiny responses
  # (health probes, small results) where the round-trip costs more than it
  # saves. SSE/streaming MCP responses are excluded by the middleware.
  compression:
    enabled: true
    # Bytes: responses smaller than this are served uncompressed.
    minSize: 1024

# -- Write tier (GLOBAL FLAG, DEFAULT FALSE — DECISIONS.md) ----------------------
# Agent-facing scratch writes (CREATE TABLE AS / INSERT INTO / COPY INTO)
# under subject-scoped namespaces. DEFAULT OFF = byte-identical to the
# read-only service today (the flag gates ONLY the new capability;
# mcp.readonly keeps governing multi-statement/DDL exactly as before —
# the default posture is unchanged twice over). Even when enabled, every
# target must resolve under <scratch-root>/<subject-slug>/... (no subject
# = no write, ever) and concurrent writers to one table are refused with a
# retryable conflict (single-writer lease on the scratch volume).
writes:
  enabled: false
  scratch:
    # Allowlisted scratch roots: comma-separated [name=]<path> entries
    # (rendered into SQLHANDLER_WRITE_SCRATCH_ROOTS). A path is a mounted
    # directory (NFS PVC; the subject namespace is created under it on
    # first write). Prefix a name with iceberg:// to declare a
    # pyiceberg-managed warehouse root (backend iceberg; catalog settings
    # below). Empty = writes enabled but no target can classify (fail
    # closed — the pod logs loudly).
    roots: ""
    # Advisory single-writer lease TTL in seconds (a crashed writer's
    # lease is broken after this long). 300 default.
    leaseTtl: "300"
    # pyiceberg scratch catalog (backend iceberg only): a SQL-catalog DB
    # URI (sqlite) and/or warehouse root. Unset = the warehouse alone
    # defines a local catalog.
    icebergCatalogUri: ""
    icebergWarehouse: ""
    # RWX NOTE (pvc.yaml render-guard precedent): the scratch volume is
    # WRITTEN per pod and READ by every replica's list_tables — with
    # replicaCount > 1 or autoscaling enabled the mounted root MUST be a
    # ReadWriteMany claim (a ReadWriteOnce claim attaches on one node;
    # the other replicas' writes would hit a path they cannot see). The
    # chart's own scratch PVC (below) enforces RWX under the same guard.
    # A single-replica deployment may also point roots at a pod-local
    # emptyDir path.
    pvc:
      # Create a dedicated RWX PVC for scratch (and mount it at mountPath).
      # Disabled by default — enable together with writes.enabled and point
      # scratch.roots at "<mountPath>".
      enabled: false
      size: 10Gi
      storageClass: ""
      accessModes: []        # default [ReadWriteMany] (render-guarded)
      mountPath: /scratch
      existingClaim: ""      # mount an existing claim instead of creating one
# -- Raw-format landing zone ---------------------------------------------------
# CSV / TSV / JSON / NDJSON / JSONL files (and .gz of each) under the s3 or
# nfs/file backend discover as queryable tables — mirroring Parquet discovery
# semantics exactly (file → table, folder → table, schema folders → schema/name,
# partition dirs fold in). Zero ingestion: drop files in, query them.
#
# This is a LANDING-ZONE feature, not a scan path: raw text has no row-group
# statistics, so every read parses every byte (10-100x more bytes scanned than
# parquet for selective queries) and .gz files cannot be split across cores.
# Tables carry a RAW badge in list/describe/UI; the count(*) metadata fast
# path refuses them (it would lie); the escape hatch for grown-up tables is
# the write tier's COPY (...) TO <scratch>/....parquet promotion.
rawFiles:
  # Master switch (SQLHANDLER_RAW_FORMATS=0 hides every raw table).
  enabled: true
  # Per-file size cap in MB: a table is skipped WHOLE (never partially listed)
  # when any single file exceeds it. 0 = unlimited. For .gz files the cap
  # applies to the COMPRESSED size — the uncompressed size would need a
  # decompression pass per object, so the cap is approximate there (a
  # decompression bomb can exceed it; keep the default on).
  maxFileMB: 64
# -- Query execution ------------------------------------------------------------
# Applies to the DuckDB SQL path — MCP run_sql and the web API alike.
query:
  # Fleet decision D5: per-query wall-clock timeout in seconds (0 = no
  # timeout, the pre-D5 behavior). On expiry the query is interrupted inside
  # DuckDB (no leaked threads/connections) and the caller gets a clean error.
  # The default 600s stops a runaway query from holding one of the
  # concurrency-gate slots forever; genuine >10-minute queries must raise
  # this deliberately (the gateway itself caps calls at 3600s).
  timeoutSeconds: "600"
  # Default row cap for run_sql / scan_table / query_result (0 = uncapped —
  # think hard before raising it fleet-wide; a runaway SELECT * fills both
  # the wire and the model's context). Per-call `limit` overrides downward.
  maxRows: "1000"
  # Row cap for profile_table / column_stats sampling (0 = full table).
  # Statistics over a bounded sample are what an agent needs; the exact
  # row count still comes from Parquet/Delta metadata for free.
  profileMaxRows: "1000000"
  # Max concurrent async query jobs (query_submit; HTTP 429 beyond it).
  maxJobs: 8
  # Query-memory resource depth: how many recent query outcomes the
  # sqlhandler://query-memory resource keeps (0 disables recording).
  queryMemorySize: 50
  # Bare `SELECT cols FROM t LIMIT n` previews read the FIRST data file's
  # first row group instead of enumerating every fragment of a large table
  # (the same access pattern as the count(*) fast path: an agent's first
  # look at a table). LIMIT without ORDER BY guarantees no row subset, so
  # the first physical rows are the same SQL contract, just delivered
  # without the full enumeration. false = the normal query path.
  previewFastpath: true
# -- Resources ----------------------------------------------------------------
# Sized from the G2 concurrency benchmark (2026-09-08): 4 replicas held ~6 qps
# at 16 concurrent clients with a fleet-wide peak of 0.24 cores / 1.3GiB, so
# the REQUESTS below are all the reservation the scheduler needs — the
# workload idles near-zero and bursts only during scans. LIMITS stay generous
# because the actual target is big data:
#   - memory: DuckDB's in-query budget is duckdbMemoryFraction (0.6) x the
#     memory LIMIT — 16Gi keeps a ~9.6Gi budget before DuckDB spills to
#     spillDir instead of being OOMKilled mid-join (which also wipes every
#     in-process cache).
#   - cpu: the limit governs how many threads ONE wide scan/aggregate can use
#     in parallel (DuckDB defaults its thread count to the core limit).
# The memory REQUEST is purely a scheduler reservation (DuckDB's budget keys
# off the LIMIT — see src/sqlhandler/resources.py) — but keep it at or above
# steady-state RSS: under node memory pressure the kubelet evicts pods whose
# usage exceeds their request first. 1Gi covers observed usage (~0.3GiB fresh,
# ~1.1GiB long-warmed) with margin; don't go below that.
# Raise the limits (not the requests) on sites running very wide tables or
# large joins; the requests can stay put in every case observed so far.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 16Gi

# -- Probes --------------------------------------------------------------------
# /health and /ready are served by the container (server.py).
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  # /ready performs a real backend check (server allows ~17s: 2s handler +
  # 15s connection test). A 3s timeout here would flap a slow-but-healthy
  # backend out of the Service before the server can answer.
  timeoutSeconds: 20
startupProbe:
  # Gates liveness/readiness until the server is listening — prewarm (and a
  # cold parquet discovery on first describe) can outlive the old 15s
  # initialDelay, and without this the kubelet restarts a healthy pod that
  # was merely still warming up.
  enabled: true
  periodSeconds: 5
  failureThreshold: 24

# -- Workload security hardening ------------------------------------------------
# Defense-in-depth for a network-facing SQL endpoint. Each piece can be
# turned off individually without leaving the hardened profile.
security:
  # Master switch: run as non-root, seccomp RuntimeDefault, no privilege
  # escalation, dropped capabilities, read-only root filesystem, no
  # auto-mounted ServiceAccount token, plus an optional ingress
  # NetworkPolicy (security.networkPolicy.enabled below, default false).
  hardened: true
  # Ingress NetworkPolicy: default-deny, then allow (a) the pod's own
  # namespace, (b) the Istio gateway namespace below, (c) allowedNamespaces.
  # Egress is NOT restricted (the server must reach AAD/OneLake/S3).
  #
  # DEFAULT OFF: in-cluster callers (MCP agents, OWUI, DSH, ...) reach the
  # Service directly with zero friction — the right posture for short-lived
  # test deployments. The Service stays ClusterIP, so nothing is exposed
  # outside the cluster. Turn this ON for production / real-data
  # deployments, and add direct-caller namespaces to allowedNamespaces
  # below (flipping it on re-breaks any caller not listed).
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    # Extra namespaces whose pods may call this service directly
    # (in-cluster MCP clients, OWUI, DSH, ...). Cluster-internal access
    # stays frictionless: add the client's namespace here.
    allowedNamespaces: []
    # Raw extra NetworkPolicy `from:` peers (CIDRs, podSelectors...),
    # appended verbatim to the ingress rules.
    additionalIngress: []
  # Pod-level Istio AuthorizationPolicy (east-west, service-to-service).
  # Off by default: principal names are deployment-specific and a wrong
  # list locks the service completely. The gateway authz (ezua.*) plus the
  # NetworkPolicy above already cover the common cases. When enabled, at
  # least one of principals/namespaces is REQUIRED (an ALLOW policy with
  # no rules would deny everything).
  authorizationPolicy:
    enabled: false
    # e.g. ["cluster.local/ns/istio-system/sa/ezaf-gateway-service-account"]
    principals: []
    # Allowed caller namespaces (Istio identity namespaces).
    namespaces: []
  # OPTIONAL /mcp API-key gate: point at an out-of-band Secret whose key holds
  # a comma-separated key list (X-API-Key or Bearer); empty = open behind the
  # gateway (loud startup warning). The chart never creates or inlines keys.
  apiKey:
    existingSecret: ""         # SITE: e.g. "mcp-fleet-apikeys" (key: api-keys)
    existingSecretKey: api-keys
  # 1 gates /metrics behind the API token / an /mcp API key (X-API-Key /
  # X-API-Token / Bearer). Default off = unauthenticated. /ready is NEVER
  # gated — kubelet readiness probes cannot carry a secret (gating strands
  # pods NotReady).
  metricsAuth: false
  # Per-caller identity + policy-as-code (implementation review §3/§5):
  identity:
    # TRUST GATE for the oauth2-proxy browser rung (X-Auth-Request-User /
    # X-Forwarded-Groups). FALSE (default) = those headers are ignored —
    # identity resolves via the gateway's relay attribution header (over a
    # valid /mcp key), the matched-key fingerprint, or anonymous. TRUE
    # ASSERTS the workload AuthorizationPolicy pins ingress to the gateway
    # (authorizationPolicy.enabled above) — only then can a browser header
    # be trusted (anyone who can reach the pod can otherwise forge them).
    trustBrowserHeaders: false
  # Policy-as-code: per-caller row filters + column masks + hidden tables
  # from an operator-authored JSON/YAML file (hot-reloaded on mtime).
  # DEFAULT OFF = the whole feature is byte-identical to before (no policy
  # hash in any cache key, no masking views, shared query memory/saved
  # queries). Enabling requires a policy file — unbound keys then fall to
  # the file's default_group (the restricted default).
  policy:
    enabled: false
    # ConfigMap (or any readable path) carrying the policy document; wire it
    # as a volume+mount (semanticCatalog's pattern) and point this at the
    # mounted file. Empty = no policy configured (enforcement inert).
    existingConfigMap: ""
    existingConfigMapKey: policy.json
    mountPath: /etc/sqlhandler/policy
  # Optional auth gate on /metrics ONLY (audit: /metrics leaks table counts,
  # RSS and error strings unauthenticated). Default false = today's
  # behavior (open). When true, a scrape/read must present SQLHANDLER_API_TOKEN
  # or an /mcp API key (MCP_API_KEYS / SQLHANDLER_API_KEYS) as
  # X-API-Key / X-API-Token / Bearer — wire the matching header into the
  # Prometheus scrape config; liveness (/health) AND readiness (/ready)
  # probes stay open: kubelet probes cannot carry a secret, and a gated
  # /ready strands every pod NotReady (live-seen 2026-09-18). With the gate
  # on but NO credential source configured, /metrics 401s for everyone
  # (fail closed, loud startup warning).
  metricsAuth: false
  # Ingress NetworkPolicy: default-deny, then allow (a) the pod's own
  # namespace, (b) the Istio gateway namespace below, (c) allowedNamespaces.
  # Egress is NOT restricted (the server must reach AAD/OneLake/S3).
  #
  # DEFAULT OFF: in-cluster callers (MCP agents, OWUI, DSH, ...) reach the
  # Service directly with zero friction — the right posture for short-lived
  # test deployments. The Service stays ClusterIP, so nothing is exposed
  # outside the cluster. Turn this ON for production / real-data
  # deployments, and add direct-caller namespaces to allowedNamespaces
  # below (flipping it on re-breaks any caller not listed).
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    # Extra namespaces whose pods may call this service directly
    # (in-cluster MCP clients, OWUI, DSH, ...). Cluster-internal access
    # stays frictionless: add the client's namespace here.
    allowedNamespaces: []
    # Raw extra NetworkPolicy `from:` peers (CIDRs, podSelectors...),
    # appended verbatim to the ingress rules.
    additionalIngress: []
  # Pod-level Istio AuthorizationPolicy (east-west, service-to-service).
  # Off by default: principal names are deployment-specific and a wrong
  # list locks the service completely. The gateway authz (ezua.*) plus the
  # NetworkPolicy above already cover the common cases. When enabled, at
  # least one of principals/namespaces is REQUIRED (an ALLOW policy with
  # no rules would deny everything).
  authorizationPolicy:
    enabled: false
    # e.g. ["cluster.local/ns/istio-system/sa/ezaf-gateway-service-account"]
    principals: []
    # Allowed caller namespaces (Istio identity namespaces).
    namespaces: []
  runAsUser: 1000
  readOnlyRootFilesystem: true
  # The app never calls the Kubernetes API; don't hand it a token.
  automountServiceAccountToken: false

# -- OneLake / Fabric connection ---------------------------------------------
# Sensitive values go in a Kubernetes Secret; non-secret connection details
# go in a ConfigMap. NEVER put the service-principal secret in values.yaml.
#
# fabric.credentialsSecret.name refers to a Secret you create separately
# (via `kubectl create secret`, or by the chart when
# fabric.credentialsSecret.create is true).
fabric:
  # Secret name + keys holding the Entra service-principal credential.
  credentialsSecret:
    name: fabric-credentials
    tenantIdKey: tenant-id
    clientIdKey: client-id
    clientSecretKey: client-secret
    # Set create: true AND fill the values below ONLY to have the chart
    # create the Secret for you (e.g. a non-production bootstrap). Prefer
    # creating the Secret out-of-band with `kubectl create secret` or a
    # sealed/encrypted Secret so the service-principal secret never lands
    # in a values file. NEVER commit real credentials.
    create: false
    values:
      tenantId: ""
      clientId: ""
      clientSecret: ""

  # Non-secret connection details injected via ConfigMap.
  lakehouseAbfssUrl: ""          # e.g. abfss://<ws>@onelake.dfs.fabric.microsoft.com/<lh>
  workspaceId: ""                # fallback (if no full URL)
  lakehouseId: ""                # fallback (if no full URL)
  authority: onelake.dfs.fabric.microsoft.com
  # Extra delta-rs storage options (JSON-merged into the env): object-client
  # retries, timeouts, connection behavior for the OneLake backend.
  storageOptions: {}

# -- S3 / MinIO backend (used when backend: s3) ------------------------------------
# Non-secret values (endpoint/bucket/prefix) go in the ConfigMap; the access
# key and secret go through a Kubernetes Secret - NEVER in values.yaml.
s3:
  # Secret name + keys holding the S3 credentials. Create the Secret
  # out-of-band (the default), e.g.:
  #   kubectl -n <namespace> create secret generic s3-credentials \
  #     --from-literal=access-key=<S3_ACCESS_KEY> \
  #     --from-literal=secret-key=<S3_SECRET_KEY>
  # Retrieve/rotate later with:
  #   kubectl -n <namespace> get secret s3-credentials -o jsonpath='{.data.access-key}' | base64 -d
  #   kubectl -n <namespace> get secret s3-credentials -o jsonpath='{.data.secret-key}' | base64 -d
  # Dev/local credentials that must stay out of git belong in helm/local/
  # (gitignored — see helm/local/README.md).
  credentialsSecret:
    name: s3-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    # Keep false: with create: true the chart renders the Secret FROM the
    # values below, which then live in values files and the Helm release
    # secret (readable via `helm get values <release> -a`). Only for
    # throwaway clusters, never for a shared chart.
    create: false  # SITE: keep false for a customer trial — create the Secret out-of-band
                   # (helm/local/README.md); set true ONLY on a throwaway cluster.
    values:
      accessKey: "<S3_ACCESS_KEY>"  # SITE: filler (used only when create: true)
      secretKey: "<S3_SECRET_KEY>"  # SITE: filler (used only when create: true)

  # MinIO/S3 connection details (non-secret -> ConfigMap).
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"   # SITE: point at the trial's S3/MinIO
  region: us-east-1
  bucket: "<BUCKET>"                              # SITE: required
  prefix: ""                  # SITE: optional sub-tree within the bucket
  anonymous: false            # read public buckets without keys
  useSsl: false               # force https when endpointUrl has no scheme
  # Extra pyarrow S3FileSystem kwargs (JSON-merged into the env): timeouts,
  # retry limits, connection behavior. e.g. {request_timeout: 120}
  options: {}

# -- Iceberg backend (used when backend: iceberg) ---------------------------------
# Tables are discovered through an Iceberg catalog; the Parquet data files
# live in your object store (S3_* storage vars) or on a local disk. The
# catalog token (REST) and S3 keys go through a Secret, never values.yaml.
iceberg:
  catalogType: rest            # rest | sql
  catalogUri: ""              # e.g. http://rest-catalog:8181 or sqlite:///path
  catalogName: sqlhandler      # SQL catalogs partition by this name
  warehouse: ""               # optional table location root
  namespace: ""               # optional namespace filter
  # Nessie branch/tag pinned for reads (catalogType: nessie only). Rendered
  # as ICEBERG_NESSIE_REF; empty = the catalog's default branch.
  nessieRef: ""
  # Credentials Secret: REST token + S3 access/secret keys (create out-of-band).
  credentialsSecret:
    name: iceberg-credentials
    tokenKey: token
    accessKeyKey: access-key
    secretKeyKey: secret-key
    create: false
    values:
      token: ""
      accessKey: ""
      secretKey: ""
  # S3 storage for the Iceberg data files (optional).
  storage:
    endpointUrl: ""
    region: us-east-1
    anonymous: false

# -- NFS / local filesystem backend (used when backend: nfs) ---------------------
# Reads Parquet files from a directory mounted into the container (hostPath,
# NFS via a PV/PVC, or any volume). No credentials required.
nfs:
  # Absolute path of the mounted directory containing Parquet files.
  rootDir: "/data"
  # Optional volume to mount providing the data (only when backend: nfs).
  mount:
    enabled: false
    pvcName: ""           # PVC to mount
    mountPath: "/data"    # where it is mounted inside the container
    readOnly: true


# -- ADLS Gen2 backend (used when backend: adls) ----------------------------------
# Reads Parquet/Delta (and raw landing-zone files) from an Azure Data Lake
# Storage Gen2 container via pyarrow's native AzureFileSystem + delta-rs.
# Non-secret connection details (account/container/prefix) go in the
# ConfigMap; the client secret NEVER renders — ADLS_CLIENT_SECRET_ENV carries
# the NAME of the env var, and the deployment wires that var from the Secret
# below via secretKeyRef (the onelake credentials pattern).
adls:
  enabled: false
  account: ""             # storage account name (required)
  filesystem: ""          # container / filesystem name (required); alias: container
  container: ""           # alias of filesystem (set exactly one)
  prefix: ""              # optional sub-tree within the container
  auth: anon              # anon | client-secret
  tenantId: ""            # Entra tenant (client-secret mode)
  clientId: ""            # Entra app/client id (client-secret mode)
  # Secret (created out-of-band) whose key holds the client secret. NEVER put
  # the secret value in values — only the Secret NAME and KEY land here.
  existingSecret: ""
  existingSecretClientSecretKey: client-secret
  # Sovereign clouds: core.windows.net (default) | core.usgovcloudapi.net |
  # core.chinacloudapi.cn
  endpointSuffix: ""

# -- GCS backend (used when backend: gcs) -----------------------------------------
# Reads Parquet/Delta (and raw landing-zone files) from a Google Cloud Storage
# bucket via pyarrow's native GcsFileSystem + delta-rs. The service-account
# JSON key file is MOUNTED (operator supplies the volume — e.g. a Secret
# volume); GCS_CREDENTIALS_FILE points at the mounted path, never at key
# CONTENTS in values.
gcs:
  enabled: false
  bucket: ""              # bucket name (required)
  prefix: ""              # optional sub-tree within the bucket
  projectId: ""           # only needed for bucket creation; reads work without
  # Mounted path of the service-account key file (requires the operator's
  # volume mount; empty = ambient application-default credentials).
  credentialsFile: ""
  anonymous: false        # read a public bucket with no credential

# -- Metadata caching --------------------------------------------------------
# In-process cache for list_tables / describe_table (see README "Performance
# & caching"). These map to SQLHANDLER_CACHE_TTL / SQLHANDLER_PREWARM_TABLES.
cache:
  # Seconds to keep list_tables / describe_table results in memory (0 disables).
  ttl: 3600
  # How often (seconds) a Delta snapshot version is re-checked to invalidate a
  # cached Dataset (0 = every query; default 10).
  versionCheckInterval: 10
  # Comma-separated table names whose data should be warmed at startup,
  # e.g. "work_order_header,work_order_note_recent".
  prewarmTables: ""
  # Data prewarm (pairs with prewarmTables + the usage-driven list): when
  # the disk block cache is enabled, the FIRST N row groups of each prewarm
  # table are read through it at startup, so the cold first query of the
  # day hits warm pod-local blocks instead of object-store round trips.
  # 0 = off (describe-cache warming only); local/NFS backends are skipped
  # (the OS page cache does that job for free — see blockCache.includeLocal).
  prewarmRowgroups: 1
  # Serve list_tables from the cache immediately and refresh it in the
  # background (plus automatically once per `ttl` seconds), so callers never
  # block on the slow S3/DFS listing. Set false for fully synchronous calls.
  # Serve list_tables from the cache immediately and refresh it in the
  # background (plus automatically once per `ttl` seconds), so callers never
  # block on the slow S3/DFS listing. Set false for fully synchronous calls.
  listAsyncRefresh: true
  # DuckDB query-engine budget as a fraction of the POD's memory limit (see
  # src/sqlhandler/resources.py) — DuckDB spills to `spillDir` when a query
  # would otherwise grow RSS past the pod limit and get OOMKilled (which
  # wipes every in-process cache). "0" disables the cap (DuckDB defaults).
  duckdbMemoryFraction: "0.6"
  # Directory DuckDB spills to — under /tmp, which the hardened profile
  # backs with an emptyDir that survives container restarts.
  spillDir: /tmp/sqlhandler-duckdb-spill
  # Directory for the disk-warm metadata cache (survives container restarts
  # so the first describe after an OOMKill is not cold). Point at a PVC
  # mount path to also survive pod rescheduling.
  cacheDir: /tmp/sqlhandler-cache
  # -- Virtual-table performance (README: "Virtual tables") -----------------
  # Seconds a virtual table's materialized result is reused. The cache key
  # covers the definition (and everything it builds on) plus every base
  # table's Delta/Iceberg snapshot version, so new ETL commits invalidate
  # immediately; the TTL is only a backstop. 0 disables materialization.
  virtualCacheTtl: 3600
  # Where materialized results are written. Default: cacheDir above. Point
  # at an RWX PVC shared by all replicas to materialize once per deployment
  # instead of once per pod.
  virtualCacheDir: ""
  # Cluster (sort) materialized virtual results by their lowest-cardinality
  # columns so row-group statistics prune filtered reads. 0 disables.
  virtualCacheSort: true
  # Seconds an identical query's result is served from memory (keyed by
  # sql/params/limits + base-snapshot versions). 0 disables.
  resultCacheTtl: 3600
  # In-memory byte cap for cached query results (LRU-evicted).
  resultCacheMaxBytes: "268435456"
  # -- Shared L2 result cache (cross-replica) --------------------------------
  # SHOWCASE-ready but OFF in this file: the demo win ("4 replicas share one
  # warm cache") only exists across replicas, and this example deploys
  # replicaCount: 1 with no shared store PVC mounted yet. To turn it on:
  #   1. enable semanticCatalog.store below (or mount any RWX claim), then
  #   2. set enabled: true + dir: <store mountPath>/l2-cache — the dir MUST
  #      sit on a ReadWriteMany volume (RWO strands the other replicas'
  #      cache silently, with no error inside the pod). Turning it off is
  #      just enabled: false (chart default, byte-identical behavior).
  l2:
    enabled: false
    dir: ""
    ttl: "3600"
    minBytes: "262144"
    maxBytes: "2147483648"
    # Example (uncomment the block once the store PVC is mounted):
    #   enabled: true
    #   dir: /var/lib/sqlhandler-catalog/l2-cache
  # -- Disk block cache (object-store reads) --------------------------------
  # Opt-in disk cache for parquet footers/column chunks read through pyarrow
  # filesystems (s3 + iceberg backends; delta-rs IO on onelake is not
  # wrappable). Off by default: cold big sequential scans pay a small
  # Python-layer cost, repeated/filtered/preview reads win big.
  blockCache:
    enabled: false
    # Cache location. Default: <tmp>/sqlhandler-block-cache.
    dir: ""
    # Bytes per cached block (bigger = fewer remote round-trips).
    blockSize: "8388608"
    # Total cache size; the cache resets itself when exceeded.
    maxBytes: "4294967296"
    # 1 also caches LocalFileSystem paths — NFS mounts ARE LocalFileSystem
    # to pyarrow while being network; real-local disk is already covered by
    # the OS page cache.
    includeLocal: false

# -- Saved-query store (query_save / query_list / query_delete / query_saved) --
# Where the saved-parameterized-queries JSON file lives. EMPTY (default) →
# next to the disk-warm cache — in every hardened deployment that is /tmp,
# an emptyDir, so a POD RESCHEDULE (image update, node drain, OOMKill
# eviction) silently forgot every user-saved query. Two durable fixes, in
# precedence order:
#   1. set savedQueriesPath here (or the env var directly) — absolute path;
#      MUST sit on a mounted volume (the readOnlyRootFilesystem posture
#      leaves only mounts writable);
#   2. leave empty + semanticCatalog.store.enabled=true (the catalog PVC) —
#      the chart then renders <store mountPath>/saved-queries.json, durable
#      with zero extra volumes. RWX store class + replicas > 1: saves race
#      benignly (last write wins, atomic per write).
# Same file semantics in every mode: atomic temp+rename, 0600, corrupt file
# degrades to an empty store rather than an error.
savedQueriesPath: ""
# -- Semantic catalog ----------------------------------------------------------
# The "semantic view": human-written table/column descriptions merged into
# list_tables / describe_table output (and the MCP resources), so agents see
# business meaning, not just dtypes. Full spec + shareable data-owner guide:
# docs/semantic-catalog.md (README: "Semantic catalog").
#
# Deploy = set enabled: true and paste your catalog AS NATIVE YAML under
# `tables:` below — no stringification, it is ordinary values structure. The
# chart renders it into a ConfigMap, mounts it read-only at
# <mountPath>/semantic-catalog.json, and points SQLHANDLER_CATALOG at it.
# The engine hot-reloads the file on change (mtime), so a catalog edit via
# `helm upgrade` (or a PCAI re-deploy) updates the docs WITHOUT a pod
# restart. A broken catalog never breaks queries — it degrades to empty.
#
# Zero-values alternative: deploy as-is, then upload a .json/.yaml catalog
# from the data explorer's "Semantic catalog" panel (POST
# /api/semantic-catalog; store defaults next to cache.cacheDir). Uploads are
# per-replica and pod-local (emptyDir) unless SQLHANDLER_CATALOG_STORE points
# at a PVC — the values route below is the durable, all-replica one.
semanticCatalog:
  enabled: false  # SITE: paste a catalog as native YAML here, or enable the
                  # upload store (below) and seed it from the /ui panel post-deploy
  # Directory inside the pod where the catalog ConfigMap is mounted (the
  # file lands at <mountPath>/semantic-catalog.json). Rarely changed.
  mountPath: /etc/sqlhandler
  # The catalog as NATIVE values — paste plain YAML, no stringification:
  #   tables:
  #     <schema/name | source-qualified | bare>:
  #       description: ...
  #       aliases: [...]
  #       columns: {col: doc}
  #       definition: |          # optional — makes the entry a VIRTUAL table
  #         SELECT ...           # (single read-only SELECT/WITH, DuckDB dialect)
  # Rendered to canonical JSON into the ConfigMap. Entry shapes are validated
  # at render time (each table entry must be a mapping) — operator-authored
  # config must not fail silently (same philosophy as SQLHANDLER_ATTACH).
  tables: {}
  # Alternative: the catalog as an inline JSON STRING ({"tables": {...}}) —
  # for machine-generated catalogs. Mutually exclusive with `tables` and
  # `yaml` (setting more than one non-empty fails the render).
  json: ""
  # Alternative: the catalog as an inline YAML STRING — verbatim paste of a
  # semantic-catalog.yaml file, no re-indenting needed. The engine reads YAML
  # natively, so the string is stored as-is. Mutually exclusive with `tables`
  # and `json`.
  yaml: ""
  # Alternative for teams managing the catalog out-of-band (like credential
  # Secrets): name of an EXISTING ConfigMap carrying a `semantic-catalog.json`
  # key. When set, the chart renders no ConfigMap of its own but still mounts
  # it and wires the env var.
  existingConfigMap: ""
  # -- Upload store: persisted + cross-pod --------------------------------------
  # By default UI/API catalog uploads land next to the disk cache on the pod's
  # tmp emptyDir: per-replica, and gone on reschedule. Enable the store to
  # back uploads with a PVC instead — an upload from any replica then reaches
  # every replica and survives rescheduling, still with NO rollout (the
  # engine hot-reloads the file on mtime change). Works standalone too (with
  # enabled: false above): deploy, then seed the catalog from the UI. Until a
  # first upload exists, the values catalog above — if any — is what every
  # pod serves.
  # REQUIREMENT: ReadWriteMany storage whenever replicas can exceed 1. RWO
  # classes (EBS, local-path, ...) attach on one node only and strand the
  # other replicas Pending — the render fails loudly on that mismatch.
  store:
    enabled: false
    # When set, mount this existing PVC (no PVC is created). Leave "" to
    # have the chart create one named <release>-catalog.
    existingClaim: ""
    # Catalog content is KBs of text — 1Gi is ~100x headroom.
    size: 1Gi
    # "" = cluster default StorageClass; it must offer the access mode below.
    storageClass: ""
    # [ReadWriteOnce] ONLY for single-replica deployments (replicaCount: 1,
    # autoscaling off) — PVC access modes are immutable once created.
    accessModes: [ReadWriteMany]
    # Where the store volume is mounted; SQLHANDLER_CATALOG_STORE points at
    # <mountPath>/semantic-catalog.json. The upload API writes here, so the
    # mount is read-write (unlike the values-catalog ConfigMap mount).
    mountPath: /var/lib/sqlhandler-catalog

# -- Per-caller policy-as-code (COMMENTED — not a values key yet) -----------
# Row filters + column masks per caller identity, from an operator-authored
# file. NOT enabled here: it needs an authored policy file to function and
# the chart does not render its env vars yet — enable by adding BOTH env
# vars below to the ConfigMap (or the deployment env) once the file exists
# on a mounted volume:
#   SQLHANDLER_POLICY_ENABLED: "1"
#   SQLHANDLER_POLICY_FILE: /var/lib/sqlhandler-catalog/policy.yaml
# (enabled-without-file is inert — enforcement resolves an empty policy —
# so an early flip is safe but demos nothing.) Minimal example file
# (masked callers never share cache entries with unmasked ones; the
# policy hash is folded into every cache key automatically):
#   version: 1
#   default_group: restricted
#   groups:
#     analysts:
#       tables:
#         "orders": {row_filter: "region != 'EU'", column_masks: {unit_price: redact}}
#   subjects: {alice: [analysts]}

# -- Runtime arguments for the sqlhandler entrypoint --------------------------
containerArgs:
  - --transport
  - streamable-http
  - --host
  - 0.0.0.0
  - --port
  - "9097"

# -- Ingress (optional; PCAI normally uses the Istio VirtualService below) ----
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sqlhandler.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Pod-level annotations / node placement -------------------------------------
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------
# When enabled, deploys the Istio VirtualService, Istio AuthorizationPolicy,
# and a Kyverno ClusterPolicy that tags this workload as a vendor-service so
# the PCAI platform can discover and monitor the MCP endpoint.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"   # informational only — no template reads it

  # Kyverno ClusterPolicy that tags this workload as a PCAI vendor-service.
  # Disable on clusters without the kyverno.io CRD — the post-install hook
  # would otherwise fail the whole release (the same labels are already set
  # directly by sqlhandler.ezua.labels in _helpers.tpl).
  kyverno:
    enabled: true

  virtualService:
    # Public endpoint on the PCAI gateway. MCP clients connect to:
    #   https://<endpoint>/mcp
    endpoint: "sqlhandler.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    # Default for normal calls (health etc.); the /mcp route uses longTimeout.
    timeout: 60s
    # MCP streamable-http is long-lived (tool calls, streaming responses).
    longTimeout: 3600s

  # configure the authorization policy (oauth2-proxy in front of PCAI).
  # SITE: hosted-trial standard keeps this ON — external callers authenticate
  # at the PCAI gateway. Only switch it off for closed in-cluster trials.
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"