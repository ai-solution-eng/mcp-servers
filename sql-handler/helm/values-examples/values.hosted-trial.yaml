# ============================================================================
# SQLhandler — hosted-trial example values (sanitized, SECRET-FREE, paste-ready).
# Full guide: documentation/DEPLOYMENT.md.
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# ============================================================================

# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. ezua.virtualService.endpoint + .istioGateway — render FAILS while
#      ezua.enabled (default); MCP clients use https://<endpoint>/mcp. Keep the
#      ${DOMAIN_NAME} placeholder — the PCAI values editor resolves it.
#   2. backend: + its credential Secret OUT-OF-BAND (helm/local/README.md) —
#      s3 | onelake | iceberg | nfs | adls | gcs | sharing; the per-backend
#      wiring is gated on the choice (onelake MUST be explicit; chart default
#      s3). Without the Secret the backend-aware /ready drains the pods.
#   3. nfs.mount.pvcName — render FAILS when nfs.mount.enabled: true.

# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer)
#   Scale-out & resources: replicaCount/autoscaling (the HPA owns replicas;
#     requests.cpu doubles as the HPA threshold) — documentation/DEPLOYMENT.md §4.1.
#   Identity & SSO ladder: security.apiKey (the /mcp key gate — DEFAULT OPEN
#     without it; set it unless the gateway edge fronts the service),
#     security.identity.*, security.oidc.* (JWT rung) + security.oidc.sso.*
#     (browser SSO), adminKeys + selfMintMaxKeys — §4.7/§4.10.
#   Policy-as-code: security.policy.* (datasets ACL) — §4.7.1.
#   Other data sources: sources: (federated), databases: (read-only attach) — §5.
#   Semantic catalog + saved queries: semanticCatalog.* (+ .store PVC),
#     savedQueriesPath — §6.
#   Caches: cache.l2 / blockCache / prewarm — §4.6.
#   Network zone: security.networkPolicy.* — values-examples/values-hardened-g2.yaml.
#   Metrics: metrics.podMonitor.* (+ security.metricsAuth) — §4.3.

# ============================================================================
# Deployment / Scaling
# ============================================================================

replicaCount: 1  # scale out, not up — enable the HPA below (see documentation/BENCHMARKS.md)

# HPA (autoscaling/v2; needs metrics-server). CAUTION: CPU target is a % OF REQUEST.
autoscaling:
  enabled: false  # recommended true for trials with concurrent agents (4-8 replicas, CPU@80%)
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  extraMetrics: []

  behavior:
    # Scale up fast, scale down slowly so a burst of MCP calls doesn't thrash the fleet.
    scaleUpStabilizationSeconds: 30
    scaleDownStabilizationSeconds: 300

# Spread replicas across nodes; ScheduleAnyway keeps single-node clusters schedulable.
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Budget for voluntary disruptions (node drains) once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Grace period for in-flight MCP tool calls on rollout (the gateway allows 3600s per call).
terminationGracePeriodSeconds: 90

image:
  repository: ghcr.io/ai-solution-eng/sqlhandler
  tag: v3.7.0
  # Optional: pin by digest for production (e.g. "sha256:abcd...").
  digest: ""
  pullPolicy: IfNotPresent

# ============================================================================
# Backend Selection
# ============================================================================

# s3 | minio | onelake | adls | gcs | iceberg | nfs | sharing — onelake must be explicit.
backend: s3

# Federated mode: non-empty `sources` OVERRIDES `backend` — one endpoint, cross-source JOINs.
sources: []

# External databases (STRICTLY read-only attach): postgres | mariadb | mysql |
# sqlite | sqlserver | ducklake | mongodb | bigquery — see helm/values.yaml.
databases: []

# Opt back IN to DuckDB's own fs layer (parquet_scan/COPY/ducklake reads); default locked down.
duckdbFileAccess: false

# Delta Sharing (read-only): profile via existingConfigMap or existingSecret — NEVER in values.
sharing:
  enabled: false
  existingConfigMap: ""   # profile ConfigMap name; key below must exist
  existingConfigMapKey: delta-sharing.profile
  existingSecret: ""      # alternative to the ConfigMap: endpoint+token keys
  existingSecretEndpointKey: endpoint
  existingSecretBearerTokenKey: bearer-token

# ============================================================================
# Metrics
# ============================================================================

# Prometheus-operator scrape of /metrics (bearerTokenSecret when metricsAuth is true).
metrics:
  podMonitor:
    enabled: true
    # Extra labels — must carry the podMonitorSelector match label or the target is never scraped.
    additionalLabels: {}
    # Bearer token for the scrape when security.metricsAuth is true; {name:, key:}.
    bearerTokenSecret: {}

nameOverride: ""

fullnameOverride: ""

# SQLhandler needs no Kubernetes RBAC by default.
serviceAccount:
  create: false
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 9097
  targetPort: 9097

mcp:
  transport: streamable-http   # MCP 2.0 transport
  path: /mcp                   # FastMCP default; VirtualService routes on it
  port: 9097                   # container + service port
  readonly: true               # MCP run_sql is SELECT-only (0 = DDL for trusted callers)
  allowedHosts: ""             # optional strict Host allowlist (DNS-rebinding guard, 421 on mismatch)
  allowedOrigins: ""           # extra browser origins; empty = same-origin only
  # gzip for MCP/JSON-API/UI responses; SSE/streaming excluded.
  compression:
    enabled: true
    # Bytes: responses smaller than this are served uncompressed.
    minSize: 1024

# ============================================================================
# Write Tier
# ============================================================================

# Scratch writes: targets must resolve under <scratch-root>/<subject-slug>/....
writes:
  enabled: false

  scratch:
    # Allowlisted scratch roots: comma-separated [name=]<path> dirs (iceberg:// = pyiceberg root).
    roots: ""
    # Advisory single-writer lease TTL (seconds; a crashed writer's lease breaks after this long).
    leaseTtl: "300"
    # pyiceberg scratch catalog (backend iceberg only): SQL-catalog DB URI.
    icebergCatalogUri: ""
    icebergWarehouse: ""
    # RWX: with replicas > 1 the scratch root MUST be a ReadWriteMany claim.
    pvc:
      # Dedicated RWX PVC for scratch — point scratch.roots at "<mountPath>".
      enabled: false
      size: 10Gi
      storageClass: ""
      accessModes: []        # default [ReadWriteMany], guarded at render
      mountPath: /scratch
      existingClaim: ""      # mount an existing claim instead of creating one

# ============================================================================
# Raw-Format Landing Zone
# ============================================================================

# CSV/TSV/JSON/NDJSON/JSONL (+.gz) land as tables with Parquet folder conventions.
rawFiles:
  # Master switch (SQLHANDLER_RAW_FORMATS=0 hides every raw table).
  enabled: true
  # Per-file size cap in MB; a table is skipped WHOLE if any file exceeds it (0 = unlimited).
  maxFileMB: 64

# ============================================================================
# Query Execution
# ============================================================================

# Applies to the DuckDB SQL path — MCP run_sql and the web API alike.
query:
  # Per-query wall-clock timeout (0 = none); the gateway caps calls at 3600s.
  timeoutSeconds: "600"
  # Default row cap for run_sql / scan_table / query_result (0 = uncapped; per-call limit overrides).
  maxRows: "1000"
  # Row cap for profile_table / column_stats sampling (0 = full table)
  profileMaxRows: "1000000"
  # Max concurrent async query jobs (query_submit; HTTP 429 beyond it).
  maxJobs: 8
  # How many recent query outcomes the sqlhandler://query-memory resource keeps (0 disables).
  queryMemorySize: 50
  # Bare `SELECT ... LIMIT n` previews read one row group instead of every fragment.
  previewFastpath: true

# ============================================================================
# Resources
# ============================================================================

# LIMITS key DuckDB's thread count/memory budget; requests.cpu carries the HPA threshold.
resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {cpu: "4", memory: 16Gi}

# Probes: /health and /ready are served by the container (server.py).
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  # /ready does a real backend check — a short timeout flaps a slow backend out of the Service.
  timeoutSeconds: 20

startupProbe:
  # Gates liveness/readiness until the server is listening.
  enabled: true
  periodSeconds: 5
  failureThreshold: 24

# ============================================================================
# Probes & Workload Hardening
# ============================================================================

# Defense-in-depth for a network-facing SQL endpoint (each piece is individually toggleable).
security:
  # Non-root, seccomp RuntimeDefault, dropped caps, read-only rootfs, no SA token.
  hardened: true

  # /mcp API-key gate: out-of-band Secret whose key holds a comma-separated key list.
  apiKey:
    existingSecret: ""         # e.g. "mcp-fleet-apikeys" (key: api-keys)
    existingSecretKey: api-keys
  # 1 gates /metrics behind the API token / an /mcp key; /ready is NEVER gated.
  metricsAuth: false

  identity:
    # TRUST GATE for oauth2-proxy browser headers: TRUE only when the edge
    # AuthorizationPolicy pins ingress to the gateway (headers are forgeable).
    trustBrowserHeaders: false
  # Policy-as-code (row filters / column masks / hidden tables); hot-reloaded — see helm/values.yaml.
  policy:
    enabled: false
    # ConfigMap carrying the policy document (empty = enforcement inert)
    existingConfigMap: ""
    existingConfigMapKey: policy.json
    mountPath: /etc/sqlhandler/policy
  # Ingress NetworkPolicy: default-deny + own ns + gateway ns + allowedNamespaces.
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    allowedNamespaces: []
    # Raw extra NetworkPolicy `from:` peers (CIDRs, podSelectors...), appended verbatim.
    additionalIngress: []
  # Pod-level east-west AuthorizationPolicy — a wrong list locks the service.
  authorizationPolicy:
    enabled: false
    # e.g. ["cluster.local/ns/istio-system/sa/ezaf-gateway-service-account"]
    principals: []
    # Allowed caller namespaces (Istio identity namespaces).
    namespaces: []
  runAsUser: 1000
  readOnlyRootFilesystem: true
  # The app never calls the Kubernetes API; don't hand it a token.
  automountServiceAccountToken: false

# ============================================================================
# OneLake / Fabric Connection
# ============================================================================

# Sensitive values in a Kubernetes Secret, non-secret details in a ConfigMap — never in values.
fabric:
  credentialsSecret:
    name: fabric-credentials
    tenantIdKey: tenant-id
    clientIdKey: client-id
    clientSecretKey: client-secret
    # create: true renders the Secret FROM values — non-production bootstrap only.
    create: false

    values:
      tenantId: ""
      clientId: ""
      clientSecret: ""

  lakehouseAbfssUrl: ""          # e.g. abfss://<ws>@onelake.dfs.fabric.microsoft.com/<lh>
  workspaceId: ""                # fallback (if no full URL)
  lakehouseId: ""                # fallback (if no full URL)
  authority: onelake.dfs.fabric.microsoft.com
  # Extra delta-rs storage options (JSON-merged into the env).
  storageOptions: {}

# ============================================================================
# S3 / MinIO Backend
# ============================================================================

# Used when backend: s3; non-secret values in the ConfigMap, keys via a Secret — never in values.
s3:
  # Create the Secret out-of-band (preferred); commands in helm/values.yaml and helm/local/README.md.
  credentialsSecret:
    name: s3-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    # create: true renders the Secret FROM values (lands in the Helm release secret).
    create: false  # keep false for a customer trial — create the Secret out-of-band
                   # (helm/local/README.md); set true ONLY on a throwaway cluster.

    values:
      accessKey: "<S3_ACCESS_KEY>"  # used only when create: true
      secretKey: "<S3_SECRET_KEY>"  # used only when create: true

  # MinIO/S3 connection details (non-secret -> ConfigMap).
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"   # point at the trial's S3/MinIO
  region: us-east-1
  bucket: "<BUCKET>"                              # required
  prefix: ""                  # optional sub-tree within the bucket
  anonymous: false            # read public buckets without keys
  useSsl: false               # force https when endpointUrl has no scheme
  # Extra pyarrow S3FileSystem kwargs (JSON-merged into the env), e.g. {request_timeout: 120}.
  options: {}

# ============================================================================
# Iceberg Backend
# ============================================================================

# Used when backend: iceberg; catalog token + S3 keys via a Secret, never values.yaml.
iceberg:
  catalogType: rest            # rest | sql
  catalogUri: ""              # e.g. http://rest-catalog:8181 or sqlite:///path
  catalogName: sqlhandler      # SQL catalogs partition by this name
  warehouse: ""               # optional table location root
  namespace: ""               # optional namespace filter
  # Nessie branch/tag pinned for reads (ICEBERG_NESSIE_REF; empty = default).
  nessieRef: ""
  # Credentials Secret: REST token + S3 access/secret keys (create out-of-band).
  credentialsSecret:
    name: iceberg-credentials
    tokenKey: token
    accessKeyKey: access-key
    secretKeyKey: secret-key
    create: false

    values:
      token: ""
      accessKey: ""
      secretKey: ""

  storage:
    endpointUrl: ""
    region: us-east-1
    anonymous: false

# NFS backend (backend: nfs): reads Parquet from a mounted directory; no credentials required.
nfs:
  rootDir: "/data"
  # Optional volume to mount providing the data (only when backend: nfs).
  mount:
    enabled: false
    pvcName: ""           # PVC to mount
    mountPath: "/data"    # where it is mounted inside the container
    readOnly: true

# ============================================================================
# ADLS Gen2 Backend
# ============================================================================

# Used when backend: adls; the client secret never renders — ADLS_CLIENT_SECRET_ENV holds the env NAME.
adls:
  enabled: false
  account: ""             # storage account name (required)
  filesystem: ""          # container / filesystem name (required); alias: container
  container: ""           # alias of filesystem (set exactly one)
  prefix: ""              # optional sub-tree within the container
  auth: anon              # anon | client-secret
  tenantId: ""            # Entra tenant (client-secret mode)
  clientId: ""            # Entra app/client id (client-secret mode)
  # Secret (created out-of-band) whose key holds the client secret — only the NAME and KEY land here.
  existingSecret: ""
  existingSecretClientSecretKey: client-secret
  # Sovereign clouds: core.windows.net (default) | core.usgovcloudapi.net | core.chinacloudapi.cn
  endpointSuffix: ""

# ============================================================================
# GCS Backend
# ============================================================================

# Used when backend: gcs; the SA key file is MOUNTED — key contents never in values.
gcs:
  enabled: false
  bucket: ""              # bucket name (required)
  prefix: ""              # optional sub-tree within the bucket
  projectId: ""           # only needed for bucket creation; reads work without
  # Mounted SA key file path (empty = ambient application-default credentials).
  credentialsFile: ""
  anonymous: false        # read a public bucket with no credential

# ============================================================================
# Metadata Caching
# ============================================================================

# list_tables/describe_table caches (SQLHANDLER_CACHE_TTL / _PREWARM_TABLES).
cache:
  # Seconds to keep list_tables / describe_table results in memory (0 disables).
  ttl: 3600
  # Delta snapshot version re-check interval (0 = every query; default 10).
  versionCheckInterval: 10
  # Comma-separated tables warmed at startup (unset = busiest from last run).
  prewarmTables: ""
  # First N row groups of each prewarm table read through the block cache (0 = off)
  prewarmRowgroups: 1
  # Serve list_tables from cache immediately, refresh in the background.
  listAsyncRefresh: true
  # DuckDB budget = duckdbMemoryFraction x the POD memory limit; spills to spillDir instead of OOMKill.
  duckdbMemoryFraction: "0.6"
  # Spill dir — /tmp (the hardened profile's emptyDir survives restarts).
  spillDir: /tmp/sqlhandler-duckdb-spill
  # Disk-warm metadata cache (survives container restarts; a PVC path survives rescheduling).
  cacheDir: /tmp/sqlhandler-cache
  # Virtual-table materialized-result reuse seconds (0 disables)
  virtualCacheTtl: 3600
  # Materialized-result location (default: cacheDir; an RWX PVC materializes once per deployment).
  virtualCacheDir: ""
  # Sort materialized virtual results by lowest-cardinality columns (0 = off).
  virtualCacheSort: true
  # Identical-query result served from memory (keyed by sql/params/limits + snapshot versions).
  resultCacheTtl: 3600
  # In-memory byte cap for cached query results (LRU-evicted).
  resultCacheMaxBytes: "268435456"
  # Shared L2 cache (cross-replica): enable semanticCatalog.store; dir MUST be ReadWriteMany.
  l2:
    enabled: false
    dir: ""
    ttl: "3600"
    minBytes: "262144"
    maxBytes: "2147483648"
  # Disk block cache (object-store reads): opt-in cache for parquet footers/column chunks.
  blockCache:
    enabled: false
    # Cache location. Default: <tmp>/sqlhandler-block-cache.
    dir: ""
    # Bytes per cached block (bigger = fewer remote round-trips).
    blockSize: "8388608"
    # Total cache size; the cache resets itself when exceeded.
    maxBytes: "4294967296"
    # 1 also caches LocalFileSystem paths (NFS mounts are network to pyarrow).
    includeLocal: false

# Saved-query store: EMPTY = /tmp emptyDir (lost on reschedule). Durable: savedQueriesPath.
savedQueriesPath: ""

# ============================================================================
# Semantic Catalog
# ============================================================================

# Paste table/column descriptions as NATIVE YAML under tables: (hot-reloads on mtime).
semanticCatalog:
  enabled: false  # paste a catalog as native YAML here, or enable
                  # the upload store and seed it from the /ui panel post-deploy
  # Catalog ConfigMap mount (file: <mountPath>/semantic-catalog.json)
  mountPath: /etc/sqlhandler
  # NATIVE YAML: description / aliases / columns / definition (VIRTUAL table).
  tables: {}
  # Alternative: inline JSON / YAML STRING (verbatim paste); mutually exclusive with tables.
  json: ""
  yaml: ""
  # Alternative: an EXISTING ConfigMap carrying a `semantic-catalog.json` key.
  existingConfigMap: ""
  # Upload store: backs UI/API uploads with a PVC; ReadWriteMany REQUIRED when replicas > 1.
  store:
    enabled: false
    # Mount an existing PVC; "" = chart creates <release>-catalog.
    existingClaim: ""
    size: 1Gi
    # "" = cluster default StorageClass; it must offer the access mode below.
    storageClass: ""
    # [ReadWriteOnce] ONLY for single-replica deployments (modes immutable).
    accessModes: [ReadWriteMany]
    # Store mount path; SQLHANDLER_CATALOG_STORE = <mountPath>/semantic-catalog.json.
    mountPath: /var/lib/sqlhandler-catalog

containerArgs:
  - --transport
  - streamable-http
  - --host
  - 0.0.0.0
  - --port
  - "9097"

# Ingress (optional; PCAI normally uses the Istio VirtualService below).
ingress:
  enabled: false
  className: ""
  annotations: {}

  hosts:
    - host: sqlhandler.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ============================================================================
# Pod Placement
# ============================================================================

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

# ============================================================================
# PCAI (HPE Ezmeral Unified Analytics) Integration
# ============================================================================

# Renders the Istio VirtualService + AuthorizationPolicy + Kyverno vendor-service tagging.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"   # informational only — no template reads it

  # Disable on clusters without the kyverno.io CRD — the post-install hook fails otherwise.
  kyverno:
    enabled: true

  virtualService:
    # Public endpoint on the PCAI gateway; MCP clients connect to https://<endpoint>/mcp.
    endpoint: "sqlhandler.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    # Default for normal calls (health etc.); the /mcp route uses longTimeout.
    timeout: 60s
    # MCP streamable-http is long-lived (tool calls, streaming responses).
    longTimeout: 3600s

  # hosted-trial standard keeps this ON — callers authenticate at the gateway.
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"
