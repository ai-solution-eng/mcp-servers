{{- if .Values.autoscaling.enabled }}
{{- /* HorizontalPodAutoscaler on the Deployment. When enabled, the
       Deployment omits spec.replicas so the autoscaler owns the count. */}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sqlhandler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sqlhandler.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.autoscaling.requestRateEnabled }}
    {{- /* Load-following scale-out (HA review 2026-09): the per-pod request
           rate (sqlhandler_http_requests_per_second, from the PodMonitor
           path via prometheus-adapter) targeted at the measured per-pod
           saturation point (~1.5 qps on G2). Requires prometheus-adapter
           serving the custom.metrics API; without it the HPA fails with
           "metric not found" — which is why this is opt-in. The CPU
           metric above stays as the burst/runaway protection. */}}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.requestRateMetricName }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.requestRateTarget | quote }}
    {{- end }}
    {{- with .Values.autoscaling.extraMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUpStabilizationSeconds }}
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDownStabilizationSeconds }}
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
{{- end }}
