apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqlhandler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
    {{- include "sqlhandler.ezua.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # When the HPA is enabled, spec.replicas is omitted so the autoscaler owns
  # the count (a rendered value here would fight it on every helm upgrade).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sqlhandler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sqlhandler.selectorLabels" . | nindent 8 }}
        {{- include "sqlhandler.ezua.labels" . | nindent 8 }}
      annotations:
        # Roll the pod when the ConfigMap or credential Secret changes,
        # so a corrected credential value actually reaches the container
        # (env from a Secret is read at container start, not live).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if or (and (eq .Values.backend "onelake") .Values.fabric.credentialsSecret.create) (and (eq .Values.backend "s3") .Values.s3.credentialsSecret.create) (and (eq .Values.backend "iceberg") .Values.iceberg.credentialsSecret.create) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sqlhandler.serviceAccountName" . }}
      {{- if .Values.security.hardened }}
      # The app never calls the Kubernetes API — no token needed.
      automountServiceAccountToken: {{ .Values.security.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: sqlhandler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          {{- if .Values.security.hardened }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            {{- if .Values.security.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "sqlhandler.fullname" . }}-config
          env:
            {{- if .Values.sources }}
            # Multi-source: connection details come from SQLHANDLER_SOURCES
            # (ConfigMap). No single-backend credential env is wired here.
            {{- else }}
            {{- if eq .Values.backend "onelake" }}
            # OneLake: map the Fabric credential secret keys to the env vars
            # config.py reads (envFrom would expose tenant-id / client-id /
            # client-secret, which the app never looks up).
            - name: FABRIC_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fabric.credentialsSecret.name }}
                  key: {{ .Values.fabric.credentialsSecret.tenantIdKey }}
            - name: FABRIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fabric.credentialsSecret.name }}
                  key: {{ .Values.fabric.credentialsSecret.clientIdKey }}
            - name: FABRIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fabric.credentialsSecret.name }}
                  key: {{ .Values.fabric.credentialsSecret.clientSecretKey }}
            {{- else if eq .Values.backend "s3" }}
            # S3/MinIO backend: credentials from the s3 credentials Secret.
            {{- if not .Values.s3.anonymous }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.name }}
                  key: {{ .Values.s3.credentialsSecret.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.name }}
                  key: {{ .Values.s3.credentialsSecret.secretKeyKey }}
            {{- end }}
            {{- else if eq .Values.backend "iceberg" }}
            # Iceberg backend: REST token + S3 storage keys (optional).
            {{- /* The token lives at iceberg.credentialsSecret.values.token
                   (written into the Secret by secret.yaml); a phantom key
                   here used to leave ICEBERG_CATALOG_TOKEN unset forever. */}}
            {{- if .Values.iceberg.credentialsSecret.values.token }}
            - name: ICEBERG_CATALOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.iceberg.credentialsSecret.name }}
                  key: {{ .Values.iceberg.credentialsSecret.tokenKey }}
            {{- end }}
            {{- if not .Values.iceberg.storage.anonymous }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.iceberg.credentialsSecret.name }}
                  key: {{ .Values.iceberg.credentialsSecret.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.iceberg.credentialsSecret.name }}
                  key: {{ .Values.iceberg.credentialsSecret.secretKeyKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range .Values.databases }}
            {{- if .password }}
            - name: {{ printf "SQLHANDLER_DB_PW_%s" (upper .name) }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sqlhandler.fullname" $ }}-db-credentials
                  key: {{ printf "SQLHANDLER_DB_PW_%s" (upper .name) }}
            {{- end }}
            {{- end }}
            {{- if .Values.semanticCatalog.enabled }}
            # Semantic catalog (README: Semantic catalog) — the ConfigMap is
            # mounted read-only below and the engine hot-reloads the file on
            # mtime change, so catalog edits need no pod restart.
            - name: SQLHANDLER_CATALOG
              value: {{ printf "%s/semantic-catalog.json" (.Values.semanticCatalog.mountPath | default "/etc/sqlhandler") | quote }}
            {{- end }}
            {{- if .Values.security.apiKey.existingSecret }}
            # OPTIONAL /mcp API-key auth (fleet decision 2026-09): wired ONLY
            # when the values point at a Secret; unset → /mcp runs open with
            # a loud startup warning (gateway-fronted deployments).
            - name: SQLHANDLER_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.apiKey.existingSecret }}
                  key: {{ .Values.security.apiKey.existingSecretKey }}
            {{- end }}
            {{- if .Values.semanticCatalog.store.enabled }}
            # Upload store on the shared PVC (values: semanticCatalog.store):
            # UI/API uploads become cross-pod + durable and still hot-reload.
            # Falls back to SQLHANDLER_CATALOG until a first upload exists.
            - name: SQLHANDLER_CATALOG_STORE
              value: {{ printf "%s/semantic-catalog.json" (.Values.semanticCatalog.store.mountPath | default "/var/lib/sqlhandler-catalog") | quote }}
            {{- end }}
            {{- if hasKey .Values.query "concurrency" }}
            {{- /* Legacy nesting guard (never shipped): reject a query.concurrency
                   map so a mis-merged values file cannot silently drop the gate. */}}
            {{- fail "query.concurrency: use the flat keys query.maxConcurrentQueries / query.queueTimeoutSeconds" }}
            {{- end }}
            # Per-pod query-concurrency gate (engine.py; values: query.*).
            # Both vars are rendered unconditionally: the app's defaults (8 / 30s)
            # match these values.yaml defaults, so explicit == default renders the
            # same behavior while keeping the gate visible and adjustable in the
            # PCAI Helm Values editor.
            - name: SQLHANDLER_MAX_CONCURRENT_QUERIES
              value: {{ .Values.query.maxConcurrentQueries | quote }}
            - name: SQLHANDLER_QUEUE_TIMEOUT
              value: {{ .Values.query.queueTimeoutSeconds | quote }}
            {{- if .Values.query.auditLog }}
            {{- /* JSONL query-audit log (values: query.auditLog). The value is a
                   PATH; the chart only renders the env var and (below) a writable
                   emptyDir for the path's directory — the file is pod-local by
                   design (durable audit = point the path at your own PVC mount).
                   Render guard: absolute path required so the mount math below
                   cannot produce a relative nonsense mountPath. */}}
            {{- if not (regexMatch "^/" .Values.query.auditLog) }}
            {{- fail "query.auditLog must be an absolute path (e.g. /var/lib/sqlhandler-audit/audit.jsonl)" }}
            {{- end }}
            - name: SQLHANDLER_AUDIT_LOG
              value: {{ .Values.query.auditLog | quote }}
            {{- end }}
            {{- if and (eq .Values.backend "sharing") .Values.sharing.enabled }}
            {{- /* Delta Sharing (values: sharing.*): the profile FILE comes
                   from the mounted ConfigMap (configmap.yaml renders
                   DELTA_SHARING_PROFILE); the Secret path wires endpoint +
                   bearer token directly via secretKeyRef. Either way the
                   token never renders into the ConfigMap. */}}
            {{- if .Values.sharing.existingSecret }}
            - name: DELTA_SHARING_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sharing.existingSecret }}
                  key: {{ .Values.sharing.existingSecretEndpointKey }}
            - name: DELTA_SHARING_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sharing.existingSecret }}
                  key: {{ .Values.sharing.existingSecretBearerTokenKey }}
            {{- end }}
            {{- end }}
            {{- if and (eq .Values.backend "adls") .Values.adls.enabled (eq (.Values.adls.auth | default "anon") "client-secret") .Values.adls.existingSecret }}
            {{- /* ADLS Gen2 (values: adls.*): the client secret NEVER renders
                   into the ConfigMap — ADLS_CLIENT_SECRET_ENV (rendered there)
                   names THIS env var, whose VALUE arrives from the operator's
                   Secret via secretKeyRef. Identical posture to the FABRIC_
                   credential block above. */}}
            - name: ADLS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adls.existingSecret }}
                  key: {{ .Values.adls.existingSecretClientSecretKey | default "client-secret" }}
            {{- end }}
          {{- /* volumeMounts: read-only rootfs needs a writable /tmp; the nfs
                 backend additionally mounts its PVC; the semantic catalog
                 mounts its ConfigMap read-only; the upload store mounts its
                 PVC read-write (the upload API writes there). One merged
                 block so the YAML key is never emitted twice. */}}
          {{- $needTmp := and .Values.security.hardened .Values.security.readOnlyRootFilesystem }}
          {{- $needData := and (eq .Values.backend "nfs") .Values.nfs.mount.enabled }}
          {{- $needCatalog := .Values.semanticCatalog.enabled }}
          {{- $needStore := .Values.semanticCatalog.store.enabled }}
          {{- $needScratch := and .Values.writes.enabled .Values.writes.scratch.pvc.enabled }}
          {{- $needSharing := and (eq .Values.backend "sharing") .Values.sharing.enabled .Values.sharing.existingConfigMap }}
          {{- $needAudit := and (.Values.query.auditLog) (ne (dir .Values.query.auditLog) "/") }}
          {{- if or $needTmp $needData $needCatalog $needStore $needScratch $needSharing $needAudit }}
          volumeMounts:
            {{- if $needTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if $needData }}
            - name: data
              mountPath: {{ .Values.nfs.mount.mountPath | default "/data" | quote }}
              readOnly: {{ .Values.nfs.mount.readOnly }}
            {{- end }}
            {{- if $needCatalog }}
            {{- /* Directory mount, NOT subPath: the kubelet only propagates
                   ConfigMap edits into non-subPath mounts, and the engine
                   hot-reloads on mtime — so a catalog edit reaches the pod
                   without a restart. */}}
            - name: semantic-catalog
              mountPath: {{ .Values.semanticCatalog.mountPath | default "/etc/sqlhandler" }}
              readOnly: true
            {{- end }}
            {{- if $needStore }}
            {{- /* Read-write on purpose: the upload API writes the store file
                   here; every replica sees it via the shared volume and
                   hot-reloads. */}}
            - name: catalog-store
              mountPath: {{ .Values.semanticCatalog.store.mountPath | default "/var/lib/sqlhandler-catalog" }}
            {{- end }}
            {{- if $needScratch }}
            {{- /* Read-write on purpose: the write tier writes scratch tables
                   (and the single-writer lease files) here. RWX discipline:
                   see values.yaml writes.scratch.pvc + the scratch-pvc.yaml
                   render guard. */}}
            - name: scratch
              mountPath: {{ .Values.writes.scratch.pvc.mountPath | default "/scratch" }}
            {{- end }}
            {{- if $needAudit }}
            {{- /* Read-write on purpose: the audit JSONL writer appends here.
                   Pod-local emptyDir keyed to the path's DIRECTORY (e.g.
                   /var/lib/sqlhandler-audit for .../sqlhandler-audit/a.jsonl);
                   a root-level path ("/a.jsonl") skips the mount entirely —
                   only a hardened (read-only-rootfs) pod needs the dir. */}}
            - name: audit-log
              mountPath: {{ dir .Values.query.auditLog }}
            {{- end }}
            {{- if $needSharing }}
            {{- /* Directory mount, NOT subPath — same mtime-hot-reload
                   reasoning as the semantic catalog (though the sharing
                   profile is read once at startup today). */}}
            - name: sharing-profile
              mountPath: /etc/sqlhandler-sharing
              readOnly: true
            {{- end }}
          {{- end }}
          # The image has a CMD but no ENTRYPOINT; args alone would REPLACE the
          # whole command (making --transport the executable and crashing with
          # 'executable file not found'). Pin the entry command, pass args only.
          command:
            - python
            - -m
            - sqlhandler.server
          args:
            {{- range .Values.containerArgs }}
            - {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- /* Probes render via the shared fleet library (pcai-fleet-lib,
                 Chart.yaml dependency — audit §3.5's shared helm library).
                 Byte-for-byte these lines reproduce the previous inline
                 block: same order (startup, liveness, readiness), same
                 /health + /ready paths, same knobs — including the quirk
                 that the startup probe's timeoutSeconds tracks the LIVENESS
                 timeout (encoded, not changed). Semantics stay chart-owned
                 (values below); the library owns only the formatting. */}}
          {{- include "pcai-fleet-lib.probes" (list
              (dict "name" "startupProbe" "enabled" .Values.startupProbe.enabled
                    "httpGet" (dict "path" "/health" "port" "http")
                    "fields" (list
                      (dict "key" "periodSeconds" "value" .Values.startupProbe.periodSeconds)
                      (dict "key" "timeoutSeconds" "value" .Values.livenessProbe.timeoutSeconds)
                      (dict "key" "failureThreshold" "value" .Values.startupProbe.failureThreshold)))
              (dict "name" "livenessProbe" "enabled" .Values.livenessProbe.enabled
                    "httpGet" (dict "path" "/health" "port" "http")
                    "fields" (list
                      (dict "key" "initialDelaySeconds" "value" .Values.livenessProbe.initialDelaySeconds)
                      (dict "key" "periodSeconds" "value" .Values.livenessProbe.periodSeconds)
                      (dict "key" "timeoutSeconds" "value" .Values.livenessProbe.timeoutSeconds)))
              (dict "name" "readinessProbe" "enabled" .Values.readinessProbe.enabled
                    "httpGet" (dict "path" "/ready" "port" "http")
                    "fields" (list
                      (dict "key" "initialDelaySeconds" "value" .Values.readinessProbe.initialDelaySeconds)
                      (dict "key" "periodSeconds" "value" .Values.readinessProbe.periodSeconds)
                      (dict "key" "timeoutSeconds" "value" .Values.readinessProbe.timeoutSeconds)))) }}
      {{- $needTmp := and .Values.security.hardened .Values.security.readOnlyRootFilesystem }}
      {{- $needData := and (eq .Values.backend "nfs") .Values.nfs.mount.enabled }}
      {{- $needCatalog := .Values.semanticCatalog.enabled }}
      {{- $needStore := .Values.semanticCatalog.store.enabled }}
      {{- $needScratch := and .Values.writes.enabled .Values.writes.scratch.pvc.enabled }}
      {{- if or $needTmp $needData $needCatalog $needStore $needScratch $needAudit }}
      volumes:
        {{- if $needTmp }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if $needData }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.nfs.mount.pvcName | required "nfs.mount.pvcName is required when nfs.mount.enabled" }}
        {{- end }}
        {{- if $needCatalog }}
        {{- /* The chart's own ConfigMap, or one managed out-of-band via
               semanticCatalog.existingConfigMap (must carry the
               `semantic-catalog.json` key). */}}
        - name: semantic-catalog
          configMap:
            name: {{ .Values.semanticCatalog.existingConfigMap | default (printf "%s-semantic-catalog" (include "sqlhandler.fullname" .)) }}
        {{- end }}
        {{- if $needStore }}
        {{- /* The chart-created <release>-catalog PVC, or an existing claim
               via semanticCatalog.store.existingClaim. */}}
        - name: catalog-store
          persistentVolumeClaim:
            claimName: {{ .Values.semanticCatalog.store.existingClaim | default (printf "%s-catalog" (include "sqlhandler.fullname" .)) }}
        {{- end }}
        {{- if $needScratch }}
        {{- /* The chart-created <release>-scratch PVC (RWX render-guarded),
               or an existing claim via writes.scratch.pvc.existingClaim. */}}
        - name: scratch
          persistentVolumeClaim:
            claimName: {{ .Values.writes.scratch.pvc.existingClaim | default (printf "%s-scratch" (include "sqlhandler.fullname" .)) }}
        {{- end }}
        {{- if $needSharing }}
        {{- /* Operator-owned profile ConfigMap (sharing.existingConfigMap);
               the key must carry the Delta Sharing profile YAML/JSON. Never
               a values-rendered credential — profiles carry the token. */}}
        - name: sharing-profile
          configMap:
            name: {{ required "sharing.existingConfigMap is required for the profile-file path" .Values.sharing.existingConfigMap }}
        {{- end }}
        {{- if $needAudit }}
        {{- /* Pod-local writable dir for the audit JSONL (values: query.auditLog).
               emptyDir is the deliberate choice: audit is a diagnostic stream,
               not a system of record — the append-only file survives container
               restarts but not rescheduling. Durable audit = target a path on
               your own PVC-backed mount. */}}
        - name: audit-log
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sqlhandler.selectorLabels" . | nindent 14 }}
      {{- end }}