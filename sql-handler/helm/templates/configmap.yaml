apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sqlhandler.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
data:
  # Streamable HTTP (MCP 2.0) is the default transport.
  SQLHANDLER_TRANSPORT: {{ .Values.mcp.transport | quote }}
  {{- /* MCP + endpoint posture (fleet decisions D2/D3/D5 + the audit's
         rebinding/metrics quick wins). Defaults mirror the server code so
         rendering them here only makes the posture explicit — flipping a
         value is a one-line helm upgrade, no code change. */}}
  # D2: MCP run_sql is SELECT-only by default; mcp.readonly: false renders
  # "0" and restores multi-statement DDL for trusted callers (attached
  # external catalogs stay read-only regardless — server-enforced).
  SQLHANDLER_MCP_READONLY: {{ ternary "1" "0" .Values.mcp.readonly | quote }}
  {{- with .Values.mcp.allowedHosts }}
  # Strict /mcp Host-header pinning (DNS-rebinding defense, 421 on mismatch).
  # Comma-separated; "host:*" allows any port. Leave empty when the
  # deployment's externally-visible hostnames are not fixed (default).
  SQLHANDLER_ALLOWED_HOSTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.mcp.allowedOrigins }}
  # D3: extra browser origins for CORS + /mcp Origin validation. Empty
  # (default) = same-origin only — browsers are refused, MCP clients are not.
  SQLHANDLER_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  # Optional auth gate on /metrics + /ready (default off = unauthenticated).
  # When true, scrapers must present SQLHANDLER_API_TOKEN or an /mcp API key
  # (X-API-Key / X-API-Token / Bearer); /health stays open for probes.
  SQLHANDLER_METRICS_AUTH: {{ ternary "1" "0" .Values.security.metricsAuth | quote }}
  # Backend: onelake (default), s3/minio, or iceberg.
  SQLHANDLER_BACKEND: {{ .Values.backend | default "onelake" | quote }}
  {{- if not .Values.sources }}
  {{- if eq .Values.backend "onelake" }}
  # OneLake connection details (non-secret). Credentials come from a Secret.
  FABRIC_AUTHORITY: {{ .Values.fabric.authority | quote }}
  {{- if .Values.fabric.lakehouseAbfssUrl }}
  FABRIC_LAKEHOUSE_ABFSS_URL: {{ .Values.fabric.lakehouseAbfssUrl | quote }}
  {{- end }}
  {{- if .Values.fabric.workspaceId }}
  FABRIC_WORKSPACE_ID: {{ .Values.fabric.workspaceId | quote }}
  {{- end }}
  {{- if .Values.fabric.lakehouseId }}
  FABRIC_LAKEHOUSE_ID: {{ .Values.fabric.lakehouseId | quote }}
  {{- end }}
  {{- else if eq .Values.backend "s3" }}
  # S3/MinIO connection details (non-secret). Credentials come from a Secret.
  S3_ENDPOINT_URL: {{ .Values.s3.endpointUrl | quote }}
  S3_REGION: {{ .Values.s3.region | default "us-east-1" | quote }}
  {{- if .Values.s3.bucket }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  {{- end }}
  {{- if .Values.s3.prefix }}
  S3_PREFIX: {{ .Values.s3.prefix | quote }}
  {{- end }}
  {{- if .Values.s3.anonymous }}
  S3_ANONYMOUS: "true"
  {{- end }}
  {{- if .Values.s3.useSsl }}
  S3_USE_SSL: "true"
  {{- end }}
  {{- else if eq .Values.backend "iceberg" }}
  # Iceberg catalog connection details (non-secret). Token/keys -> Secret.
  ICEBERG_CATALOG_TYPE: {{ .Values.iceberg.catalogType | default "rest" | quote }}
  ICEBERG_CATALOG_URI: {{ .Values.iceberg.catalogUri | quote }}
  {{- if .Values.iceberg.catalogName }}
  ICEBERG_CATALOG_NAME: {{ .Values.iceberg.catalogName | quote }}
  {{- end }}
  {{- if .Values.iceberg.warehouse }}
  ICEBERG_WAREHOUSE: {{ .Values.iceberg.warehouse | quote }}
  {{- end }}
  {{- if .Values.iceberg.namespace }}
  ICEBERG_NAMESPACE: {{ .Values.iceberg.namespace | quote }}
  {{- end }}
  # S3 storage for the Iceberg data files (optional; same vars as s3 backend).
  {{- if .Values.iceberg.storage.endpointUrl }}
  S3_ENDPOINT_URL: {{ .Values.iceberg.storage.endpointUrl | quote }}
  {{- end }}
  {{- if .Values.iceberg.storage.region }}
  S3_REGION: {{ .Values.iceberg.storage.region | quote }}
  {{- end }}
  {{- if .Values.iceberg.storage.anonymous }}
  S3_ANONYMOUS: "true"
  {{- end }}
  {{- else if eq .Values.backend "nfs" }}
  # NFS / local filesystem backend: read-only directory of Parquet files.
  NFS_ROOT: {{ .Values.nfs.rootDir | default "/data" | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.sources }}
  # Federated multi-source mode: overrides the single backend (see values.yaml).
  SQLHANDLER_SOURCES: {{ .Values.sources | toJson | quote }}
  {{- end }}
  {{- if .Values.databases }}
  {{- /* External read-only databases: the JSON carries env-var NAMES only
         (password_env = SQLHANDLER_DB_PW_<NAME>); the password VALUES are
         wired via secretKeyRef from the db-credentials Secret (see
         secret.yaml / deployment.yaml) and never enter the ConfigMap. */}}
  {{- $attach := list }}
  {{- /* External read-only databases: the JSON carries env-var NAMES only
         (password_env = SQLHANDLER_DB_PW_<NAME>); the password VALUES are
         wired via secretKeyRef from the db-credentials Secret (see
         secret.yaml / deployment.yaml) and never enter the ConfigMap.
         sqlite entries carry a file path (no host/port/user/password_env),
         and every entry forwards an optional `params` object (TLS / driver
         options — README: External databases). Impossible entries fail the
         render. */}}
  {{- $attach := list }}
  {{- range .Values.databases }}
  {{- $t := .type | default "postgres" }}
  {{- if not .name }}{{- fail "databases: every entry needs a name" }}{{- end }}
  {{- if not .database }}{{- fail (printf "databases: entry %s is missing database" .name) }}{{- end }}
  {{- if and (eq $t "sqlite") (or .host .port .user) }}
  {{- fail (printf "databases: sqlite entry %s must not set host/port/user (database is the file path)" .name) }}
  {{- end }}
  {{- $entry := dict "name" .name "type" $t "database" .database }}
  {{- if ne $t "sqlite" }}
  {{- with .host }}{{- $_ := set $entry "host" . }}{{- end }}
  {{- $_ := set $entry "password_env" (printf "SQLHANDLER_DB_PW_%s" (upper .name)) }}
  {{- with .port }}{{- $_ := set $entry "port" (. | int) }}{{- end }}
  {{- with .user }}{{- $_ := set $entry "user" . }}{{- end }}
  {{- end }}
  {{- with .params }}{{- $_ := set $entry "params" . }}{{- end }}
  {{- $attach = append $attach $entry }}
  {{- end }}
  # Attached external databases (read-only; see README: External databases).
  SQLHANDLER_ATTACH: {{ $attach | toJson | quote }}
  {{- end }}
  # In-process metadata cache (list_tables / describe_table). NOTE: no sprig
  # `default` here — `0` (disable caching / check every query) and `false`
  # are meaningful values that `default` treats as empty and would override.
  SQLHANDLER_CACHE_TTL: {{ .Values.cache.ttl | quote }}
  SQLHANDLER_VERSION_CHECK_INTERVAL: {{ .Values.cache.versionCheckInterval | quote }}
  SQLHANDLER_LIST_ASYNC_REFRESH: {{ .Values.cache.listAsyncRefresh | quote }}
  {{- if .Values.cache.prewarmTables }}
  SQLHANDLER_PREWARM_TABLES: {{ .Values.cache.prewarmTables | quote }}
  {{- end }}
  # DuckDB query-engine budget, derived from the container's own cgroup
  # limits (see src/sqlhandler/resources.py): memory_limit = fraction x the
  # pod's memory limit, threads = the pod's CPU limit, and a spill directory
  # for sorts/aggregations that would otherwise push RSS past the limit and
  # get the pod OOMKilled (which wipes every in-process cache). The spill dir
  # lives under /tmp, which the hardened profile already backs with an
  # emptyDir (survives container restarts, so spills + the warm cache both
  # outlive an OOMKill).
  SQLHANDLER_DUCKDB_MEMORY_FRACTION: {{ .Values.cache.duckdbMemoryFraction | quote }}
  SQLHANDLER_DUCKDB_TEMP_DIR: {{ .Values.cache.spillDir | quote }}
  SQLHANDLER_CACHE_DIR: {{ .Values.cache.cacheDir | quote }}
  {{- /* Virtual-table materialization + query result caches (README:
         "Virtual tables" + performance). TTL 0 disables each layer; cache
         keys carry base-snapshot versions so ETL commits invalidate
         instantly. */}}
  SQLHANDLER_VIRTUAL_CACHE_TTL: {{ .Values.cache.virtualCacheTtl | quote }}
  SQLHANDLER_VIRTUAL_CACHE_SORT: {{ .Values.cache.virtualCacheSort | quote }}
  SQLHANDLER_RESULT_CACHE_TTL: {{ .Values.cache.resultCacheTtl | quote }}
  SQLHANDLER_RESULT_CACHE_MAX_BYTES: {{ .Values.cache.resultCacheMaxBytes | quote }}
  {{- with .Values.cache.virtualCacheDir }}
  SQLHANDLER_VIRTUAL_CACHE_DIR: {{ . | quote }}
  {{- end }}
  # D5: per-query wall-clock timeout (seconds; 0 = no timeout). A runaway
  # query used to hold one of the concurrency-gate slots forever; >10-minute
  # queries must opt in by raising this.
  SQLHANDLER_QUERY_TIMEOUT: {{ .Values.query.timeoutSeconds | quote }}
  {{- /* Disk block cache: opt-in (s3/iceberg parquet IO; delta-rs IO on
         onelake is not wrappable). Empty strings mean "engine default". */}}
  SQLHANDLER_BLOCK_CACHE: {{ .Values.cache.blockCache.enabled | quote }}
  {{- if .Values.cache.blockCache.enabled }}
  {{- with .Values.cache.blockCache.dir }}
  SQLHANDLER_BLOCK_CACHE_DIR: {{ . | quote }}
  {{- end }}
  {{- with .Values.cache.blockCache.blockSize }}
  SQLHANDLER_BLOCK_CACHE_BLOCK_SIZE: {{ . | quote }}
  {{- end }}
  {{- with .Values.cache.blockCache.maxBytes }}
  SQLHANDLER_BLOCK_CACHE_MAX_BYTES: {{ . | quote }}
  {{- end }}
  {{- if .Values.cache.blockCache.includeLocal }}
  SQLHANDLER_BLOCK_CACHE_INCLUDE_LOCAL: "1"
  {{- end }}
  {{- end }}
  {{- /* Backend-specific object-client tuning (operator JSON, merged into
         the engine's filesystem/storage constructors). */}}
  {{- with .Values.s3.options }}
  SQLHANDLER_S3_OPTIONS: {{ . | toJson | quote }}
  {{- end }}
  {{- with .Values.fabric.storageOptions }}
  SQLHANDLER_ONELAKE_STORAGE_OPTIONS: {{ . | toJson | quote }}
  {{- end }}
