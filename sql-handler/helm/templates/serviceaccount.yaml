{{- if .Values.serviceAccount.create }}
{{- /* Audit 2026-11-12 (P2): _helpers.tpl already returns a chart-managed
       ServiceAccount name when serviceAccount.create is true, but no template
       ever created it — `helm template --set serviceAccount.create=true`
       rendered `serviceAccountName: <fullname>` with no ServiceAccount object,
       so the pods could never schedule ("serviceaccount not found"). The flag
       now does what it says. The app never calls the Kubernetes API, so no
       Role/RoleBinding is rendered; annotations are for workload identity
       (e.g. Azure AD workload identity / IRSA) when a deployment needs it. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqlhandler.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sqlhandler.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
