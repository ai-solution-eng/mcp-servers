# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# Prefer: Slack

# SQLhandler MCP server — PCAI (HPE Ezmeral Unified Analytics) deployment.
# Deploys SQLhandler as a MCP 2.0 (streamable-http) server exposed at
# <endpoint>/mcp through the PCAI Istio gateway.

# -- Deployment ---------------------------------------------------------------
# Scale OUT, not UP — benchmark evidence (G2, 2026-09-08, 9-query workload):
# a single replica's throughput COLLAPSES under concurrent clients (5.5 qps at
# 1 client -> 2.7 qps at 16, p95 17.8s) because the embedded DuckDB engine
# serializes requests per process, while 4 replicas held a flat ~6 qps at 16
# clients (p50 3.1-4.0s) using only 0.24 cores / 1.3GiB fleet-wide peak. CPU
# and memory bumps on a single replica buy nothing (limits went unused).
replicaCount: 1

# -- Horizontal autoscaling -----------------------------------------------------
# HorizontalPodAutoscaler (autoscaling/v2). Requires metrics-server for the
# CPU metric. CAUTION, from the same benchmark: steady-state CPU is ~8% of
# limits even at full concurrent load, so the CPU target below fires only on
# heavy scan bursts (runaway-query protection) — NOT on request volume. For
# load-following scale-out add a custom metric (needs prometheus-adapter),
# e.g. requests-per-second per pod targeted at ~1.5, the measured per-pod
# saturation point:
#   extraMetrics:
#     - type: Pods
#       pods:
#         metric:
#           name: sqlhandler_http_requests_per_second
#         target:
#           type: AverageValue
#           averageValue: "1.5"
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  # Raw extra HPA metrics appended verbatim (autoscaling/v2 schema).
  extraMetrics: []
  behavior:
    # Scale-up reacts quickly; scale-down is deliberately slow so a burst of
    # MCP tool calls doesn't thrash the fleet.
    scaleUpStabilizationSeconds: 30
    scaleDownStabilizationSeconds: 300

# Spread replicas across nodes (ScheduleAnyway keeps scheduling permissive on
# single-node clusters).
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Budget for voluntary disruptions (node drains) once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Grace period for in-flight MCP tool calls on rollout (gateway allows up
# to 3600s per call; the pod gets this many seconds to finish draining).
terminationGracePeriodSeconds: 90

image:
  # GitHub Container Registry (ghcr.io/ai-solution-eng/...) — same registry as
  # the sibling PCAI apps and the deploy-toromont values file.
  repository: ghcr.io/ai-solution-eng/sqlhandler
  tag: v3.9.2
  # Optional: pin by digest for production (e.g. "sha256:abcd...").
  digest: ""
  pullPolicy: IfNotPresent

# -- Backend selection -------------------------------------------------------
# One data source is read at a time:
#   s3 | minio    - S3-compatible object store (Parquet files), e.g. MinIO
#                   [default — in-cluster MinIO test bucket]
#   onelake       - Microsoft Fabric OneLake (Delta Lake over ABFS)
#   iceberg       - Apache Iceberg tables through a REST or SQL catalog
#   nfs           - mounted directory (PVC/hostPath) of Parquet/Delta
# NOTE: when using onelake you MUST set backend: onelake explicitly — the
# per-backend credential wiring (and Secret creation) is gated on it.
backend: s3

# -- Federated multi-source mode ---------------------------------------------
# When `sources` is non-empty it OVERRIDES `backend` above: the engine
# federates every source behind one endpoint (cross-source joins work).
# Each entry mirrors the per-backend env vars; `name` becomes the source
# prefix used in the UI and in SQL (name "warehouse" + table "orders" ->
# `warehouse_orders`).
#   sources:
#     - name: sales
#       backend: s3
#       endpointUrl: http://minio.minio.svc.cluster.local:9000
#       bucket: sales-bucket
#       prefix: ""
#       accessKey: ""
#       secretKey: ""
#     - name: inventory
#       backend: s3
#       endpointUrl: http://minio.minio.svc.cluster.local:9000
#       bucket: inventory-bucket
#       prefix: raw
# Credentials land in the ConfigMap (SQLHANDLER_SOURCES as JSON) — for
# production, mount that env var from a Secret instead of values.yaml.
sources: []

# -- External databases (read-only attach) ------------------------------------
# Postgres/MySQL servers whose tables become queryable — and join-able with
# lake tables in ONE query — as <name>.<schema>.<table>. STRICTLY read-only:
# DuckDB itself rejects writes on the attached catalog (README: External
# databases). The generated SQLHANDLER_ATTACH config carries env-var NAMES
# only (SQLHANDLER_DB_PW_<NAME>); the password values come from the
# <fullname>-db-credentials Secret — rendered here ONLY for entries with a
# non-empty `password`. Prefer managing that Secret out-of-band (kubectl
# create secret) and leaving `password` empty; trust-auth entries (unix
# socket) need no password at all.
#   databases:
#     - name: ops
#       type: postgres        # postgres | mysql
#       host: postgresql.postgresql.svc.cluster.local
#       port: 5432            # default per type when omitted
#       database: opsdb
#       user: ro_user
#       password: ""          # -> db-credentials Secret; "" = trust-auth
databases: []

# -- Naming overrides (rarely needed) ----------------------------------------
nameOverride: ""
fullnameOverride: ""

# -- Service account ----------------------------------------------------------
# SQLhandler does not need RBAC to read k8s Secrets by default; keep this
# simple unless you add a SecretProvider tier that requires it.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# -- Service exposure ---------------------------------------------------------
# The MCP streamable-http endpoint is served on port 9097 at path /mcp.
# 9097 is aligned with the other MCP servers in this environment; the
# container listens on the same port (see mcp.port below).
service:
  type: ClusterIP
  port: 9097
  targetPort: 9097

# -- MCP endpoint configuration ----------------------------------------------
mcp:
  transport: streamable-http   # MCP 2.0 transport
  path: /mcp                   # FastMCP default; VirtualService routes on it
  port: 9097                   # container + service port
  # Fleet decision D2: MCP run_sql is SELECT-only by default (the same
  # DuckDB-parser guard the web API uses — multi-statement DDL, INSERT/
  # UPDATE/DELETE, ATTACH, COPY, PRAGMA are refused with an error that names
  # SQLHANDLER_MCP_READONLY). Set false ONLY for trusted-caller deployments
  # that need DDL/script execution; attached external databases stay
  # read-only either way (enforced in the engine, not the flag).
  readonly: true
  # Strict /mcp Host-header allowlist (DNS-rebinding protection, 421 on
  # mismatch). Comma-separated exact hostnames; "host:*" allows any port,
  # e.g. "sqlhandler.pcai.svc.cluster.local:*,sqlhandler.example.com".
  # Origin validation is ALWAYS on for /mcp (browser-originated requests
  # are refused unless listed under allowedOrigins), so this stays optional:
  # a pod cannot know which externally-visible hostname callers use, and a
  # wrong pin 421s every request. Set it when your hostnames are fixed.
  allowedHosts: ""
  # Fleet decision D3: extra browser origins allowed on /api/*, /ui and
  # /mcp (comma-separated, e.g. "https://sql-ui.example.com"). Empty
  # (default) = same-origin only: cross-origin browser reads are refused,
  # MCP clients (which send no Origin header) are unaffected. The legacy
  # SQLHANDLER_CORS_ORIGINS env is still honored when set explicitly, but
  # its old "*" default is gone.
  allowedOrigins: ""

# -- Query execution ------------------------------------------------------------
# Applies to the DuckDB SQL path — MCP run_sql and the web API alike.
query:
  # Fleet decision D5: per-query wall-clock timeout in seconds (0 = no
  # timeout, the pre-D5 behavior). On expiry the query is interrupted inside
  # DuckDB (no leaked threads/connections) and the caller gets a clean error.
  # The default 600s stops a runaway query from holding one of the
  # concurrency-gate slots forever; genuine >10-minute queries must raise
  # this deliberately (the gateway itself caps calls at 3600s).
  timeoutSeconds: "600"

# -- Resources ----------------------------------------------------------------
# Sized from the G2 concurrency benchmark (2026-09-08): 4 replicas held ~6 qps
# at 16 concurrent clients with a fleet-wide peak of 0.24 cores / 1.3GiB, so
# the REQUESTS below are all the reservation the scheduler needs — the
# workload idles near-zero and bursts only during scans. LIMITS stay generous
# because the actual target is big data:
#   - memory: DuckDB's in-query budget is duckdbMemoryFraction (0.6) x the
#     memory LIMIT — 16Gi keeps a ~9.6Gi budget before DuckDB spills to
#     spillDir instead of being OOMKilled mid-join (which also wipes every
#     in-process cache).
#   - cpu: the limit governs how many threads ONE wide scan/aggregate can use
#     in parallel (DuckDB defaults its thread count to the core limit).
# The memory REQUEST is purely a scheduler reservation (DuckDB's budget keys
# off the LIMIT — see src/sqlhandler/resources.py) — but keep it at or above
# steady-state RSS: under node memory pressure the kubelet evicts pods whose
# usage exceeds their request first. 1Gi covers observed usage (~0.3GiB fresh,
# ~1.1GiB long-warmed) with margin; don't go below that.
# Raise the limits (not the requests) on sites running very wide tables or
# large joins; the requests can stay put in every case observed so far.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 16Gi

# -- Probes --------------------------------------------------------------------
# /health and /ready are served by the container (server.py).
livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  # /ready performs a real backend check (server allows ~17s: 2s handler +
  # 15s connection test). A 3s timeout here would flap a slow-but-healthy
  # backend out of the Service before the server can answer.
  timeoutSeconds: 20
startupProbe:
  # Gates liveness/readiness until the server is listening — prewarm (and a
  # cold parquet discovery on first describe) can outlive the old 15s
  # initialDelay, and without this the kubelet restarts a healthy pod that
  # was merely still warming up.
  enabled: true
  periodSeconds: 5
  failureThreshold: 24

# -- Workload security hardening ------------------------------------------------
# Defense-in-depth for a network-facing SQL endpoint. Each piece can be
# turned off individually without leaving the hardened profile.
security:
  # Master switch: run as non-root, seccomp RuntimeDefault, no privilege
  # escalation, dropped capabilities, read-only root filesystem, no
  # auto-mounted ServiceAccount token, plus an optional ingress
  # NetworkPolicy (security.networkPolicy.enabled below, default false).
  hardened: true
  # OPTIONAL API-key auth on /mcp (fleet decision 2026-09 — SQL is optional
  # until per-user keys/roles land). When apiKey.existingSecret is set, the
  # chart wires SQLHANDLER_API_KEYS from that Secret's key and every /mcp
  # request needs a valid key (X-API-Key or Bearer). Leave empty for
  # gateway-fronted deployments — the server then runs open (with a loud
  # startup warning). Comma-separated keys all authenticate: that is the
  # rotation mechanism — append the new key, move clients over, drop the old
  # one, no downtime. The fleet-universal MCP_API_KEYS env is honored too
  # (either var authenticates).
  apiKey:
    existingSecret: ""
    existingSecretKey: api-keys
  # Optional auth gate on /metrics + /ready (audit: both leak table counts,
  # RSS and error strings unauthenticated). Default false = today's
  # behavior (open). When true, a scrape/read must present SQLHANDLER_API_TOKEN
  # or an /mcp API key (MCP_API_KEYS / SQLHANDLER_API_KEYS) as
  # X-API-Key / X-API-Token / Bearer — wire the matching header into the
  # Prometheus scrape config; liveness probes keep using /health (open).
  # With the gate on but NO credential source configured, both endpoints
  # 401 for everyone (fail closed, loud startup warning).
  metricsAuth: false
  # Ingress NetworkPolicy: default-deny, then allow (a) the pod's own
  # namespace, (b) the Istio gateway namespace below, (c) allowedNamespaces.
  # Egress is NOT restricted (the server must reach AAD/OneLake/S3).
  #
  # DEFAULT OFF: in-cluster callers (MCP agents, OWUI, DSH, ...) reach the
  # Service directly with zero friction — the right posture for short-lived
  # test deployments. The Service stays ClusterIP, so nothing is exposed
  # outside the cluster. Turn this ON for production / real-data
  # deployments, and add direct-caller namespaces to allowedNamespaces
  # below (flipping it on re-breaks any caller not listed).
  networkPolicy:
    enabled: false
    gatewayNamespace: istio-system
    # Extra namespaces whose pods may call this service directly
    # (in-cluster MCP clients, OWUI, DSH, ...). Cluster-internal access
    # stays frictionless: add the client's namespace here.
    allowedNamespaces: []
    # Raw extra NetworkPolicy `from:` peers (CIDRs, podSelectors...),
    # appended verbatim to the ingress rules.
    additionalIngress: []
  # Pod-level Istio AuthorizationPolicy (east-west, service-to-service).
  # Off by default: principal names are deployment-specific and a wrong
  # list locks the service completely. The gateway authz (ezua.*) plus the
  # NetworkPolicy above already cover the common cases. When enabled, at
  # least one of principals/namespaces is REQUIRED (an ALLOW policy with
  # no rules would deny everything).
  authorizationPolicy:
    enabled: false
    # e.g. ["cluster.local/ns/istio-system/sa/ezaf-gateway-service-account"]
    principals: []
    # Allowed caller namespaces (Istio identity namespaces).
    namespaces: []
  # Policy-as-code: per-caller row filters, column masks and hidden tables
  # from an operator-authored JSON/YAML file (documentation/MCP.md). The
  # server reads the file named by SQLHANDLER_POLICY_FILE (policy.py) and
  # hot-reloads it on mtime; a PRESENT but INVALID file fails closed with
  # E_POLICY rather than degrading — operator-authored config must never
  # half-apply. This block is what makes `security.policy.enabled` real:
  # without the mount + env wiring below the flag was a silent no-op (the
  # server never saw a policy file, the admin panel 403'd for everyone).
  policy:
    # Master switch — renders the policy mount and sets SQLHANDLER_POLICY_
    # ENABLED=1 (policy.py's truthy set: 1/true/yes/on). Default false:
    # policy-as-code is opt-in per site.
    enabled: false
    # Name of an EXISTING ConfigMap carrying the policy document (key:
    # existingConfigMapKey) — manage it out-of-band like the credential
    # Secrets. REQUIRED unless existingClaim is set; the render fails
    # otherwise (an enabled policy with no source locks every gated
    # surface for every caller). The engine hot-reloads ConfigMap edits
    # (kubelet syncs the mount, mtime changes) — no rollout needed.
    existingConfigMap: ""
    existingConfigMapKey: policy.json
    # Where the policy volume is mounted; SQLHANDLER_POLICY_FILE points at
    # <mountPath>/<fileName>. The seed ConfigMap mounts at <mountPath>-seed.
    #
    # MUST NOT sit under semanticCatalog.mountPath (default /etc/sqlhandler):
    # that directory is the read-only catalog ConfigMap mount, and nesting
    # the policy volumes inside it left the kubelet stuck in
    # ContainerCreating with the volume attached and NO mount error (live
    # 2026-10-20, 8+ minutes, zero ready replicas). The template fails the
    # render on any overlap so this cannot regress silently.
    mountPath: /etc/sqlhandler-policy
    # Writable alternative to the read-only ConfigMap: mount this PVC at
    # mountPath so the live policy file is editable through the admin
    # panel (the mount is read-write — the panel writes <fileName>).
    # The ConfigMap above (required while seedFromConfigMap is on) stays
    # mounted — read-only, at <mountPath>-seed — purely as the seed source.
    #
    # Prefer `claim.create` below over pointing this at an existing claim.
    # Do NOT reuse the catalog claim (semanticCatalog.store,
    # <release>-catalog): mounting ONE claim twice (catalog store + policy)
    # hung every pod in ContainerCreating for 8+ minutes on 2026-10-20 with
    # the volume attached and NO mount error in the events. Use a DEDICATED
    # claim so every claim is mounted exactly once.
    # Leave empty to let the chart create <release>-policy (the DEFAULT).
    # Set this ONLY when you manage the claim yourself — and note the chart
    # cannot verify it exists: a typo or a skipped `kubectl apply` surfaces
    # as pods stuck Pending on "persistentvolumeclaim ... not found", with
    # no actionable message at install time. Prefer claim.create.
    existingClaim: ""
    # CHART-OWNED writable policy volume — THE DEFAULT.
    #
    # WHY the chart owns it: ConfigMap mode is a read-only mount by
    # construction, so EVERY admin write fails with "[Errno 30] Read-only
    # file system" — the panel looks broken while enforcement (reads) still
    # works. Claim mode is the only way panel edits persist, and requiring a
    # hand-applied PVC before the upgrade was a silent deploy-time trap
    # (live 2026-10-21: pods sat Pending on "persistentvolumeclaim
    # \"sqlhandler-policy-rw\" not found" because the manual apply step was
    # missed). Creating the claim here makes a correct deployment the
    # DEFAULT one — no out-of-band step to forget.
    #
    # ReadWriteMany is REQUIRED whenever replicas can exceed 1 (the render
    # fails otherwise): the policy is one live file every replica hot-reloads
    # by mtime, so an RWO claim would strand the extra pods Pending AND let
    # replicas disagree about the ACL.
    claim:
      # true = render <release>-policy and mount it read-write. Set false ONLY
      # together with existingClaim, or to run the read-only ConfigMap mode.
      create: true
      accessModes: [ReadWriteMany]
      storageClass: ""      # "" = cluster default
      size: 1Gi             # policy documents are KBs
    # Policy file name inside the mount (both modes).
    fileName: policy.json
    # One-time seed (claim mode only): on first boot the server copies the
    # ConfigMap document to the live file when the live file does not
    # exist yet (server.py _seed_policy_from_configmap). After that the
    # live file is the truth FOREVER — ConfigMap edits stop applying (the
    # documented trade of the writable-policy mode).
    #
    # A missing policy file is a PERMISSIVE default, not an error: the server
    # serves with no row filters, no masks and nothing hidden, and logs a loud
    # "POLICY IS NOT RESTRICTING ANYTHING" warning at startup. That is the
    # intended bootstrap state — the pod must be reachable so an operator can
    # author the policy. (A PRESENT-but-INVALID file is different: it fails
    # closed, hiding every covered table, while still serving.)
    #
    # Seeding is what carries an EXISTING policy across the ConfigMap→claim
    # switch. Leave it true on an upgrade so current ACLs survive; set it
    # false on a genuinely fresh install to start from the permissive default.
    seedFromConfigMap: true

  # -- OIDC identity rung (self-mint) ---------------------------------------
  # Verifies Bearer JWTs AND the SSO session cookie (oidc_identity.py).
  # A verified token resolves Caller(via="jwt", subject=<identityClaim>) —
  # the ONLY rung the self-mint accepts. Left empty/undocumented by
  # default: OFF unless enabled is true with a real issuer.
  oidc:
    enabled: false
    issuer: ""          # e.g. https://keycloak.<domain>/realms/UA
    audience: ""        # e.g. ua
    identityClaim: preferred_username
    # In-cluster JWKS endpoint (http://...svc); the https issuer URL is
    # only reachable when platformCa below supplies the private CA.
    jwksUrl: ""
    jwksRefreshSeconds: "3600"
    fetchTimeoutSeconds: "3"
    clockSkewSeconds: "60"
    # Platform CA bundle for the private-CA issuer (PCAI): mounted
    # read-only and handed to the JWKS fetcher via REMOTE_CA_BUNDLE.
    platformCa:
      enabled: false
      configMapName: ezaf-root-ca
      configMapKey: ezaf-root-ca.crt
      mountPath: /etc/platform-ca
      bundleFile: ca-certificates.crt

  # -- Self-mint keys store (admin_keys.py) ---------------------------------
  # JSON file the self-mint writes minted keys to. mountPath must be a
  # WRITABLE directory — a subpath of an RWX claim is the usual choice.
  # Without it self-mint answers 503 "the keys store is not configured".
  adminKeys:
    mountPath: ""       # e.g. /var/lib/sqlhandler-catalog/admin-keys
    existingClaim: ""   # optional dedicated claim; usually a subpath of
                        # the semanticCatalog.store claim (already mounted)

  # Self-mint rotate cap: minting beyond this revokes the OLDEST
  # self-minted key for the subject (server.py _self_mint_enforce_cap).
  selfMintMaxKeys: 1

  runAsUser: 1000
  readOnlyRootFilesystem: true
  # The app never calls the Kubernetes API; don't hand it a token.
  automountServiceAccountToken: false

# -- OneLake / Fabric connection ---------------------------------------------
# Sensitive values go in a Kubernetes Secret; non-secret connection details
# go in a ConfigMap. NEVER put the service-principal secret in values.yaml.
#
# fabric.credentialsSecret.name refers to a Secret you create separately
# (via `kubectl create secret`, or by the chart when
# fabric.credentialsSecret.create is true).
fabric:
  # Secret name + keys holding the Entra service-principal credential.
  credentialsSecret:
    name: fabric-credentials
    tenantIdKey: tenant-id
    clientIdKey: client-id
    clientSecretKey: client-secret
    # Set create: true AND fill the values below ONLY to have the chart
    # create the Secret for you (e.g. a non-production bootstrap). Prefer
    # creating the Secret out-of-band with `kubectl create secret` or a
    # sealed/encrypted Secret so the service-principal secret never lands
    # in a values file. NEVER commit real credentials.
    create: false
    values:
      tenantId: ""
      clientId: ""
      clientSecret: ""

  # Non-secret connection details injected via ConfigMap.
  lakehouseAbfssUrl: ""          # e.g. abfss://<ws>@onelake.dfs.fabric.microsoft.com/<lh>
  workspaceId: ""                # fallback (if no full URL)
  lakehouseId: ""                # fallback (if no full URL)
  authority: onelake.dfs.fabric.microsoft.com
  # Extra delta-rs storage options (JSON-merged into the env): object-client
  # retries, timeouts, connection behavior for the OneLake backend.
  storageOptions: {}

# -- S3 / MinIO backend (used when backend: s3) ------------------------------------
# Non-secret values (endpoint/bucket/prefix) go in the ConfigMap; the access
# key and secret go through a Kubernetes Secret - NEVER in values.yaml.
s3:
  # Secret name + keys holding the S3 credentials. Create the Secret
  # out-of-band (the default), e.g.:
  #   kubectl -n <namespace> create secret generic s3-credentials \
  #     --from-literal=access-key=<S3_ACCESS_KEY> \
  #     --from-literal=secret-key=<S3_SECRET_KEY>
  # Retrieve/rotate later with:
  #   kubectl -n <namespace> get secret s3-credentials -o jsonpath='{.data.access-key}' | base64 -d
  #   kubectl -n <namespace> get secret s3-credentials -o jsonpath='{.data.secret-key}' | base64 -d
  # Dev/local credentials that must stay out of git belong in helm/local/
  # (gitignored — see helm/local/README.md).
  credentialsSecret:
    name: s3-credentials
    accessKeyKey: access-key
    secretKeyKey: secret-key
    # Keep false: with create: true the chart renders the Secret FROM the
    # values below, which then live in values files and the Helm release
    # secret (readable via `helm get values <release> -a`). Only for
    # throwaway clusters, never for a shared chart.
    create: false
    values:
      accessKey: ""
      secretKey: ""

  # MinIO/S3 connection details (non-secret -> ConfigMap).
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"   # in-cluster MinIO
  region: us-east-1
  bucket: "test-parquet"
  prefix: ""                  # optional sub-tree within the bucket
  anonymous: false            # read public buckets without keys
  useSsl: false               # force https when endpointUrl has no scheme
  # Extra pyarrow S3FileSystem kwargs (JSON-merged into the env): timeouts,
  # retry limits, connection behavior. e.g. {request_timeout: 120}
  options: {}

# -- Iceberg backend (used when backend: iceberg) ---------------------------------
# Tables are discovered through an Iceberg catalog; the Parquet data files
# live in your object store (S3_* storage vars) or on a local disk. The
# catalog token (REST) and S3 keys go through a Secret, never values.yaml.
iceberg:
  catalogType: rest            # rest | sql
  catalogUri: ""              # e.g. http://rest-catalog:8181 or sqlite:///path
  catalogName: sqlhandler      # SQL catalogs partition by this name
  warehouse: ""               # optional table location root
  namespace: ""               # optional namespace filter
  # Credentials Secret: REST token + S3 access/secret keys (create out-of-band).
  credentialsSecret:
    name: iceberg-credentials
    tokenKey: token
    accessKeyKey: access-key
    secretKeyKey: secret-key
    create: false
    values:
      token: ""
      accessKey: ""
      secretKey: ""
  # S3 storage for the Iceberg data files (optional).
  storage:
    endpointUrl: ""
    region: us-east-1
    anonymous: false

# -- NFS / local filesystem backend (used when backend: nfs) ---------------------
# Reads Parquet files from a directory mounted into the container (hostPath,
# NFS via a PV/PVC, or any volume). No credentials required.
nfs:
  # Absolute path of the mounted directory containing Parquet files.
  rootDir: "/data"
  # Optional volume to mount providing the data (only when backend: nfs).
  mount:
    enabled: false
    pvcName: ""           # PVC to mount
    mountPath: "/data"    # where it is mounted inside the container
    readOnly: true


# -- Metadata caching --------------------------------------------------------
# In-process cache for list_tables / describe_table (see README "Performance
# & caching"). These map to SQLHANDLER_CACHE_TTL / SQLHANDLER_PREWARM_TABLES.
cache:
  # Seconds to keep list_tables / describe_table results in memory (0 disables).
  ttl: 3600
  # How often (seconds) a Delta snapshot version is re-checked to invalidate a
  # cached Dataset (0 = every query; default 10).
  versionCheckInterval: 10
  # Comma-separated table names whose data should be warmed at startup,
  # e.g. "work_order_header,work_order_note_recent".
  prewarmTables: ""
  # Row groups read per prewarmed table (0 = off, default 1). The prewarm
  # thread reads the first N row groups of each prewarmTables entry, so the
  # first real query over them is not a cold object-store read. Costs a
  # bounded amount of startup IO — raise it only for tables whose FIRST
  # rows are what queries touch (range-filtered scans on a sorted column).
  prewarmRowgroups: 1
  # Serve list_tables from the cache immediately and refresh it in the
  # background (plus automatically once per `ttl` seconds), so callers never
  # block on the slow S3/DFS listing. Set false for fully synchronous calls.
  listAsyncRefresh: true
  # DuckDB query-engine budget as a fraction of the POD's memory limit (see
  # src/sqlhandler/resources.py) — DuckDB spills to `spillDir` when a query
  # would otherwise grow RSS past the pod limit and get OOMKilled (which
  # wipes every in-process cache). "0" disables the cap (DuckDB defaults).
  duckdbMemoryFraction: "0.6"
  # Directory DuckDB spills to — under /tmp, which the hardened profile
  # backs with an emptyDir that survives container restarts.
  spillDir: /tmp/sqlhandler-duckdb-spill
  # Directory for the disk-warm metadata cache (survives container restarts
  # so the first describe after an OOMKill is not cold). Point at a PVC
  # mount path to also survive pod rescheduling.
  cacheDir: /tmp/sqlhandler-cache
  # -- Virtual-table performance (README: "Virtual tables") -----------------
  # Seconds a virtual table's materialized result is reused. The cache key
  # covers the definition (and everything it builds on) plus every base
  # table's Delta/Iceberg snapshot version, so new ETL commits invalidate
  # immediately; the TTL is only a backstop. 0 disables materialization.
  virtualCacheTtl: 3600
  # Where materialized results are written. Default: cacheDir above. Point
  # at an RWX PVC shared by all replicas to materialize once per deployment
  # instead of once per pod.
  virtualCacheDir: ""
  # Cluster (sort) materialized virtual results by their lowest-cardinality
  # columns so row-group statistics prune filtered reads. 0 disables.
  virtualCacheSort: true
  # Seconds an identical query's result is served from memory (keyed by
  # sql/params/limits + base-snapshot versions). 0 disables.
  resultCacheTtl: 3600
  # In-memory byte cap for cached query results (LRU-evicted).
  resultCacheMaxBytes: "268435456"
  # -- Shared L2 result cache (cross-replica) -------------------------------
  # The memory cache above is PER REPLICA: with N replicas behind one Service,
  # a repeated query lands on a different pod ~(N-1)/N of the time and pays
  # the cold path again. That is the whole "cached results are still slow"
  # experience on a scaled-out deployment — the cache is warm, just not on
  # the pod that answered. L2 writes each result to a shared directory so
  # every replica can read it back (src/sqlhandler/l2cache.py).
  #
  # REQUIRES an RWX volume (e.g. the catalog PVC, ReadWriteMany). On an RWO
  # claim each pod mounts its own volume, so the cache looks shared while
  # sharing nothing — leave `dir` empty rather than point it at pod-local
  # /tmp, which the engine deliberately refuses to default for that reason.
  l2:
    enabled: false
    # Directory all replicas share. Must be an RWX mount path.
    dir: ""
    # Seconds a shared entry stays valid (mirrors resultCacheTtl).
    ttl: "3600"
    # Results below this many bytes are not shared. The engine default is
    # 256 KiB (a tiny result can cost more to round-trip the volume than to
    # recompute), but the MCP row cap is 1000 rows, so an interactive result
    # is typically tens of KB — at 256 KiB the layer is enabled and shares
    # nothing. 1 KiB keeps small-but-real results shared; raise it toward
    # 256 KiB if the volume is slow and recompute is cheap for your data.
    minBytes: "1024"
    # Byte cap on the shared volume; expired entries are swept lazily.
    maxBytes: "2147483648"
    # Publish off the query path (a dropped write is just a cache miss).
    writeAsync: true
  # -- Disk block cache (object-store reads) --------------------------------
  # Opt-in disk cache for parquet footers/column chunks read through pyarrow
  # filesystems (s3 + iceberg backends; delta-rs IO on onelake is not
  # wrappable). Off by default: cold big sequential scans pay a small
  # Python-layer cost, repeated/filtered/preview reads win big.
  blockCache:
    enabled: false
    # Cache location. Default: <tmp>/sqlhandler-block-cache.
    dir: ""
    # Bytes per cached block (bigger = fewer remote round-trips).
    blockSize: "8388608"
    # Total cache size; the cache resets itself when exceeded.
    maxBytes: "4294967296"
    # 1 also caches LocalFileSystem paths — NFS mounts ARE LocalFileSystem
    # to pyarrow while being network; real-local disk is already covered by
    # the OS page cache.
    includeLocal: false

# -- Semantic catalog ----------------------------------------------------------
# The "semantic view": human-written table/column descriptions merged into
# list_tables / describe_table output (and the MCP resources), so agents see
# business meaning, not just dtypes. Full spec + shareable data-owner guide:
# docs/semantic-catalog.md (README: "Semantic catalog").
#
# Deploy = set enabled: true and paste your catalog AS NATIVE YAML under
# `tables:` below — no stringification, it is ordinary values structure. The
# chart renders it into a ConfigMap, mounts it read-only at
# <mountPath>/semantic-catalog.json, and points SQLHANDLER_CATALOG at it.
# The engine hot-reloads the file on change (mtime), so a catalog edit via
# `helm upgrade` (or a PCAI re-deploy) updates the docs WITHOUT a pod
# restart. A broken catalog never breaks queries — it degrades to empty.
#
# Zero-values alternative: deploy as-is, then upload a .json/.yaml catalog
# from the data explorer's "Semantic catalog" panel (POST
# /api/semantic-catalog; store defaults next to cache.cacheDir). Uploads are
# per-replica and pod-local (emptyDir) unless SQLHANDLER_CATALOG_STORE points
# at a PVC — the values route below is the durable, all-replica one.
semanticCatalog:
  enabled: false
  # Directory inside the pod where the catalog ConfigMap is mounted (the
  # file lands at <mountPath>/semantic-catalog.json). Rarely changed.
  mountPath: /etc/sqlhandler
  # The catalog as NATIVE values — paste plain YAML, no stringification:
  #   tables:
  #     <schema/name | source-qualified | bare>:
  #       description: ...
  #       aliases: [...]
  #       columns: {col: doc}
  #       definition: |          # optional — makes the entry a VIRTUAL table
  #         SELECT ...           # (single read-only SELECT/WITH, DuckDB dialect)
  # Rendered to canonical JSON into the ConfigMap. Entry shapes are validated
  # at render time (each table entry must be a mapping) — operator-authored
  # config must not fail silently (same philosophy as SQLHANDLER_ATTACH).
  tables: {}
  # Alternative: the catalog as an inline JSON STRING ({"tables": {...}}) —
  # for machine-generated catalogs. Mutually exclusive with `tables` and
  # `yaml` (setting more than one non-empty fails the render).
  json: ""
  # Alternative: the catalog as an inline YAML STRING — verbatim paste of a
  # semantic-catalog.yaml file, no re-indenting needed. The engine reads YAML
  # natively, so the string is stored as-is. Mutually exclusive with `tables`
  # and `json`.
  yaml: ""
  # Alternative for teams managing the catalog out-of-band (like credential
  # Secrets): name of an EXISTING ConfigMap carrying a `semantic-catalog.json`
  # key. When set, the chart renders no ConfigMap of its own but still mounts
  # it and wires the env var.
  existingConfigMap: ""
  # -- Upload store: persisted + cross-pod --------------------------------------
  # By default UI/API catalog uploads land next to the disk cache on the pod's
  # tmp emptyDir: per-replica, and gone on reschedule. Enable the store to
  # back uploads with a PVC instead — an upload from any replica then reaches
  # every replica and survives rescheduling, still with NO rollout (the
  # engine hot-reloads the file on mtime change). Works standalone too (with
  # enabled: false above): deploy, then seed the catalog from the UI. Until a
  # first upload exists, the values catalog above — if any — is what every
  # pod serves.
  # REQUIREMENT: ReadWriteMany storage whenever replicas can exceed 1. RWO
  # classes (EBS, local-path, ...) attach on one node only and strand the
  # other replicas Pending — the render fails loudly on that mismatch.
  store:
    enabled: false
    # When set, mount this existing PVC (no PVC is created). Leave "" to
    # have the chart create one named <release>-catalog.
    existingClaim: ""
    # Catalog content is KBs of text — 1Gi is ~100x headroom.
    size: 1Gi
    # "" = cluster default StorageClass; it must offer the access mode below.
    storageClass: ""
    # [ReadWriteOnce] ONLY for single-replica deployments (replicaCount: 1,
    # autoscaling off) — PVC access modes are immutable once created.
    accessModes: [ReadWriteMany]
    # Where the store volume is mounted; SQLHANDLER_CATALOG_STORE points at
    # <mountPath>/semantic-catalog.json. The upload API writes here, so the
    # mount is read-write (unlike the values-catalog ConfigMap mount).
    mountPath: /var/lib/sqlhandler-catalog
    # Saved parameterized queries (SQLHANDLER_SAVED_QUERIES_PATH) ride the
    # SAME claim as the catalog store by default, for the same reason: they
    # are operator content, not cache.
    #
    # WHY this needs to be explicit: with no SQLHANDLER_SAVED_QUERIES_PATH,
    # saved.py falls back to SQLHANDLER_CACHE_DIR — which the chart points at
    # /tmp/sqlhandler-cache, an emptyDir. Saved queries then die with the pod
    # AND diverge per replica (a query saved through one replica is invisible
    # to the other). The catalog store got a PVC path; saved queries did not,
    # which was an inconsistency in the chart's env wiring rather than a
    # deliberate choice. Set to "" to restore the old pod-local behaviour.
    savedQueriesPath: ""

# -- Runtime arguments for the sqlhandler entrypoint --------------------------
containerArgs:
  - --transport
  - streamable-http
  - --host
  - 0.0.0.0
  - --port
  - "9097"

# -- Ingress (optional; PCAI normally uses the Istio VirtualService below) ----
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sqlhandler.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Pod-level annotations / node placement -------------------------------------
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration --------------------------
# When enabled, deploys the Istio VirtualService, Istio AuthorizationPolicy,
# and a Kyverno ClusterPolicy that tags this workload as a vendor-service so
# the PCAI platform can discover and monitor the MCP endpoint.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"

  # Kyverno ClusterPolicy that tags this workload as a PCAI vendor-service.
  # Disable on clusters without the kyverno.io CRD — the post-install hook
  # would otherwise fail the whole release (the same labels are already set
  # directly by sqlhandler.ezua.labels in _helpers.tpl).
  kyverno:
    enabled: true

  virtualService:
    # Public endpoint on the PCAI gateway. MCP clients connect to:
    #   https://<endpoint>/mcp
    endpoint: "sqlhandler.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    # Default for normal calls (health etc.); the /mcp route uses longTimeout.
    timeout: 60s
    # MCP streamable-http is long-lived (tool calls, streaming responses).
    longTimeout: 3600s

  # configure the authorization policy (oauth2-proxy in front of PCAI).
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ==== Wave 2026-10-16 helm-side port (routing / podMonitor / scratch writes) ====

metrics:
  podMonitor:
    enabled: true
    # Set the podMonitorSelector match label here or the target never appears.
    additionalLabels: {}
    # {name: <secret>, key: <key>} — omit for open scraping.
    bearerTokenSecret: {}


routing:
  affinity:
    # Renders the DestinationRule when true; behavior changes only for callers that SEND headerKey.
    enabled: false
    # Header Istio hashes on (e.g. an agent session id); Istio does not create it.
    headerKey: "x-sqlhandler-session"
    # Destination host the rule applies to (empty = the in-cluster service FQDN).
    host: ""

# Agent-facing scratch writes (CTAS/INSERT/COPY INTO) under subject-scoped
# namespaces; every target must resolve under <scratch-root>/<subject-slug>/...
writes:
  enabled: false

  scratch:
    # Allowlisted scratch roots: comma-separated [name=]<path> entries; an iceberg://
    # prefix marks a pyiceberg root. Empty = nothing classifies (fail closed).
    roots: ""
    # Advisory single-writer lease TTL in seconds
    leaseTtl: "300"
    # pyiceberg scratch catalog (backend iceberg only): SQL-catalog DB URI
    icebergCatalogUri: ""
    icebergWarehouse: ""
    # RWX: with replicaCount > 1 the scratch root MUST be ReadWriteMany.
    pvc:
      # Dedicated RWX PVC for scratch — enable with writes.enabled
      enabled: false
      size: 10Gi
      storageClass: ""
      accessModes: []        # default [ReadWriteMany], guarded at render
      mountPath: /scratch
      existingClaim: ""      # mount an existing claim instead of creating one
