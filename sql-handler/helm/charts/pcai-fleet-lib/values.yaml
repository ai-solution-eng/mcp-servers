# pcai-fleet-lib is a LIBRARY chart: these values document the contract only —
# they are never rendered (a library chart ships no resources; every template
# takes an explicit dict argument from the caller).
#
# The fleet's semantics live in the CONSUMING chart's values.yaml; the shapes
# below record what the fleet's charts use today, so a new chart can start
# from the same numbers:
#
# MCP-trio httpGet pattern (workbench, applygate, logsearch, prometheus):
#   startup 5s/12 · readiness 10s/3 · liveness 30s/3 on /healthz
#
# SQLhandler pattern (httpGet /health + /ready; startup timeout mirrors liveness):
#   liveness 15s delay, 20s period, 5s timeout · readiness 5s/10s/20s (real
#   backend check) · startup 5s period, 24 failures
#
# Hardened securityContext profile (workbench, SQLhandler security.hardened):
#   pod: runAsNonRoot, runAsUser/fsGroup 10001 (workbench), seccomp
#   RuntimeDefault, no SA token; container: read-only rootfs, no privilege
#   escalation, caps drop ALL (workbench block-style, SQLhandler flow)
#
# Metrics (default OFF — the default-off gate is part of the contract):
#   metrics: {enabled: false, interval: 30s}   # or serviceMonitor: false (RAG's knob)
#
# Kyverno vendor-label policy (default OFF — cluster-scoped):
#   kyverno: {enabled: false}
#
# AuthorizationPolicy (default OFF — prometheus's existing pattern):
#   ezua.authorizationPolicy: {enabled: false, namespace: istio-system, providerName: oauth2-proxy}
