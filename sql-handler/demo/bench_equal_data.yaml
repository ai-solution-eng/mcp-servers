apiVersion: batch/v1
kind: Job
metadata:
  name: bench-equal-data
  namespace: sqlhandler
  labels:
    app.kubernetes.io/name: sqlhandler-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlhandler-bench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: bench
        image: ghcr.io/ai-solution-eng/sqlhandler:v2.3.2
        command:
        - python
        - -c
        - 'import base64,os; exec(base64.b64decode(os.environ["BENCH_SRC"]).decode())'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
