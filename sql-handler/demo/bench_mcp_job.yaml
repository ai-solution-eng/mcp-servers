apiVersion: batch/v1
kind: Job
metadata:
  name: bench-mcp-mcp
  namespace: sqlhandler
  labels:
    app.kubernetes.io/name: sqlhandler-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlhandler-bench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: bench
        image: ghcr.io/ai-solution-eng/sqlhandler:v2.3.2
        command:
        - python
        - -c
        - 'import pyarrow.fs as fs, os; s3 = fs.S3FileSystem(access_key=os.environ["S3_AK"], secret_key=os.environ["S3_SK"], endpoint_override="http://minio.minio.svc.cluster.local:9000", scheme="http"); f = s3.open_input_stream("test-parquet/demo/bench_mcp_script.py"); src = f.readall().decode(); exec(compile(src, "/tmp/bench.py", "exec"))'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: S3_AK
          value: "admin-io"
        - name: S3_SK
          value: "MinIO$2K"
        - name: SQLHANDLER_API_KEY
          value: "d9e657d4799ba4ed9cddbe4539311c3174f58de8731f3cddf8a498ed139adf8a"
        - name: EZPRESTO_BEARER
          value: "eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJWMV9IZjlqZFVRZGdTal9lbU8yeDNZcjdWN1Q2MG1KaDFMMUJjMTRuS3pBIn0..i5CAuMiq2_ibruc8s7DWgegVWVNXDhQHP2eG7tBWlOzCOVWMC3GYbYu-9mgG7ttw3GkJX0GAydY8dCfR7JF8pfI3F22tLXlzIRNc5VbT-taExuAtkR3d0o2t-BUbCI9opbECM0PsIlpY4G7OrHUZlLmMu1chbea_8EBAjVNW9dgBuXTl8wzUQRUjPBrp-IwlTR7OJIa2QaBd-gREZu430pTV9Hxh8XpPZtdObbIAgKVd7qZud1OXI1m-99jEWvT6BodwZMXyZvg260gy1HJP74Ecbph8KagSTRcyg3JoyLi2uXlJwgQwA7DBzsFgM-RJ5nShEViv4kUm7-ivNhid6g"
