[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlhandler"
version = "4.1.0"
description = "Fast, direct SQL access to columnar data: OneLake/Delta Lake or S3/MinIO Parquet, exposed as an MCP server (an EzPresto replacement)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "HPE AI Solution Engineering" }]
dependencies = [
    "mcp>=2.0.0",           # MCP 2.0 SDK (MCPServer, stateless streamable-http)
    "pyarrow>=17.0.0",      # S3 (AWS/MinIO) + Azure filesystems + dataset engine, bundled in pyarrow
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "deltalake>=1.0.0",     # native Delta reader with OneLake ABFS storage options (onelake backend)
    "azure-identity>=1.17",                # OneLake service-principal auth (keep aligned with the Dockerfile)
    "azure-storage-file-datalake>=12.14",  # OneLake ABFS data-plane client (keep aligned with the Dockerfile)
    "uvicorn>=0.30.0",      # streamable-http (MCP 2.0) + health endpoints
    "starlette>=0.40.0",    # ASGI app for /health, /ready and /mcp
    "pyyaml>=6.0",          # YAML semantic catalogs (uploads accept JSON or YAML)
    "pygments>=2.11",       # SV editor highlighting — server-side, guessed lexer (rcat's pygmentize -g)
]

[project.optional-dependencies]
# Iceberg backend (catalog + Parquet data files). SQL catalog also needs
# SQLAlchemy for local/sqlite catalogs.
iceberg = [
    "pyiceberg[pyarrow]>=0.10",
    "sqlalchemy>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "sqlalchemy>=2.0",
]

[project.scripts]
sqlhandler = "sqlhandler.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlhandler"]
# Ship the read-only web UI (index.html) inside the package so the server can
# serve /ui and / from any install (source checkout, editable, or wheel).
include = ["ui/**"]

# Ruff config lives in ruff.toml (the fleet-shared file, hardlinked in).
# A [tool.ruff] block here was DEAD: ruff resolves ruff.toml over
# pyproject.toml in the same directory, so the two silently disagreed on
# line-length (100 vs 120) and target-version (py311 vs py312). Removed in
# the 2026-11-12 audit cleanup — edit ruff.toml, not this file.

# Wave 2026-10-16: put the repo root on sys.path so tests can import
# the tests package (tests/test_perf.py imports tests.test_virtual).
# No tests/__init__.py exists in either tree; pythonpath is the least invasive fix.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# duckdb is pinned to 1.5.5 for two independent reasons:
#   1. EXACT extension match — the vendored/baked scanner extensions are built
#      per DuckDB version (duckdb-ext/v1.5.5); another version refuses to LOAD
#      them, breaking every external-catalog ATTACH type.
#   2. 2.0.0's new Python Arrow scan (PYTHON_ARROW_SCAN) no longer pushes
#      filters into registered pyarrow datasets — and EVERY lake table here is
#      one, so a filtered scan would read the whole table. Verified 2026-11:
#      the plan shows FILTER above the scan and EXPLAIN ANALYZE reads all rows.
#      Revisit when DuckDB restores Arrow filter pushdown.
# Bump BOTH (extensions + this pin) and re-run the suite before releasing.
constraint-dependencies = ["duckdb==1.5.5"]
