apiVersion: batch/v1
kind: Job
metadata:
  name: bench-mcp-mcp
  namespace: sqlhandler
  labels:
    app.kubernetes.io/name: sqlhandler-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlhandler-bench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: bench
        image: ghcr.io/ai-solution-eng/sqlhandler:v2.3.2
        command:
        - python
        - -c
        - 'import pyarrow.fs as fs, os; s3 = fs.S3FileSystem(access_key=os.environ["S3_AK"], secret_key=os.environ["S3_SK"], endpoint_override="http://minio.minio.svc.cluster.local:9000", scheme="http"); f = s3.open_input_stream("test-parquet/demo/bench_mcp_script.py"); src = f.readall().decode(); exec(compile(src, "/tmp/bench.py", "exec"))'
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        env:
        - name: S3_AK
          value: "admin-io"
        - name: S3_SK
          valueFrom:
            secretKeyRef:
              name: bench-minio-creds
              key: secret-key
        - name: SQLHANDLER_API_KEY
          valueFrom:
            secretKeyRef:
              name: bench-sqlhandler-api
              key: api-key
        - name: EZPRESTO_BEARER
          valueFrom:
            secretKeyRef:
              name: bench-ua-bearer
              key: token
