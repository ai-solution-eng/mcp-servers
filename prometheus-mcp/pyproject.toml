[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-mcp"
version = "0.7.0"
description = "Prometheus MCP Server — read-only PromQL queries, series/label discovery, alerts and rules over MCP"
requires-python = ">=3.10"
keywords = ["mcp", "prometheus", "monitoring", "model-context-protocol"]

dependencies = [
    "httpx2>=2.12.0",
    "mcp>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
prometheus-mcp = "prometheus_mcp.server:main"

[tool.setuptools]
# Layout: the app modules live in the src layout under src/prometheus_mcp/ and
# ship as the prometheus_mcp PACKAGE (package-dir points setuptools at src/).
# Only the repo-root mcp_auth.py — the fleet hardlink, imported as a top-level
# module — remains a top-level py-module. Every package module must be INSIDE
# src/prometheus_mcp/ in the build context or setuptools SILENTLY omits it
# (the W7 deploy-blocker class) — the Dockerfile COPYs the whole src/ tree.
package-dir = {prometheus_mcp = "src/prometheus_mcp"}
packages = ["prometheus_mcp"]
py-modules = ["mcp_auth"]

[tool.pytest.ini_options]
# "src" makes "from prometheus_mcp import ..." resolve (tests import the
# package absolutely); "." makes the top-level "import mcp_auth" resolve from
# the repo root. Both entries are required when pytest runs from there.
pythonpath = ["src", "."]
