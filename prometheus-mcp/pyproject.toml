[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-mcp"
version = "0.5.1"
description = "Prometheus MCP Server — read-only PromQL queries, series/label discovery, alerts and rules over MCP"
requires-python = ">=3.10"
keywords = ["mcp", "prometheus", "monitoring", "model-context-protocol"]

dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
prometheus-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "prom_client", "webui", "saved_queries", "mcp_metrics"]
