# ============================================================================
# prometheus-mcp — read-only Prometheus observation over MCP (PromQL
# queries, series discovery, alerts, rules) for PCAI, exposed at /mcp
# through the PCAI Istio gateway (MCP clients run outside the cluster).
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. prometheusUrl — the in-cluster Prometheus this deployment IS [no render
#      guard: the default targets the kube-prometheus-stack service, verified on
#      G2 — set it to your cluster's Prometheus deliberately]
#   2. ezua.virtualService.endpoint — required whenever ezua.enabled (chart
#      default true); templates call `required` on it — the render aborts without it

# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer, don't improvise)
#   GPU/NVLink tab: gpuNvlinkDomains, nvlinkAutodetect.* — documentation/DEPLOYMENT.md "Optional values" | values-examples/values.g2.yaml
#   Gateway auth (oauth2-proxy/SSO): ezua.authorizationPolicy.* — documentation/DEPLOYMENT.md "Gateway exposure"
#   Saved-query persistence: persistence.* — documentation/DEPLOYMENT.md | values-examples/values.hosted-trial.yaml
#   Network zone (ingress allowlist): networkPolicy.* — values-examples/values-hardened-g2.yaml (OVERLAY)
#   Self-metrics + ServiceMonitor: metrics.* — documentation/DEPLOYMENT.md
#   API-key gate on /mcp: apiKey.existingSecret — README "API-key auth"
#   Nodes-tab default filter: nodeFilter — documentation/DEPLOYMENT.md "Optional values"

# ============================================================================
# Deployment / Image
# ============================================================================

deployment:
  name: prometheus-mcp
  appName: prometheus-mcp
  replicaCount: 1

image:
  repository: ghcr.io/ai-solution-eng/prometheus-mcp
  # Registry tags are mutable — pullPolicy MUST stay Always (IfNotPresent
  # silently serves a cached old digest); cut releases with immutable tags.
  tag: v0.7.0
  pullPolicy: Always

imagePullSecrets: []   # only needed if the GHCR package stays PRIVATE

# ============================================================================
# Prometheus Target
# ============================================================================

# The kube-prometheus-stack service (verified on G2); PROM_URL renders from
# this key.
prometheusUrl: http://kubeprom-prometheus.prometheus.svc.cluster.local:9090

# ============================================================================
# GPU Tab
# ============================================================================

# NVLink domain grouping: precedence override > auto-detection > built-in
# default; accepts a JSON string or YAML list; invalid values fall back.
gpuNvlinkDomains: ""

# NVLink topology auto-detection: DaemonSet on GPU nodes — init runs the
# HOST-INSTALLED driver's nvidia-smi topo -m; sidecar pushes the metric.
nvlinkAutodetect:
  enabled: true
  image: python:3.12-slim
  privileged: true
  driverInstallDir: /run/nvidia/driver
  pushInterval: 20
  pushgatewayUrl: http://pushgateway-prometheus-pushgateway.prometheus.svc.cluster.local:9091
  nodeSelector:
    nvidia.com/gpu.present: "true"   # {} runs everywhere (script exits 0 without NVIDIA)

# ============================================================================
# Nodes Tab
# ============================================================================

# Default selection: precedence browser ?filter= > this regex (PROM_UI_NODE_FILTER)
# > built-in default (GPU nodes); "all" shows every node.
nodeFilter: ""

# ============================================================================
# API Keys
# ============================================================================

# /mcp requires a key ONLY when existingSecret is set; everything else stays
# key-free. Comma-separated keys = zero-downtime rotation; never inline a key.
apiKey:
  existingSecret: ""
  existingSecretKey: api-keys

extraAllowedHosts: []   # EXTRA Host headers for in-cluster svc-DNS callers (`host:*` form)

# ============================================================================
# Metrics
# ============================================================================

# The server's OWN self-metrics (tool/outcome only — no PromQL text or error
# strings); false renders nothing, true serves /metrics key-free.
metrics:
  enabled: false
  serviceMonitor: true
  interval: 30s

# ============================================================================
# Resources
# ============================================================================

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

# ============================================================================
# Networking
# ============================================================================

service:
  type: ClusterIP
  port: 9095
  targetPort: 9095

# MCP network zone — ADDITIVE, DEFAULT OFF. Ingress default-deny admitting
# ONLY the listed sources (an unlisted scrape ns dies SILENTLY).
networkPolicy:
  enabled: false
  sameNamespace: true
  # In-cluster caller namespaces; the LLM gateway's relay namespace goes first.
  authorizedClients:
    namespaces: []
  allowEzafGatewayIngress: true   # browser path stays on the SSO-gated edge gateway
  ingressGatewayNamespace: istio-system
  # Edge pods carry app=istio-ingressgateway; `ezaf-gateway` is the Gateway CR NAME.
  ingressGatewayLabels:
    app: istio-ingressgateway
  # Node-originated kubelet probes; NEVER 0.0.0.0/0 with an empty probeExceptCidrs.
  probeCidrs: []
  probeExceptCidrs: []
  egress:
    enabled: false   # admin MCPs reach the k8s API / Prometheus / internet legitimately
    extraEgress: []

# ============================================================================
# Saved-Query Persistence
# ============================================================================

# ADDITIVE, DEFAULT OFF: durable JSON store at PROMETHEUS_SAVED_QUERIES_PATH —
# UNSET = in-memory, forgotten on reschedule (RWO + replicas > 1 strands Pending).
persistence:
  enabled: false
  mountPath: /data
  size: 1Gi
  storageClass: ""   # "" = cluster default StorageClass
  accessModes:
    - ReadWriteOnce
  savedQueriesFile: saved-queries.json   # pinned INSIDE the mount
  # shared: true declares the store genuinely shared (single replica or RWX);
  # a declaration, NOT concurrency control — fragmented stores should stay loud.
  shared: false

# ============================================================================
# PCAI Networking
# ============================================================================

# Deploys the Istio VirtualService through the ezaf-gateway; the long MCP
# timeout is deliberate (wide range queries run for minutes).
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    enabled: true   # false unrenders the VS while ezua.enabled keeps driving other gates
    endpoint: "prometheus-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  # Gateway-level auth gate (oauth2-proxy / SSO bearer). OFF by default — the
  # rotating SSO token is a known pain for machine MCP callers.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"
