# prometheus-mcp — values for a proxied corporate PCAI site
# (your-cluster.example)
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. prometheusUrl — the in-cluster Prometheus this deployment IS [no render
#      guard: the default targets the kube-prometheus-stack service, verified on
#      G2 — set it to your cluster's Prometheus deliberately]
#   2. ezua.virtualService.endpoint — required whenever ezua.enabled (chart
#      default true); templates call `required` on it — the render aborts without it

# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer, don't improvise)
#   GPU/NVLink tab: gpuNvlinkDomains, nvlinkAutodetect.* — documentation/DEPLOYMENT.md "Optional values" | values-examples/values.g2.yaml
#   Gateway auth (oauth2-proxy/SSO): ezua.authorizationPolicy.* — documentation/DEPLOYMENT.md "Gateway exposure"
#   Saved-query persistence: persistence.* — documentation/DEPLOYMENT.md | values-examples/values.hosted-trial.yaml
#   Network zone (ingress allowlist): networkPolicy.* — values-examples/values-hardened-g2.yaml (OVERLAY)
#   Self-metrics + ServiceMonitor: metrics.* — documentation/DEPLOYMENT.md
#   API-key gate on /mcp: apiKey.existingSecret — README "API-key auth"
#   Nodes-tab default filter: nodeFilter — documentation/DEPLOYMENT.md "Optional values"

# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document. Adjust the fill-in lines, then apply; the
# deep WHY for each key lives in helm/values.yaml. Sanitized: no credentials
# (real site values live in helm/local/).

# ============================================================================
# Deployment / Image
# ============================================================================

deployment:
  name: prometheus-mcp
  appName: prometheus-mcp
  replicaCount: 1

# pullPolicy stays Always on purpose (mutable-tag history — see helm/values.yaml).
image:
  repository: ghcr.io/ai-solution-eng/prometheus-mcp
  tag: v0.7.0
  pullPolicy: Always

imagePullSecrets: []   # only needed if the GHCR package stays PRIVATE

# ============================================================================
# Prometheus Target
# ============================================================================

# The one value that defines what this deployment IS (the in-cluster
# kube-prometheus-stack service).
prometheusUrl: http://kubeprom-prometheus.prometheus.svc.cluster.local:9090

# ============================================================================
# GPU Tab
# ============================================================================

# NVLink domain grouping: pinned to operator-confirmed hardware truth (two
# 4-GPU islands per node) while the detector's contrary reading is investigated.
gpuNvlinkDomains: "[[0,1,2,3],[4,5,6,7]]"

# Two-container DaemonSet on GPU nodes; one ~0-CPU Running pod per GPU node
# is the expected steady state — the UI keeps working with the pin regardless.
nvlinkAutodetect:
  enabled: false   # disabled on this cluster (pin above is authoritative); chart default true
  image: python:3.12-slim
  privileged: true
  driverInstallDir: /run/nvidia/driver
  # Must stay well under the pushgateway's --metric.timetolive=30s.
  pushInterval: 20
  pushgatewayUrl: http://pushgateway-prometheus-pushgateway.prometheus.svc.cluster.local:9091
  nodeSelector:
    nvidia.com/gpu.present: "true"

# ============================================================================
# Metrics
# ============================================================================

metrics:
  enabled: true             # per-tool counters + ServiceMonitor
  serviceMonitor: true      # render the monitoring.coreos.com/v1 ServiceMonitor (requires enabled)
  interval: 30s             # ServiceMonitor scrape interval

# ============================================================================
# Resources
# ============================================================================

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

# ============================================================================
# Networking
# ============================================================================

service:
  type: ClusterIP
  port: 9095
  targetPort: 9095

# ============================================================================
# Saved-Query Persistence
# ============================================================================

# Enabled — user-defined queries must survive pod updates (chart default OFF);
# shared: true silences the per-replica warning (single replica, RWX class).
persistence:
  enabled: true
  mountPath: /data
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteMany   # gl4f-filesystem (cluster default) is RWX
  savedQueriesFile: saved-queries.json
  shared: true

# ============================================================================
# PCAI Networking
# ============================================================================

# Literal cluster domain (paste-ready); the long MCP timeout is deliberate
# (wide range queries can run for minutes).
ezua:
  enabled: true
  domainName: your-cluster.example   # informational only — no template reads it
  virtualService:
    endpoint: prometheus-mcp.your-cluster.example   # /mcp -> MCP server (9095); / -> web console
    istioGateway: istio-system/ezaf-gateway
    timeout: 660s
  # Gateway-level auth gate. OFF by default — the rotating-token pain for
  # machine MCP callers is an accepted lab trade.
  authorizationPolicy:
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy
