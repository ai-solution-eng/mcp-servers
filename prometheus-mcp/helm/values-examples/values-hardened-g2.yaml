# prometheus-mcp — HARDENED-G2 example: the MCP network zone ON, browser
# console KEPT.
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com

# OVERLAY: merge onto the base/g2 values document — nothing here is standalone.
# Zone list (G2 live facts): the namespaces the LIVE gateway netpol names as
# authorized MCP callers, plus monitoring for the ServiceMonitor scrape.
# ⚠️ Enable AFTER confirming the LLM gateway's relay namespace is listed —
# with the zone on, every unlisted caller times out (deny by absence).

networkPolicy:
  enabled: true
  sameNamespace: true
  authorizedClients:
    namespaces:
      - pcai-llm            # LLM Gateway relay (in-cluster MCP relay)
      - dsh-web-helm        # DSH web (live gateway allowlist)
      - owebui0-11-0        # OWUI instance on the live gateway allowlist
      - opencode-web-helm   # OpenCode web
      - prometheus          # the ACTUAL Prometheus scraper (kubeprom stack, ns `prometheus`)
      - monitoring          # ServiceMonitor scrape ns; omit and scraping dies SILENTLY
  allowEzafGatewayIngress: true   # browser path ON for this chart (per-chart choice)
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)
  # Per-node /32 kubelet-probe allows (masters .61-.63, workers .161-.162).
  probeCidrs:
    - 172.28.1.61/32
    - 172.28.1.62/32
    - 172.28.1.63/32
    - 172.28.1.161/32
    - 172.28.1.162/32
  # Stays EMPTY: ipBlock.except must be a STRICT SUBSET of the cidr — pod IPs
  # are not inside a node /32, nothing to carve out.
  probeExceptCidrs: []
  egress:
    enabled: false          # admin MCP egress intentionally unrestricted
    extraEgress: []

# The VirtualService STAYS rendered: external/browser traffic keeps flowing
# through the SSO-gated edge gateway exactly as pre-zone.
