{{- if and .Values.ezua.enabled .Values.ezua.virtualService.enabled }}
{{- /* PCAI envsubst-ed ${DOMAIN_NAME} in the submitted values before helm
     runs, so the endpoint arrives fully resolved. The gateway host is built
     ONLY from ezua.virtualService.endpoint — ezua.domainName is informational
     and no template reads it. virtualService.enabled (default true) is the
     HARDENED-ADMIN knob: false unrenders the VS (no browser path) while
     ezua.enabled keeps driving every other gate (kyverno, deployment) —
     the fleet MCP network zone's break-glass complement. */ -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.deployment.name }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/app: {{ .Values.deployment.appName }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    # MCP clients (DSH runs OUTSIDE the cluster): streamable-http at /mcp.
    # Long timeout: range queries over wide windows can run for minutes.
    - match:
        - uri:
            prefix: /mcp
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
    # Everything else (e.g. /health for smoke tests) -> same service.
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
