{{- if .Values.ezua.enabled }}
{{- /* PCAI does NOT envsubst values files: a domainName/endpoint left with
     the literal ${DOMAIN_NAME} placeholder would register a gateway host
     that matches nothing — the UI and MCP endpoint silently vanish from
     the gateway. Fail the deploy loudly instead (the searxng-mcp lesson;
     copy-paste deployments from the base values.yaml are exactly how this
     happens). */ -}}
{{- if contains "${" (.Values.ezua.domainName | toString) -}}
{{- fail (printf "\nezua.domainName still contains the literal placeholder %q — PCAI does not envsubst values files. Set the real cluster domain (see helm/local/values.se-g2.yaml for the working example)." .Values.ezua.domainName) -}}
{{- end -}}
{{- if contains "${" (.Values.ezua.virtualService.endpoint | toString) -}}
{{- fail (printf "\nezua.virtualService.endpoint still contains the literal placeholder %q — set the real endpoint host (see helm/local/values.se-g2.yaml)." .Values.ezua.virtualService.endpoint) -}}
{{- end -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.deployment.name }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/app: {{ .Values.deployment.appName }}
    hpe-ezua/type: vendor-service
spec:
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | required "\nValid .Values.ezua.virtualService.endpoint is required !" }}
  http:
    # MCP clients (DSH runs OUTSIDE the cluster): streamable-http at /mcp.
    # Long timeout: range queries over wide windows can run for minutes.
    - match:
        - uri:
            prefix: /mcp
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
    # Everything else (e.g. /health for smoke tests) -> same service.
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Values.deployment.name }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.ezua.virtualService.timeout }}
{{- end }}
