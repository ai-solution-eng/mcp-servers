apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            # Rendered in the TEMPLATE from the prometheusUrl knob — Helm does
            # not template inside values.yaml, so a values-file
            # 'value: "{{ .Values.prometheusUrl }}"' ships as a LITERAL string
            # (the v0.1.0 release queried a hostname that was literally that).
            - name: PROM_URL
              value: {{ .Values.prometheusUrl | quote }}
            {{- with .Values.gpuNvlinkDomains }}
            # GPU-tab NVLink island grouping (see values.yaml). Accepts the
            # JSON string the server parses or a native YAML list — both
            # render to the same env value. Omitted when empty so the
            # server default applies.
            - name: PROM_UI_GPU_NVLINK_DOMAINS
              {{- if kindIs "string" . }}
              value: {{ . | quote }}
              {{- else }}
              value: {{ . | toJson | quote }}
              {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
