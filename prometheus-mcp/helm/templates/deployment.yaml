apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            # Rendered in the TEMPLATE from the prometheusUrl knob — Helm does
            # not template inside values.yaml, so a values-file
            # 'value: "{{ .Values.prometheusUrl }}"' ships as a LITERAL string
            # (the v0.1.0 release queried a hostname that was literally that).
            - name: PROM_URL
              value: {{ .Values.prometheusUrl | quote }}
            {{- if .Values.apiKey.existingSecret }}
            # OPTIONAL MCP API-key auth (fleet decision 2026-09, searxng
            # pattern): wired ONLY when the values point at a pre-deployed
            # Secret; unset → /mcp runs open with a loud startup warning
            # (gateway-fronted deployments). The server scopes the gate to
            # /mcp only — /health, /healthz, the console and /api/* stay
            # key-free, so probes and the ServiceMonitor scrape are
            # unaffected. The key is ALWAYS out-of-band (the chart never
            # creates the Secret and never inlines a key).
            - name: PROMETHEUS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- end }}
            {{- $svcHost := printf "%s-service.%s.svc.cluster.local:*" .Values.deployment.name .Release.Namespace }}
            {{- $transportActive := and .Values.ezua.enabled .Values.ezua.virtualService.endpoint }}
            {{- if $transportActive }}
            # Public FQDN — pins the Host header (DNS-rebinding protection;
            # K8S-MCP fleet pattern). With neither this AND
            # extraAllowedHosts set, the server leaves the SDK's implicit
            # loopback-only protection untouched (local-dev behavior).
            - name: MCP_HOSTNAME
              value: {{ .Values.ezua.virtualService.endpoint | quote }}
            {{- end }}
            {{- if or $transportActive .Values.extraAllowedHosts }}
            # In-cluster callers (svc DNS) — DNS-rebinding allowlist. When
            # transport security is active (ezua endpoint pinned or any
            # extraAllowedHosts), the chart ALWAYS includes this release's
            # own service DNS FIRST — the same name the Service resource
            # renders — because the LLM-gateway relay hop arrives with
            # Host: <deployment.name>-service.<ns>.svc.cluster.local:<port>
            # (the fleet 421 Misdirected Request class). Site
            # extraAllowedHosts append after it; entries are matched
            # verbatim or as `host:*` by the SDK's transport security.
            - name: MCP_EXTRA_ALLOWED_HOSTS
              {{- if .Values.extraAllowedHosts }}
              value: {{ printf "%s,%s" $svcHost (join "," .Values.extraAllowedHosts) | quote }}
              {{- else }}
              value: {{ $svcHost | quote }}
              {{- end }}
            {{- end }}
            {{- with .Values.gpuNvlinkDomains }}
            # GPU-tab NVLink island grouping (see values.yaml). Accepts the
            # JSON string the server parses or a native YAML list — both
            # render to the same env value. Omitted when empty so the
            # server default applies.
            - name: PROM_UI_GPU_NVLINK_DOMAINS
              {{- if kindIs "string" . }}
              value: {{ . | quote }}
              {{- else }}
              value: {{ . | toJson | quote }}
              {{- end }}
            {{- end }}
            {{- with .Values.nodeFilter }}
            # Nodes-tab default selection (see values.yaml): a node-name
            # regex; "all" shows every node. Omitted when empty so the
            # server default (auto-detected GPU nodes) applies.
            - name: PROM_UI_NODE_FILTER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # /metrics self-metrics (Wave-3 C3, ADDITIVE, DEFAULT OFF): the
            # server serves ITS OWN per-tool request counters at /metrics only
            # when this env is set — nothing here renders when metrics.enabled
            # is false (the default), so the default pod is unchanged. Pairs
            # with templates/servicemonitor.yaml.
            - name: PROMETHEUS_METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.persistence.enabled }}
            # Saved-query store (Wave-5 F4, ADDITIVE, DEFAULT OFF): rendered
            # ONLY when persistence.enabled — the default render has no
            # PROMETHEUS_SAVED_QUERIES_PATH env and the server keeps its
            # documented in-memory default (byte-identical pod). Set → the
            # store is a JSON file on the PVC, so user-saved queries survive
            # pod updates (the atomic temp+rename write makes the file
            # crash-safe; nothing else in this server writes to the volume).
            - name: PROMETHEUS_SAVED_QUERIES_PATH
              value: {{ printf "%s/%s" .Values.persistence.mountPath .Values.persistence.savedQueriesFile | quote }}
            {{- if .Values.persistence.shared }}
            # Per-replica honesty: the operator declared the store genuinely
            # shared across replicas (single replica, or RWX volume mounted
            # by every replica) — silences the per-replica warning that
            # query_save otherwise attaches. It is a declaration, NOT
            # concurrency control (no cross-process locking exists).
            - name: PROMETHEUS_SAVED_QUERIES_SHARED
              value: "1"
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        # PVC-backed: user-saved queries survive pod updates and reschedules.
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.name }}-data
      {{- end }}

