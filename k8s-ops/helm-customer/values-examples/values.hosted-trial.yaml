# k8s-mcp-customer — PCAI hosted-trial values (values-examples, secret-free).
# Target: an HPE-hosted PCAI trial cluster where ${DOMAIN_NAME} is resolved
# by PCAI before rendering — keep the placeholders verbatim.
# FULL VALUES — complete copy of helm-customer/values.yaml with site edits
# marked '# SITE:'. Paste-ready: this file alone is the full values document
# (helm deep-merges it over identical chart defaults; PCAI's values editor
# replaces the chart's bundled values.yaml entirely, so every key must be
# present here).

# k8s-mcp-customer — customer distribution of the Kubernetes ops MCP
# server, for PCAI (HPE Ezmeral Unified Analytics).
#
# CUSTOMER DISTRIBUTION — STRUCTURALLY LOCKED. This chart is the locked
# twin of helm/ (the trusted-operator chart). The security knobs — exec,
# namespace policy, per-user keys, RBAC scope and extra groups — DO NOT
# EXIST in these values, and the templates never read them. Pasting
# `exec: {enabled: true}` into the PCAI frontend is inert: nothing in this
# chart consumes that key. Day-2 security changes are a platform action,
# from the kube command line (NOTES.txt prints the exact commands); the
# exec Role is NOT minted by this chart, so exec stays impossible until
# the operator creates it deliberately.
#
# What the frontend CAN configure below is deliberately limited to benign
# wiring: image, naming, service, exposure endpoint, API-key Secret
# reference, console toggle.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: k8s-mcp-customer
  appName: k8s-mcp-customer
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  # SITE: keep in lockstep with Chart.yaml appVersion (same image as the
  # internal chart — the locking lives in this chart, not the binary).
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  tag: v0.3.1
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously). Per-namespace secret:
#   kubectl create secret docker-registry ghcr-pull -n <ns> \
#     --docker-server=ghcr.io --docker-username=<gh-user> \
#     --docker-password=<gh-PAT-with-read:packages>
imagePullSecrets: []

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

# -- Resources -------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Service account ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# -- MCP server app config (benign keys only) --------------------------------------------------------
# SECURITY INVARIANTS (do not weaken):
#  * The API key is NEVER created by this chart and NEVER inlined in values —
#    reference an out-of-band Secret (create it before applying; the Deployment
#    fails loud until it exists). This example carries only the SECRET NAME.
apiKey:
  # SITE: name of the pre-created API-key Secret (kubectl create secret generic …).
  existingSecret: ""
  existingSecretKey: api-key

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# -- RBAC: BAKED, NOT VALUES-DRIVEN ---------------------------------------------------------------------
# templates/rbac-readonly.yaml carries a $scope chart constant ("cluster") —
# read-only, cluster-wide, the same posture validated on the internal cluster.
# To clamp a tenant to its own namespace, switch that constant to "namespace"
# and repackage: a deliberate platform action, deliberately NOT a frontend
# edit. This chart never mints exec RBAC.

# -- Pod annotations / node placement ------------------------------------------------------------------------
# Container hardening (non-root 10001, read-only rootfs, dropped capabilities,
# RuntimeDefault seccomp, /tmp emptyDir) is deliberately NOT values-overridable
# — it is the audited baseline.
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration -------------------------------------------------------------
# SITE: ${DOMAIN_NAME} is resolved by PCAI before rendering — keep the
# placeholders verbatim on a hosted trial.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"   # informational only — no template reads it
  virtualService:
    # SITE: unique per release on the shared gateway; doubles as MCP_HOSTNAME
    # (DNS-rebinding pin).
    endpoint: "k8s-mcp-customer.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  # SITE: gateway oauth2 gate OFF by default (the built-in API key is the
  # gate); flipping it on enforces PCAI tokens for this host, ON TOP of the
  # API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# Observability (Wave-3+): per-tool counters + ServiceMonitor.
metrics:
  enabled: true
