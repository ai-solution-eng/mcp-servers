# k8s-mcp-customer — PCAI hosted-trial values (values-examples, secret-free).
# Target: an HPE-hosted PCAI trial cluster — ${DOMAIN_NAME} is resolved by PCAI
# before rendering; keep the placeholders verbatim.
# FULL VALUES — complete copy of helm-customer/values.yaml with the site
# edits inline. Paste-ready: this file alone is the full values document
# (PCAI's values editor replaces the chart's bundled values.yaml entirely, so
# every key must be present here).
#
# STRUCTURALLY LOCKED — the locked twin of helm/ (trusted-operator chart): the
# security knobs (exec, namespace policy, per-user keys, RBAC scope) DO NOT
# EXIST in these values and templates never read them. The frontend configures
# only benign wiring: image, naming, service, exposure endpoint, API-key
# Secret reference, console toggle. Day-2 security changes are a platform
# action (NOTES.txt prints the exact commands).
#
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# Owner: Francesco Caliva
# Email: francesco.caliva@hpe.com
#
# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. API-key Secret, out of band — never created/inlined by the chart;
#      CreateContainerConfigError until it exists (ref: <name>-apikey / api-key).
#   2. ezua.virtualService.endpoint WHEN ezua.enabled — `helm required` in the
#      VirtualService + AuthorizationPolicy templates; doubles as MCP_HOSTNAME.
# ### OPTIONAL ### — the LOCKED chart tunes only benign wiring; security changes are a
#   platform action (the chart's NOTES.txt prints every command):
#   Exposure endpoint: ezua.virtualService.endpoint — documentation/DEPLOYMENT.md Deployment profiles
#   Console shell: console.enabled — documentation/DEPLOYMENT.md
#   In-cluster callers: extraAllowedHosts (svc-DNS; never bypasses the key gate) — documentation/DEPLOYMENT.md
#   Listing caps / metrics: listing.* / metrics.enabled — documentation/DEPLOYMENT.md
#   Gateway SSO gate: ezua.authorizationPolicy.enabled (tokens ON TOP of the key) — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment / Image / Service / Resources
# ============================================================================

deployment:
  name: k8s-mcp-customer
  appName: k8s-mcp-customer
  replicaCount: 1

image:
  # Keep in lockstep with Chart.yaml appVersion (same image as the internal
  # chart — the locking lives in this chart, not the binary).
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  tag: v1.2.0
  pullPolicy: IfNotPresent

# Only for a PRIVATE GHCR package (public pulls are anonymous):
#   kubectl create secret docker-registry ghcr-pull -n <ns> --docker-server=ghcr.io ...
imagePullSecrets: []

service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    # 512Mi OOMKilled ×4 in heavy get_resource listing bursts (steady-state
    # ~136Mi — the burst is what counts); chart default 2Gi.
    memory: 2Gi

serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# ============================================================================
# MCP Server App Config (benign keys only)
# ============================================================================
# (the API key is NEVER created or inlined by the chart — out-of-band Secret
# only; this example carries just the SECRET NAME)

apiKey:
  # The pre-created API-key Secret (kubectl create secret generic …).
  existingSecret: ""
  existingSecretKey: api-key

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# Extra Host headers for in-cluster svc-DNS callers (never bypasses the
# API-key gate). Kept at the chart default.
extraAllowedHosts: []

# Cluster-wide listing guardrails: performance guardrails only — NOT security
# knobs. "" = the server's own default; kept at the chart default.
listing:
  maxItems: ""
  concurrency: ""
  maxEvents: ""              # K8S_MCP_MAX_EVENTS (server default 100): cap on get_events / triage Warning-event items
  maxNsRewrite: ""           # K8S_MCP_MAX_NS_REWRITE (server default 20): per-namespace rewrite limit for whitelisted -A queries

# RBAC is BAKED, NOT VALUES-DRIVEN: templates/rbac-readonly.yaml carries a
# $scope chart constant; clamping a tenant = switch it + repackage (platform action).

# ============================================================================
# Pod Annotations / Node Placement
# ============================================================================
# (container hardening — non-root, read-only rootfs, dropped caps, seccomp —
# is NOT values-overridable: the audited baseline)
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# PCAI Networking
# ============================================================================
# ${DOMAIN_NAME} is resolved by PCAI before rendering — keep the
# placeholders verbatim on a hosted trial.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"   # informational only — no template reads it
  virtualService:
    # Unique per release on the shared gateway; doubles as MCP_HOSTNAME
    # (DNS-rebinding pin).
    endpoint: "k8s-mcp-customer.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  # Gateway oauth2 gate OFF by default (the built-in API key is the gate);
  # flipping it on enforces PCAI tokens for this host, ON TOP of the API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# Observability: per-tool counters + ServiceMonitor.
metrics:
  enabled: true
  interval: 30s
