# k8s-mcp-customer — customer distribution of the Kubernetes ops MCP
# server, for PCAI (HPE Ezmeral Unified Analytics).
#
# CUSTOMER DISTRIBUTION — STRUCTURALLY LOCKED. This chart is the locked
# twin of helm/ (the trusted-operator chart). The security knobs — exec,
# namespace policy, per-user keys, RBAC scope and extra groups — DO NOT
# EXIST in these values, and the templates never read them. Pasting
# `exec: {enabled: true}` into the PCAI frontend is inert: nothing in this
# chart consumes that key. Day-2 security changes are a platform action,
# from the kube command line (NOTES.txt prints the exact commands); the
# exec Role is NOT minted by this chart, so exec stays impossible until
# the operator creates it deliberately.
#
# What the frontend CAN configure below is deliberately limited to benign
# wiring: image, naming, service, exposure endpoint, API-key Secret
# reference, console toggle.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: k8s-mcp-customer
  appName: k8s-mcp-customer
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  # Keep in lockstep with Chart.yaml appVersion (same image as the internal
  # chart — the locking lives in this chart, not the binary).
  tag: v1.1.0
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously). Per-namespace secret:
#   kubectl create secret docker-registry ghcr-pull -n <ns> \
#     --docker-server=ghcr.io --docker-username=<gh-user> \
#     --docker-password=<gh-PAT-with-read:packages>
imagePullSecrets: []

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

# -- Resources -------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Service account ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# -- MCP server app config (benign keys only) --------------------------------------------------------
# The API key is NEVER created by this chart and NEVER inlined in values —
# reference an out-of-band Secret; the Deployment fails loud until it exists.
apiKey:
  existingSecret: ""         # empty = "<deployment.name>-apikey"
  existingSecretKey: api-key

# -- In-cluster host allowlist (benign connectivity wiring) ---------------------------------
# Extra Host header values the MCP SDK's DNS-rebinding protection accepts, for
# in-cluster callers that address the server by its service DNS name instead of
# the public FQDN (e.g. Open WebUI →
# http://<name>-service.<ns>.svc.cluster.local:9090/mcp). Joined into
# MCP_EXTRA_ALLOWED_HOSTS; entries match verbatim or as `host:*` for any port.
# This never bypasses the API-key gate — it only decides which Host headers the
# rebinding protection accepts. Empty = behaviour unchanged.
extraAllowedHosts: []

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# -- Cluster-wide listing guardrails (benign wiring) ------------------------------------------------------------
# Performance guardrails only — NOT security knobs. "" = the server's own
# default (an unset key renders NO env var; the default render is unchanged).
listing:
  maxItems: ""               # K8S_MCP_MAX_LIST_ITEMS (server default 500): cap on -A/cluster-wide list results, with a truncation marker naming the env
  concurrency: ""            # K8S_MCP_LIST_CONCURRENCY (server default 8): bounded-semaphore width for the per-namespace -A fan-out

# -- Observability (opt-in; default off = byte-identical render) --------------------------------------------
metrics:
  enabled: false             # K8S_MCP_METRICS_ENABLED=true: serve GET /metrics (counters only, no key) + the ServiceMonitor below
  interval: 30s              # ServiceMonitor scrape interval

# -- RBAC: BAKED, NOT VALUES-DRIVEN ---------------------------------------------------------------------
# templates/rbac-readonly.yaml carries a $scope chart constant ("cluster") —
# read-only, cluster-wide, the same posture validated on the internal
# cluster. To clamp a tenant to its own namespace, switch that constant to
# "namespace" and repackage: a deliberate platform action, deliberately NOT
# a frontend edit. This chart never mints exec RBAC.

# -- Pod annotations / node placement ------------------------------------------------------------------------
# Container hardening (non-root 10001, read-only rootfs, dropped capabilities,
# RuntimeDefault seccomp, /tmp emptyDir) is deliberately NOT values-overridable
# — it is the audited baseline.
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration -------------------------------------------------------------
# Deploys the Istio VirtualService so MCP clients reach the server through
# the ezaf-gateway. The endpoint doubles as MCP_HOSTNAME (DNS-rebinding
# pin) — MUST be unique per release on the shared gateway.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "k8s-mcp-customer.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  # Gateway-level auth gate (oauth2-proxy / SSO bearer). OFF by default —
  # flipping it on enforces PCAI tokens for this host, on TOP of the API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"
