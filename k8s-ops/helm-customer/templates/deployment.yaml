{{- /* STRUCTURALLY LOCKED deployment: the env list below is FIXED. There is
      deliberately no conditional rendering of exec, namespace-policy or
      per-user-key values — keys a customer pastes into the frontend (e.g.
      `exec: {enabled: true}`) are simply never read by this chart. Day-2
      security changes happen with `kubectl set env` (NOTES.txt runbook),
      and exec stays impossible until the operator creates the Role. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Values.deployment.name }}
      automountServiceAccountToken: true
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            # API key: ALWAYS out-of-band (the chart never creates it; the
            # Deployment fails loud with CreateContainerConfigError until
            # the Secret exists).
            - name: K8S_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret | default (printf "%s-apikey" .Values.deployment.name) }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- if and .Values.ezua.enabled .Values.ezua.virtualService.endpoint }}
            # Public FQDN — pins the Host header (DNS-rebinding protection).
            - name: MCP_HOSTNAME
              value: {{ .Values.ezua.virtualService.endpoint | quote }}
            {{- end }}
            {{- if not .Values.console.enabled }}
            - name: K8S_MCP_CONSOLE_ENABLED
              value: "false"
            {{- end }}
            # NOTE: intentionally NO K8S_MCP_EXEC_*, K8S_MCP_CLIENTS or
            # namespace-policy env here — the customer chart cannot express
            # them. Enable exec only via the NOTES.txt runbook (set env +
            # manual Role/RoleBinding creation), which is a platform action.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
