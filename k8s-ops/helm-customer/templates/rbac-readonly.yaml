{{- /* RBAC is BAKED, not values-driven. $scope is a chart constant: to
      clamp a tenant to its own namespace, switch it to "namespace" and
      repackage — a deliberate platform action, deliberately NOT a
      frontend-editable value. This chart never mints exec RBAC; the
      read-only rules are fixed (no extraResourceGroups surface). */ -}}
{{- $scope := "cluster" }}
{{- $sa := .Values.serviceAccount.name | default .Values.deployment.name -}}
{{- if eq $scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.deployment.name }}-readonly
  labels:
    app: {{ .Values.deployment.appName }}
rules:
- apiGroups: [""]
  resources:
    - pods
    - pods/log
    - pods/status
    - services
    - endpoints
    - configmaps
    - events
    - namespaces
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - replicationcontrollers
    - serviceaccounts
    - limitranges
    - resourcequotas
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets, daemonsets, replicasets, controllerrevisions]
  verbs: [get, list, watch]
- apiGroups: ["batch"]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
- apiGroups: ["networking.k8s.io"]
  resources: [ingresses, networkpolicies, ingressclasses]
  verbs: [get, list, watch]
- apiGroups: ["apiextensions.k8s.io"]
  resources: [customresourcedefinitions]
  verbs: [get, list, watch]
- apiGroups: ["metrics.k8s.io"]
  resources: [nodes, pods]
  verbs: [get, list]
- apiGroups: ["networking.istio.io"]
  resources: [virtualservices]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.deployment.name }}-readonly
  labels:
    app: {{ .Values.deployment.appName }}
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.deployment.name }}-readonly
  apiGroup: rbac.authorization.k8s.io
{{- else }}
# $scope: "namespace" — the API server confines every read to THIS namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.deployment.name }}-readonly
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
rules:
- apiGroups: [""]
  resources: [pods, pods/log, pods/status, services, endpoints, configmaps, events, persistentvolumeclaims, serviceaccounts, limitranges, resourcequotas]
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets, daemonsets, replicasets]
  verbs: [get, list, watch]
- apiGroups: ["batch"]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.deployment.name }}-readonly
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
subjects:
- kind: ServiceAccount
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.deployment.name }}-readonly
  apiGroup: rbac.authorization.k8s.io
{{- end }}
