# ============================================================================
# k8s-mcp (trusted-operator chart) — proxied corporate PCAI site values
# (values-examples, secret-free); cluster domain your-cluster.example.
# Full guide: documentation/DEPLOYMENT.md
# Owners: Andrew Bydlon <andrew.bydlon@hpe.com>, Francesco Caliva <francesco.caliva@hpe.com>
# ============================================================================

# FULL VALUES — complete copy of helm/values.yaml with the site edits inline.
# PCAI's values editor replaces the chart's bundled values.yaml entirely, so every key must be here.

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
#   1. apiKey.existingSecret — the API-key Secret, created OUT OF BAND (this chart
#      never creates or inlines it); CreateContainerConfigError until it exists.
#   2. ezua.virtualService.endpoint WHEN ezua.enabled — render FAILS without it;
#      doubles as MCP_HOSTNAME and must be unique per release.

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Namespace governance: namespaces.allowed/blocked — documentation/DEPLOYMENT.md
#   Hardened exec: exec.* (allowlist, requireLabel, autoRbac) — documentation/DEPLOYMENT.md
#   Per-user keys + exec assignments: clients.existingSecret — documentation/DEPLOYMENT.md
#   RBAC scope + CRD reads (never ['*']): rbac.scope/extraResourceGroups — documentation/DEPLOYMENT.md
#   Network zone (default off): values-examples/values-hardened-g2.yaml (overlay)
#   Metrics + ServiceMonitor: metrics.enabled — documentation/DEPLOYMENT.md
#   In-cluster callers: extraAllowedHosts (svc-DNS; 421s otherwise) — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment / Image / Service / Resources
# ============================================================================

deployment:
  name: k8s-mcp
  appName: k8s-mcp
  replicaCount: 1

image:
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  tag: v1.2.0   # keep in lockstep with Chart.yaml appVersion
  pullPolicy: IfNotPresent

# Private-GHCR pull secret: omit ([]) when the package is public.
imagePullSecrets:
  - name: ghcr-pull

service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 2Gi}

serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# ============================================================================
# MCP Server App Config
# ============================================================================

apiKey:
  # The pre-created API-key Secret (kubectl create secret generic …) — the chart never creates it.
  existingSecret: "k8s-mcp-2-0-apikey"
  existingSecretKey: api-key

# In-cluster svc-DNS callers (e.g. Open WebUI) get 421 without an entry here;
# `host:*` = any port, e.g. k8s-mcp-service.<namespace>.svc.cluster.local:*
extraAllowedHosts: []

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# ============================================================================
# Cluster Access / Read-Only RBAC
# ============================================================================

rbac:
  create: true
  scope: cluster              # "namespace" clamps every read to the release namespace
  # One entry per installed operator. NEVER ["*"] — refused at render.
  extraResourceGroups:
    - serving.kserve.io
    - genai.hpe.com

# ============================================================================
# Namespace Governance
# ============================================================================

# App layer; RBAC remains the true boundary. Lab posture — everything readable except the system namespaces.
namespaces:
  allowed: ""
  blocked: "kube-system,kube-public,k8s-mcp-ops"

# ============================================================================
# Hardened Exec
# ============================================================================

# Lab posture — exec ON cluster-wide with the per-pod label gate OFF.
# Tighter for shared clusters: enabled: false, or namespaces: "debug-*,team-a" with requireLabel: true.
exec:
  enabled: true
  namespaces: "*"
  requireLabel: false
  allowedCommands: ""
  autoRbac: true

# ============================================================================
# Per-user Keys
# ============================================================================

# "name:key[:ns-patterns];…" is SECRET MATERIAL — prefer existingSecret (whole K8S_MCP_CLIENTS string).
clients:
  value: ""
  existingSecret: ""
  existingSecretKey: clients

# ============================================================================
# Pod Annotations / Node Placement
# ============================================================================

# Container hardening (non-root, read-only rootfs, dropped caps, seccomp) is NOT values-overridable.
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# PCAI Networking
# ============================================================================

# Literal cluster domain on the lab site (chart default: "${DOMAIN_NAME}").
ezua:
  enabled: true
  domainName: "your-cluster.example"   # informational only — no template reads it

  virtualService:
    # Literal host for SE-G2 — unique per release on the shared gateway;
    # doubles as MCP_HOSTNAME (DNS-rebinding pin).
    endpoint: "k8s-mcp-2-0-server.your-cluster.example"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s

  # Gateway oauth2 gate OFF (lab trade — the built-in API key is the gate);
  # flip enabled to true to enforce PCAI tokens on top of the API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================================
# Cluster-wide Listing Guardrails
# ============================================================================

# Performance guardrails only — "" = the server's own default (no env rendered).
listing:
  maxItems: ""               # K8S_MCP_MAX_LIST_ITEMS — cluster-wide list cap (server default 100)
  concurrency: ""            # K8S_MCP_LIST_CONCURRENCY — -A fan-out width (server default 8)
  maxEvents: ""              # K8S_MCP_MAX_EVENTS — get_events/triage items (server default 100)
  maxNsRewrite: ""           # K8S_MCP_MAX_NS_REWRITE — per-namespace rewrite limit (server default 20)

# Observability: per-tool counters + ServiceMonitor.
metrics:
  enabled: true
  interval: 30s

# ============================================================================
# MCP Network Zone
# ============================================================================

# ADDITIVE, DEFAULT OFF — once enabled, anything not matched is DENIED; egress stays unrestricted.
networkPolicy:
  enabled: false
  sameNamespace: true

  authorizedClients:
    namespaces: []

  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system

  ingressGatewayLabels:
    app: istio-ingressgateway

  probeCidrs: []
  probeExceptCidrs: []

  egress:
    enabled: false
    extraEgress: []
