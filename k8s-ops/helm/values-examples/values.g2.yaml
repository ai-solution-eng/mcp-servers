# k8s-mcp (trusted-operator chart) — SE-G2 lab cluster values
# (values-examples, secret-free). Cluster:
# pcai-se-ai-application.hst.rdlabs.hpecorp.net.
# FULL VALUES — complete copy of helm/values.yaml with site edits marked '# SITE:'.
# Paste-ready: this file alone is the full values document (helm deep-merges
# it over identical chart defaults; PCAI's values editor replaces the chart's
# bundled values.yaml entirely, so every key must be present here).

# k8s-mcp — Kubernetes ops MCP server for PCAI (HPE Ezmeral Unified
# Analytics): read-only cluster inspection, hardened exec (opt-in),
# namespace governance, and an HPE ops console, exposed at /mcp and /ui/
# through the PCAI Istio gateway.
#
# This is the TRUSTED-OPERATOR chart: every knob below is frontend- and
# values-configurable. Customer deliveries use the separate helm-customer/
# chart, where the security knobs do not exist at all.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: k8s-mcp
  appName: k8s-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  # SITE: keep in lockstep with Chart.yaml appVersion (and the pushed image tags).
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  tag: v0.3.1
  pullPolicy: IfNotPresent

# SITE: private-GHCR pull secret — omit ([]) when the package is public.
imagePullSecrets:
  - name: ghcr-pull

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

# -- Resources -------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Service account ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# -- MCP server app config ---------------------------------------------------------------------------
# SECURITY INVARIANTS (do not weaken):
#  * The API key is NEVER created by this chart and NEVER inlined in values —
#    reference an out-of-band Secret (create it before applying; the Deployment
#    fails loud until it exists). This example carries only the SECRET NAME.
apiKey:
  # SITE: name of the pre-created API-key Secret (kubectl create secret generic …).
  existingSecret: "k8s-mcp-2-0-apikey"
  existingSecretKey: api-key

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# -- Cluster access (read-only RBAC — this chart talks to the K8s API) --------------------------------------
rbac:
  create: true
  # SITE: cluster scope (read-only ClusterRole). Use "namespace" to clamp every
  # read to the release namespace via the API server.
  scope: cluster
  # SITE: CRD apiGroups the tools may read (resources: "*", verbs get/list/watch).
  # Add one entry per installed operator. NEVER ["*"] — refused at render time
  # (it would re-grant secrets read). networking.istio.io/virtualservices is
  # always granted.
  extraResourceGroups:
    - serving.kserve.io
    - genai.hpe.com

# -- Namespace governance (app layer; RBAC remains the true boundary) ------------------------------------------
# SITE: lab posture — everything readable except the system namespaces.
namespaces:
  allowed: ""
  blocked: "kube-system,kube-public,k8s-mcp-ops"

# -- Hardened exec (opt-in) --------------------------------------------------------------------------------------
# SITE: lab posture — exec ON cluster-wide with the per-pod label gate OFF.
# Tighter default for shared/customer clusters: enabled: false, or
# namespaces: "debug-*,team-a" with requireLabel: true.
exec:
  enabled: true
  namespaces: "*"
  requireLabel: false
  allowedCommands: ""
  autoRbac: true

# -- Per-user keys with per-user exec assignments --------------------------------------------------------------------
# "name:key[:ns-patterns];…" — CONTAINS SECRETS; prefer existingSecret (a Secret
# holding the whole K8S_MCP_CLIENTS string). Never put real keys in this file.
clients:
  value: ""
  existingSecret: ""
  existingSecretKey: clients

# -- Pod annotations / node placement -------------------------------------------------------------------------------------
# Container hardening (non-root 10001, read-only rootfs, dropped capabilities,
# RuntimeDefault seccomp, /tmp emptyDir) is deliberately NOT values-overridable
# — it is the audited baseline.
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration -------------------------------------------------------------------------
# SITE: literal cluster domain on the lab site (chart default: "${DOMAIN_NAME}").
ezua:
  enabled: true
  domainName: "pcai-se-ai-application.hst.rdlabs.hpecorp.net"   # informational only — no template reads it
  virtualService:
    # SITE: literal host for SE-G2 — unique per release on the shared gateway;
    # doubles as MCP_HOSTNAME (DNS-rebinding pin).
    endpoint: "k8s-mcp-2-0-server.pcai-se-ai-application.hst.rdlabs.hpecorp.net"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  # SITE: gateway oauth2 gate OFF (lab trade — the built-in API key is the gate);
  # flip enabled to true to enforce PCAI tokens on top of the API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"
