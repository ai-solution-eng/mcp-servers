# k8s-mcp — HARDENED-G2 example: the MCP network zone ON.
# OVERLAY: merge onto the base/G2 values document — nothing here is standalone.
# Owners: Andrew Bydlon <andrew.bydlon@hpe.com>, Francesco Caliva <francesco.caliva@hpe.com>

# ⚠️ Enable AFTER confirming the LLM gateway's relay namespace is listed —
# with the zone on, every unlisted caller times out (deny by absence).
networkPolicy:
  enabled: true
  sameNamespace: true
  authorizedClients:
    namespaces:
      - pcai-llm            # LLM Gateway relay (in-cluster MCP relay)
      - dsh-web-helm        # DSH web (gateway allowlist)
      - owebui0-11-0        # OWUI instance on the gateway allowlist
      - opencode-web-helm   # OpenCode web
      - prometheus          # the ACTUAL scraper ns; `monitoring` holds otel/UA
      - monitoring          # ServiceMonitor scrape ns — omit and it dies SILENTLY

  # Browser path stays OPEN — the zone restricts IN-CLUSTER callers only.
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system

  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)

  # Kubelet probes originate at the NODE — per-node /32 allows only.
  probeCidrs:
    - 172.28.1.61/32
    - 172.28.1.62/32
    - 172.28.1.63/32
    - 172.28.1.161/32
    - 172.28.1.162/32

  # Stays EMPTY with per-node /32s; only a BROAD probe allow pairs with a carve-out.
  probeExceptCidrs: []

  egress:
    enabled: false          # admin MCP egress intentionally unrestricted
    extraEgress: []

# The VirtualService stays rendered — external/browser traffic is unchanged.
