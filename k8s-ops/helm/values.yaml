# ============================================================================
# k8s-mcp — Kubernetes ops MCP server for PCAI: read-only cluster inspection,
# hardened exec (opt-in), namespace governance, ops console at /ui/.
# Full guide: documentation/DEPLOYMENT.md
# Owners: Andrew Bydlon <andrew.bydlon@hpe.com>, Francesco Caliva <francesco.caliva@hpe.com>
# ============================================================================

# ### REQUIRED ### — key material lives in Secrets you own, NOT in values
#   1. apiKey.existingSecret — the API-key Secret, created OUT OF BAND (this chart
#      never creates or inlines it); CreateContainerConfigError until it exists.
#   2. ezua.virtualService.endpoint WHEN ezua.enabled — render FAILS without it;
#      doubles as MCP_HOSTNAME and must be unique per release.

# ### OPTIONAL ###
# Major tuning setups (copy the shape from the pointer):
#   Namespace governance: namespaces.allowed/blocked — documentation/DEPLOYMENT.md
#   Hardened exec: exec.* (allowlist, requireLabel, autoRbac) — documentation/DEPLOYMENT.md
#   Per-user keys + exec assignments: clients.existingSecret — documentation/DEPLOYMENT.md
#   RBAC scope + CRD reads (never ['*']): rbac.scope/extraResourceGroups — documentation/DEPLOYMENT.md
#   Network zone (default off): values-examples/values-hardened-g2.yaml (overlay)
#   Metrics + ServiceMonitor: metrics.enabled — documentation/DEPLOYMENT.md
#   In-cluster callers: extraAllowedHosts (svc-DNS; 421s otherwise) — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment / Image / Service / Resources
# ============================================================================

deployment:
  name: k8s-mcp
  appName: k8s-mcp
  replicaCount: 1

image:
  repository: ghcr.io/ai-solution-eng/k8s-mcp
  tag: v1.3.0
  pullPolicy: IfNotPresent

# Only for a PRIVATE GHCR package (public pulls are anonymous):
#   kubectl create secret docker-registry ghcr-pull -n <ns> --docker-server=ghcr.io ...
imagePullSecrets: []

service:
  type: ClusterIP
  port: 9090        # MCP (streamable-http at /mcp) + ops console (/ui/)
  targetPort: 9090

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 2Gi}

serviceAccount:
  create: true
  name: ""                   # empty = deployment.name (it is the RBAC subject)

# ============================================================================
# MCP Server App Config
# ============================================================================

apiKey:
  existingSecret: ""         # empty = "<deployment.name>-apikey"
  existingSecretKey: api-key

# Extra Host headers the SDK's DNS-rebinding protection accepts for in-cluster
# svc-DNS callers (e.g. Open WebUI); verbatim or `host:*`; FQDN+loopback always allowed.
extraAllowedHosts: []

console:
  enabled: true              # HPE ops console at /ui/ (inert shell; /mcp keeps auth)

# ============================================================================
# Cluster-wide Listing Guardrails
# ============================================================================

listing:
  maxItems: ""               # K8S_MCP_MAX_LIST_ITEMS — cluster-wide list cap (server default 100)
  concurrency: ""            # K8S_MCP_LIST_CONCURRENCY — -A fan-out width (server default 8)
  maxEvents: ""              # K8S_MCP_MAX_EVENTS — get_events/triage items (server default 100)
  maxNsRewrite: ""           # K8S_MCP_MAX_NS_REWRITE — per-namespace rewrite limit (server default 20)

# ============================================================================
# Metrics
# ============================================================================

metrics:
  enabled: false             # K8S_MCP_METRICS_ENABLED=true serves GET /metrics + the ServiceMonitor
  interval: 30s              # ServiceMonitor scrape interval

# ============================================================================
# Cluster Access / Read-Only RBAC
# ============================================================================

rbac:
  create: true
  scope: cluster              # "namespace" clamps every read to the release namespace
  # NEVER ["*"] — it would re-grant secrets read (refused at render).
  extraResourceGroups: []

# ============================================================================
# Namespace Governance
# ============================================================================

# App layer; RBAC remains the true boundary.
namespaces:
  allowed: ""                # K8S_MCP_ALLOWED_NAMESPACES ("" = all namespaces)
  blocked: ""                # K8S_MCP_BLOCKED_NAMESPACES

# ============================================================================
# Exec audit trail (fleet D16 / hash-chained)
# ============================================================================

# exec_in_pod runs an attacker-influenced argv inside a production container,
# so its audit record is the only forensic trace of who ran what where. Entries
# are written as JSONL through the fleet's shared HashChainedAuditLog (the same
# writer applygate uses) and additionally echoed to stdout in the legacy
# "AUDIT exec ..." shape, so existing log matchers keep working.
#
# The container filesystem is read-only, so the trail needs this mount; with
# no writable path the server degrades to stdout-only (best-effort, never
# blocks a tool call). emptyDir survives container restarts but NOT pod
# rescheduling — set persistence.existingClaim when the trail must outlive the
# pod (recommended wherever exec is enabled).
audit:
  mountPath: /var/lib/k8s-mcp
  persistence:
    existingClaim: ""        # PVC name; "" = emptyDir

# ============================================================================
# Hardened Exec
# ============================================================================

exec:
  enabled: false
  namespaces: ""             # exec namespace list; "" = follow the general policy
  requireLabel: true         # pod must carry k8s-mcp.io/exec="true"
  allowedCommands: ""        # extra binaries beyond the read-only allowlist
  autoRbac: true             # cluster scope only: server binds pods/exec Roles at startup

# ============================================================================
# Per-user Keys
# ============================================================================

clients:
  # "name:key[:ns-patterns];…" — CONTAINS SECRETS; prefer existingSecret.
  value: ""
  existingSecret: ""         # Secret with the whole K8S_MCP_CLIENTS string
  existingSecretKey: clients

# ============================================================================
# Pod Annotations / Node Placement
# ============================================================================

# Container hardening (non-root, read-only rootfs, dropped caps, seccomp) is NOT values-overridable.
podAnnotations:
  sidecar.istio.io/inject: "false"

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# PCAI Networking
# ============================================================================

# The endpoint doubles as MCP_HOSTNAME and MUST be unique per release on the shared gateway.
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"

  virtualService:
    # Gate DIRECTLY on this key — Sprig's `default` treats explicit false as empty.
    enabled: true
    endpoint: "k8s-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s

  # Gateway auth gate (oauth2-proxy) — on = PCAI tokens on top of the API key.
  authorizationPolicy:
    enabled: false
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================================
# MCP Network Zone
# ============================================================================

# ADDITIVE, DEFAULT OFF — once enabled, anything not matched is DENIED; egress stays unrestricted.
networkPolicy:
  enabled: false
  sameNamespace: true

  # The LLM gateway's relay ns goes first; `monitoring` belongs here whenever
  # the chart ships a ServiceMonitor (an unlisted scrape ns dies SILENTLY).
  authorizedClients:
    namespaces: []

  # Browser path stays OPEN — the zone stops random IN-CLUSTER access only.
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system

  # Edge pods carry app=istio-ingressgateway (`ezaf-gateway` is the Gateway CR name).
  ingressGatewayLabels:
    app: istio-ingressgateway

  # Kubelet probes originate at the NODE — 0.0.0.0/0 with an empty probeExceptCidrs FAILS the render.
  probeCidrs: []
  probeExceptCidrs: []

  egress:
    # Intentionally unrestricted (admin MCPs reach the k8s API / Prometheus / internet).
    enabled: false
    extraEgress: []

# ============================================================================
# PodDisruptionBudget — ADDITIVE, DEFAULT OFF
# ============================================================================

# Voluntary-eviction guard for node drains (templates/pdb.yaml, policy/v1).
# DEFAULT OFF keeps the default helm render byte-identical. Single-replica
# caveat: with replicaCount 1 (every chart in this fleet), minAvailable: 1
# blocks ALL voluntary evictions — a drain waits. That is the intended
# safety trade; operators wanting drainable HA should raise
# deployment.replicaCount (>= 2) first.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
