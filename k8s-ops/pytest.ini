[pytest]
# src-layout (2026-10 refactor): tests live in tests/, the package in src/k8s_mcp/.
# pythonpath entries mirror spec §5: "src" so "from k8s_mcp import ..." resolves,
# "." so the repo-root top-level fleet modules (mcp_auth) stay importable.
pythonpath = src .
testpaths = tests

# --- warning policy -------------------------------------------------------
# One third-party DeprecationWarning is filtered here ON PURPOSE. It is not
# this repo's code and nothing here calls the deprecated API:
#
#   asyncio.iscoroutinefunction is deprecated in Python 3.14 (removal 3.16).
#   uvloop 0.22.1 still calls it - uvloop/loop.pyx:2913, inside
#   add_signal_handler(), via the `aio_iscoroutinefunction` binding captured at
#   import in uvloop/includes/stdlib.pxi:40. uvicorn installs SIGINT/SIGTERM
#   handlers through that method when the smoke-console tests boot a real
#   server, so the warning fires twice per server start and is attributed to
#   asyncio/threads.py (the awaiting frame), not to its real origin.
#
# REMOVE THIS FILTER when either: uvloop ships 3.14 support (watch
# https://github.com/MagicStack/uvloop for the loop.pyx change), or the tests
# stop using uvloop. Do not add a blanket DeprecationWarning ignore above it -
# that would hide real ones from this repo.
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16:DeprecationWarning