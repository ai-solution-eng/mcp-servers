# ddgs-lite — corporate-egress lab cluster values (values-examples, secret-free).
# Cluster: <cluster-domain> (HPE-network style — corporate proxy required for
# engine egress). Replace every <cluster-domain> placeholder with the site's
# literal domain.
# FULL VALUES — complete copy of helm/values.yaml with site edits marked '# SITE:'.
# Paste-ready: this file alone is the full values document (helm deep-merges
# it over identical chart defaults; PCAI's values editor replaces the chart's
# bundled values.yaml entirely, so every key must be present here).

# ddgs-lite — DuckDuckGo MCP server: metasearch via ddgs (9 engines) plus
# a content fetcher, over MCP for PCAI (HPE Ezmeral Unified Analytics),
# exposed at /mcp through the PCAI Istio gateway.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: ddgs-lite
  appName: ddgs-lite
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  # SITE: chart default repo; pin the tag to match the chart's appVersion.
  repository: ghcr.io/ai-solution-eng/ddgs-mcp
  tag: v1.0.1
  pullPolicy: IfNotPresent

# -- Service exposure ------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090

# -- Resources -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 200Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Environment ------------------------------------------------------------------------------
env:
  # SITE: default region/locale for searches (e.g. us-en, de-de, wt-wt);
  # clients can still pass region per call.
  - name: DDG_REGION
    value: "us-en"

# -- Egress proxy --------------------------------------------------------------------------------
# SITE: ON — the lab cluster has no direct internet egress; search and
# fetch traffic must go through the corporate proxy. Each key is wired into
# the pod only when non-empty (proxy: {} = fully off).
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,localhost"

# -- PCAI (HPE Ezmeral Unified Analytics) integration ------------------------------------------------
# SITE: literal cluster domain — no ${DOMAIN_NAME} placeholder on the lab site.
ezua:
  enabled: true
  domainName: "<cluster-domain>"   # informational only — no template reads it
  virtualService:
    # SITE: literal host for the lab site.
    endpoint: "ddgs-lite.<cluster-domain>"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
