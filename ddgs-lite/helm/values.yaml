# ddgs-lite — DuckDuckGo MCP server: metasearch via ddgs (9 engines) plus
# a content fetcher, over MCP for PCAI (HPE Ezmeral Unified Analytics),
# exposed at /mcp through the PCAI Istio gateway.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: ddgs-lite
  appName: ddgs-lite
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/ddgs-mcp
  tag: v1.0.1
  pullPolicy: IfNotPresent

# -- Service exposure ------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090

# -- Resources -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 200Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Environment ------------------------------------------------------------------------------
env:
  - name: DDG_REGION
    value: ""

# -- Egress proxy --------------------------------------------------------------------------------
# Per-key proxy wiring — each key is wired into the pod only when non-empty,
# so a corporate-proxy site sets http/https (and usually noProxy), while a
# direct-egress site leaves proxy: {} (or omits it) and everything renders off.
# CAUTION: a wrong proxy breaks DNS/egress — only set it behind a real proxy.
#   proxy:
#     http: http://proxy.corp.example:8080
#     https: http://proxy.corp.example:8080
#     noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"
proxy: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration ------------------------------------------------
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    endpoint: "ddgs-lite.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
