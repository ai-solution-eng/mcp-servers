[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgs-lite-mcp"
version = "0.5.1"
description = "DuckDuckGo MCP Server — metasearch via ddgs (9 engines) + content fetcher"
authors = []
requires-python = ">=3.10"
keywords = ["mcp", "duckduckgo", "search", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "mcp>=1.6.0,<2",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
    "brotli>=1.1.0",
    "ddgs>=9.14.0",
]

[project.scripts]
ddgs-lite = "server:main"

[tool.setuptools]
py-modules = ["server"]
