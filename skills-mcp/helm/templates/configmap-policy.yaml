{{- /*
Visibility policy (P2): identity -> role -> source paths.

Rendered ONLY when policy.enabled is true. The server reads this file on every
request (mtime-cached), so a values edit + re-apply changes visibility without
a rebuild. With the file ABSENT the server does no filtering at all — that is
the backwards-compatible default.
*/}}
{{- if .Values.policy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.deployment.name }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
data:
  access.yaml: |
{{ .Values.policy.accessYaml | indent 4 }}
{{- end }}
