{{- /*
API-key Secret, created only in demo mode: apiKey.existingSecret is empty AND
apiKey.value is set. Fleet deployments point at an operator-created Secret and
this file renders nothing: the chart never invents key material (an envsubst
apply once emptied a live key Secret). With neither set, the pod fails loud in
CreateContainerConfigError rather than starting with an empty key set, because
an empty key list would make mcp_auth fail open.
*/}}
{{- if and (not .Values.apiKey.existingSecret) .Values.apiKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.deployment.name }}-apikey
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
type: Opaque
stringData:
  {{ .Values.apiKey.existingSecretKey }}: {{ .Values.apiKey.value | quote }}
{{- end }}
