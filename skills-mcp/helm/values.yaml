# skills-mcp: serves the team's markdown skills over MCP 2.0.
# Three tools only: list_skills / get_skill / get_skill_file.

deployment:
  name: skills-mcp
  appName: skills-mcp
  replicaCount: 1
  # Recreate is REQUIRED while /data is a ReadWriteOnce PVC: RollingUpdate
  # starts the new pod before stopping the old one, and the second pod can
  # never attach the volume (Multi-Attach deadlock). Recreate stops, then
  # starts — seconds of downtime instead of a stuck rollout.
  strategy: Recreate

image:
  repository: ghcr.io/ai-solution-eng/skills-mcp
  tag: v0.2.1
  pullPolicy: IfNotPresent

imagePullSecrets: []   # only if the GHCR package stays PRIVATE

# API key: /mcp is never open in the cluster.
#
# Two modes, pick one:
#   1. FLEET: set existingSecret to an operator-created Secret. The pod fails
#      loud (CreateContainerConfigError) until it exists. That is the fleet
#      rule: the chart must never invent key material.
#   2. DEMO: leave existingSecret empty and set value; the chart creates
#      <deployment.name>-apikey itself. That value also lands in the
#      EzAppConfig CR, so treat it as a demo key, never a shared-site key.
#
# Neither set means the pod fails loud (CreateContainerConfigError). The chart
# never creates an empty key, because an empty key list makes mcp_auth fail open.
apiKey:
  existingSecret: ""
  existingSecretKey: api-keys
  value: ""

# Where skills come from: bundled snapshot plus refresh, no sidecar.
skills:
  # Comma list of folders in the repo to load. This is the demo/team switch:
  #   team -> "skills"        demo -> "skills,skills-demo"
  sourcePaths: "skills"
  # Tarball base URL. Leave empty to disable refresh (bundled snapshot only).
  sourceUrl: "https://codeload.github.com/ai-solution-eng/tools/tar.gz"
  # Branch, tag or commit sha to fetch.
  sourceRef: "main"
  # 14400 = 4 h. 0 disables the timer (the manual refresh endpoint still works).
  refreshIntervalS: 14400
  # Working copy. An emptyDir: a restart re-seeds from the bundled snapshot, so
  # a refresh does not survive a restart. Fine for the demo, and it keeps the
  # pod permission-free (no PVC, no RBAC).
  root: /data
  # The snapshot baked into the image at build time.
  bundledRoot: /opt/skills-bundled

# ---------------------------------------------------------------------------
# Persistent state (P4/C1): per-user prefs + private skills + the refresh copy
# ---------------------------------------------------------------------------
# A PVC is required for anything a person creates: disabled lists, minted token
# hashes, private skills. With enabled=false the pod falls back to an emptyDir
# and everything resets on restart (fine for a quick local run, not for users).
state:
  dir: /data/state
  privateDir: /data/private
  # "true" = believe X-Forwarded-User from the SSO proxy. Requires a
  # NetworkPolicy limiting ingress to that proxy — never expose the pod directly.
  trustProxyIdentity: "false"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""        # "" = cluster default
  existingClaim: ""       # set to adopt a PVC you created yourself

# Resources / security
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  # Required once /data is a PVC: the volume is created root:root, so the
  # non-root app user needs the group ownership to write.
  fsGroup: 10001

# Networking
service:
  type: ClusterIP
  port: 9101
  targetPort: 9101

# Extra Host headers for in-cluster callers (`host:*` form).
extraAllowedHosts: []

# ---------------------------------------------------------------------------
# L3/L4 lock (see templates/networkpolicy.yaml)
# ---------------------------------------------------------------------------
# Required before state.trustProxyIdentity can be true. Ingress-only; egress
# (the GitHub refresh) stays open.
networkPolicy:
  enabled: false
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    istio: ingressgateway
  # Namespaces allowed to call the pod directly (the LLM gateway relay).
  gatewayNamespaces:
    - pcai-llm
  # NODE CIDRs allowed on the app port — kubelet probes + kubectl port-forward.
  # Find yours with: kubectl get nodes -o wide   (INTERNAL-IP column)
  probeCidrs: []
  # Pod CIDR(s) carved back OUT of the allowance so pod traffic stays governed
  # by the namespace rules above. Find it with: kubectl get pods -A -o wide
  probeExceptCidrs: []

# Corporate proxy for the GitHub fetch (each key wired only when non-empty).
proxy: {}

# PCAI exposure: the Istio VirtualService on the ezaf-gateway.
# ---------------------------------------------------------------------------
# Edge SSO (browser path only)
# ---------------------------------------------------------------------------
# A CUSTOM AuthorizationPolicy on the ingress gateway makes oauth2-proxy
# authenticate the request before it reaches this app, then inject the identity
# headers. Safe ONLY together with networkPolicy.enabled (otherwise an
# in-cluster caller can bypass the edge and forge the header).
ezua:
  enabled: false
  authorizationPolicy:
    enabled: false
    namespace: istio-system
    providerName: oauth2-proxy        # the ext_authz provider in Istio's MeshConfig
    gatewayLabels:
      istio: ingressgateway
  domainName: "${DOMAIN_NAME}"
  virtualService:
    enabled: true
    endpoint: "skills-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 300s
