apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
    hpe-ezua/type: vendor-service
    hpe-ezua/app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
        hpe-ezua/type: vendor-service
        hpe-ezua/app: {{ .Chart.Name }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Values.deployment.name }}
      automountServiceAccountToken: true
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            # API key: ALWAYS out-of-band (the chart never creates it; the
            # Deployment fails loud with CreateContainerConfigError until
            # the Secret exists). This server is WRITE-capable — the key is
            # its only gate at the transport layer.
            - name: EZAPP_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret | default (printf "%s-apikey" .Values.deployment.name) }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- if and .Values.ezua.enabled .Values.ezua.virtualService.endpoint }}
            # Public FQDN — pins the Host header (DNS-rebinding protection).
            - name: MCP_HOSTNAME
              value: {{ .Values.ezua.virtualService.endpoint | quote }}
            {{- end }}
            # ChartMuseum (in-cluster ClusterIP) — upload target for curl.
            - name: CHARTMUSEUM_URL
              value: {{ .Values.chartmuseum.url | quote }}
            {{- if .Values.chartmuseum.tlsInsecure }}
            # PCAI CA not in the container trust store — skip TLS
            # verification for the outbound ChartMuseum calls.
            - name: CHARTMUSEUM_TLS_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.chartmuseum.caBundle }}
            # ...or pin the platform CA instead (mount the CA file into the
            # pod yourself and pass its container path here).
            - name: CHARTMUSEUM_CA_BUNDLE
              value: {{ .Values.chartmuseum.caBundle | quote }}
            {{- end }}
            {{- if .Values.chartmuseum.authSecretName }}
            # Optional basic auth; keys live in an out-of-band Secret.
            - name: CHARTMUSEUM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chartmuseum.authSecretName }}
                  key: {{ .Values.chartmuseum.usernameKey }}
            - name: CHARTMUSEUM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chartmuseum.authSecretName }}
                  key: {{ .Values.chartmuseum.passwordKey }}
            {{- end }}
            # EzAppConfig CR wiring (validation + kubectl resource names).
            - name: EZAPP_MCP_EZAPPCONFIG_KIND
              value: {{ .Values.ezappconfig.kind | quote }}
            - name: EZAPP_MCP_EZAPPCONFIG_API_VERSIONS
              value: {{ .Values.ezappconfig.apiVersion | quote }}
            - name: EZAPP_MCP_EZAPPCONFIG_PLURAL
              value: {{ .Values.ezappconfig.plural | quote }}
            - name: EZAPP_MCP_MAX_CHART_MB
              value: {{ .Values.ezappconfig.maxChartMB | quote }}
            # Deploy-target namespace governance (app layer; RBAC stays the
            # true boundary — the SA can ONLY touch ezappconfigs).
            - name: EZAPP_MCP_ALLOWED_TARGET_NAMESPACES
              value: {{ .Values.targets.allowed | quote }}
            - name: EZAPP_MCP_BLOCKED_TARGET_NAMESPACES
              value: {{ .Values.targets.blocked | quote }}
            # Ownership ledger ConfigMap (created by this chart with
            # helm.sh/resource-policy: keep): records what this server
            # deployed; gates its delete/overwrite tools to those objects.
            - name: EZAPP_MCP_LEDGER_CONFIGMAP
              value: {{ .Values.ledger.configmap | default (printf "%s-ledger" .Values.deployment.name) | quote }}
            {{- if .Values.ledger.namespace }}
            - name: EZAPP_MCP_LEDGER_NAMESPACE
              value: {{ .Values.ledger.namespace | quote }}
            {{- end }}
            {{- if not .Values.ui.enabled }}
            - name: EZAPP_MCP_UI_ENABLED
              value: "false"
            {{- end }}
            {{- if not .Values.chunkedUpload.enabled }}
            - name: EZAPP_MCP_CHUNKED_UPLOAD_ENABLED
              value: "false"
            {{- end }}
            {{- if not .Values.delete.enabled }}
            - name: EZAPP_MCP_DELETE_ENABLED
              value: "false"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
