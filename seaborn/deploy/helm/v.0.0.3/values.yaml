image:
  repository: ghcr.io/ai-solution-eng/seaborn-mcp
  pullPolicy: IfNotPresent
  tag: 1.0.0

replicaCount: 1

service:
  type: ClusterIP
  port: 9092
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

ezua:
  enabled: true
  virtualService:
    endpoint: "mcp-seaborn-server.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

# -- MCP network zone (ADDITIVE, DEFAULT OFF — fleet contract, 2026-09) --------
# Ingress default-deny for the MCP pods, admitting ONLY the listed sources.
# OFF by default: the default render is byte-identical to the baseline.
# USER-FACING chart: gateway rule ON so the browser VS keeps working.
# `monitoring` belongs in the list whenever a ServiceMonitor scrapes this
# server — an unlisted scrape ns dies SILENTLY.
networkPolicy:
  enabled: false
  sameNamespace: true
  authorizedClients:
    namespaces: []
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  # LIVE-VERIFIED (G2 inventory): edge pods carry app=istio-ingressgateway —
  # ezaf-gateway is the Gateway CR NAME, no pod carries it as a label.
  ingressGatewayLabels:
    app: istio-ingressgateway
  probeCidrs: []            # node /32s (kubelet probes) — see hardened example
  probeExceptCidrs: []      # pod CIDR carve-out; NEVER equal to a probeCidr
  egress:
    enabled: false          # egress intentionally unrestricted (SQLhandler peer)

certificatesPolicy:
  enabled: false
  env: []                 # e.g. NODE_EXTRA_CA_CERTS / SSL_CERT_DIR / REQUESTS_CA_BUNDLE / DOCKER_CERT_PATH
  initContainer:
    image: alpine:3.20
    command: []
  initVolumeMounts: []    # mounts applied to the build-ca-bundle init container (e.g. combined-certs, ezaf-root-ca)
  volumes: []
  volumeMounts: []

