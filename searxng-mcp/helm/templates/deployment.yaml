apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.deployment.appName }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deployment.appName }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      # SearXNG's entrypoint writes into /etc/searxng, so its ConfigMap is
      # copied into an emptyDir by an init container (same pattern as the
      # proven community deployments).
      initContainers:
        - name: init-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - mkdir -p /config-dst && if [ -d /config-src ]; then cp -R /config-src/. /config-dst/ || true; fi
          volumeMounts:
            - name: config-runtime
              mountPath: /config-dst
            - name: config-src
              mountPath: /config-src
        {{- if .Values.caCert.enabled }}
        - name: init-ca-bundle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The MCP image is reused on purpose: it already carries the
          # certifi bundle the server's HTTP stack would otherwise use, so
          # the combined bundle stays consistent with the code's defaults.
          command:
            - sh
            - -ec
            - >-
              mkdir -p /bundle-dst;
              CERTIFI="$(find /usr/local/lib -path '*site-packages/certifi/cacert.pem' 2>/dev/null | head -n1)";
              if [ -n "$CERTIFI" ]; then cp "$CERTIFI" /bundle-dst/ca-bundle.crt;
              else cp /etc/ssl/certs/ca-certificates.crt /bundle-dst/ca-bundle.crt 2>/dev/null || : > /bundle-dst/ca-bundle.crt; fi;
              cat /bundle-src/*.crt >> /bundle-dst/ca-bundle.crt
          volumeMounts:
            - name: proxy-ca-bundle
              mountPath: /bundle-dst
            - name: proxy-ca-src
              mountPath: /bundle-src
              readOnly: true
        {{- end }}
      volumes:
        - name: config-src
          configMap:
            name: {{ .Values.deployment.name }}-settings
        - name: config-runtime
          emptyDir: {}
        {{- if .Values.caCert.enabled }}
        # Corporate egress CA for the MCP container (TLS-intercepting
        # proxies — Zscaler et al.). init-ca-bundle combines the mounted
        # PEMs with the image's own public bundle into ONE file: OpenSSL
        # REPLACES the default store with whatever verify= points at, so a
        # proxy-CA-only bundle would break every non-intercepted site.
        - name: proxy-ca-src
          configMap:
            name: {{ .Values.caCert.configMap }}
        - name: proxy-ca-bundle
          emptyDir: {}
        {{- end }}
        {{- if and .Values.browser.enabled .Values.browser.caCert.enabled }}
        # Corporate MITM CA for the headless browser (Chromium verifies TLS
        # against the OS trust store, not *_PROXY env or SSL_CERT_FILE).
        - name: browser-ca-src
          configMap:
            name: {{ .Values.browser.caCert.configMap }}
        {{- end }}
      containers:
        # ------------------------------------------------------------------
        # SearXNG sidecar — the metasearch engine itself (localhost:8080)
        # ------------------------------------------------------------------
        - name: searxng
          image: "{{ .Values.searxng.image.repository }}:{{ .Values.searxng.image.tag }}"
          imagePullPolicy: {{ .Values.searxng.image.pullPolicy }}
          env:
            - name: FORCE_OWNERSHIP
              value: "true"
            {{- if .Values.searxng.existingSecret }}
            # SEARXNG_SECRET from a pre-created Secret (preferred: the value
            # never passes through values files or git).
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.searxng.existingSecret }}
                  key: {{ .Values.searxng.existingSecretKey | default "secret" }}
            {{- else }}
            - name: SEARXNG_SECRET
              value: {{ .Values.searxng.secretKey | required "searxng.secretKey is required (SEARXNG_SECRET) — or set searxng.existingSecret" | quote }}
            {{- end }}
            {{- if .Values.proxy.http }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.http | quote }}
            - name: http_proxy
              value: {{ .Values.proxy.http | quote }}
            {{- end }}
            {{- if .Values.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.https | quote }}
            - name: https_proxy
              value: {{ .Values.proxy.https | quote }}
            {{- end }}
            {{- if .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            - name: no_proxy
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: config-runtime
              mountPath: /etc/searxng
        # ------------------------------------------------------------------
        # MCP server — streamable-http + SSE at /mcp (port 9090)
        # ------------------------------------------------------------------
        - name: {{ .Values.deployment.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.caCert.enabled }}
          volumeMounts:
            - name: proxy-ca-bundle
              mountPath: /ca-bundle
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
            {{- if .Values.apiKey.existingSecret }}
            # OPTIONAL MCP API-key auth (fleet decision 2026-09): wired ONLY
            # when the values point at a Secret; unset → /mcp runs open with
            # a loud startup warning (gateway-fronted deployments).
            - name: SEARXNG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.existingSecret }}
                  key: {{ .Values.apiKey.existingSecretKey }}
            {{- end }}
            {{- $svcHost := printf "%s-service.%s.svc.cluster.local:*" .Values.deployment.name .Release.Namespace }}
            {{- $transportActive := and .Values.ezua.enabled .Values.ezua.virtualService.endpoint }}
            {{- if $transportActive }}
            # Public FQDN — pins the Host header (DNS-rebinding protection;
            # read once at server startup, changing it requires a restart).
            - name: MCP_HOSTNAME
              value: {{ .Values.ezua.virtualService.endpoint | quote }}
            {{- end }}
            {{- if or $transportActive .Values.extraAllowedHosts }}
            # In-cluster callers (svc DNS) — DNS-rebinding allowlist. When
            # transport security is active (ezua endpoint pinned or any
            # extraAllowedHosts), the chart ALWAYS includes this release's
            # own service DNS FIRST — the same name the Service resource
            # renders — because the LLM-gateway relay hop arrives with
            # Host: <deployment.name>-service.<ns>.svc.cluster.local:<port>
            # (the fleet 421 Misdirected Request class). Site
            # extraAllowedHosts append after it; entries are matched
            # verbatim or as `host:*` by the SDK's transport security.
            - name: MCP_EXTRA_ALLOWED_HOSTS
              {{- if .Values.extraAllowedHosts }}
              value: {{ printf "%s,%s" $svcHost (join "," .Values.extraAllowedHosts) | quote }}
              {{- else }}
              value: {{ $svcHost | quote }}
              {{- end }}
            {{- end }}
            {{- with .Values.fetch.allowHosts }}
            # fetch_content SSRF guard escapes/caps (fleet decision D6 — the
            # guard itself is default-ON in the server; these only tune it).
            - name: SEARXNG_FETCH_ALLOW_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fetch.denyExtra }}
            - name: SEARXNG_FETCH_DENY_EXTRA
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fetch.cacheTtl }}
            - name: SEARXNG_FETCH_CACHE_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fetch.maxBodyBytes }}
            - name: SEARXNG_FETCH_MAX_BODY_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fetch.maxScreenshotKb }}
            - name: SEARXNG_FETCH_MAX_SCREENSHOT_KB
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.fetch.maxRedirects }}
            - name: SEARXNG_FETCH_MAX_REDIRECTS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.proxy.http }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.http | quote }}
            - name: http_proxy
              value: {{ .Values.proxy.http | quote }}
            {{- end }}
            {{- if .Values.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.https | quote }}
            - name: https_proxy
              value: {{ .Values.proxy.https | quote }}
            {{- end }}
            {{- if .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            - name: no_proxy
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
            {{- if .Values.caCert.enabled }}
            # Combined CA bundle (public roots + the egress proxy's CA),
            # built by init-ca-bundle. FETCH_CA_BUNDLE is read by the server
            # code (verify= to both HTTP rungs); SSL_CERT_FILE /
            # CURL_CA_BUNDLE cover the same rungs natively in images that
            # predate that code (httpx2 and curl_cffi honor them).
            - name: FETCH_CA_BUNDLE
              value: /ca-bundle/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /ca-bundle/ca-bundle.crt
            - name: CURL_CA_BUNDLE
              value: /ca-bundle/ca-bundle.crt
            {{- end }}
            {{- if and .Values.browser.enabled .Values.browser.ignoreCertErrors }}
            # Read by the MCP container's playwright client (the browser
            # contexts are created there), not by the sidecar itself.
            - name: BROWSER_IGNORE_CERT_ERRORS
              value: "true"
            {{- end }}
            {{- with .Values.fetch.tlsInsecureFallback }}
            - name: FETCH_TLS_INSECURE_FALLBACK
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # /metrics self-metrics (Wave-3 C3, ADDITIVE, DEFAULT OFF): the
            # MCP container serves per-tool request counters at /metrics only
            # when this env is set — nothing here renders when
            # metrics.enabled is false (the default), so the default pod is
            # unchanged. Pairs with templates/servicemonitor.yaml.
            - name: SEARXNG_METRICS_ENABLED
              value: "true"
            {{- end }}
        {{- if .Values.browser.enabled }}
        # ------------------------------------------------------------------
        # Headless-browser sidecar (optional) — Playwright Chromium serving
        # an unauthenticated CDP port bound to pod-loopback. fetch_content
        # escalates JS-only pages to it. Loopback-only is load-bearing: all
        # pod containers share one network namespace, so 127.0.0.1 works
        # pod-locally while the cluster network never sees the port (the
        # cluster has no NetworkPolicies — never add
        # --remote-debugging-address=0.0.0.0).
        # ------------------------------------------------------------------
        - name: browser
          image: "{{ .Values.browser.image.repository }}:{{ .Values.browser.image.tag }}"
          imagePullPolicy: {{ .Values.browser.image.pullPolicy }}
          env:
            # Chromium ignores *_PROXY env vars; the entrypoint converts
            # this into --proxy-server. Rendered ONLY when proxy.https is
            # non-empty — with proxy: {} the var is absent and the browser
            # egresses directly.
            {{- if .Values.proxy.https }}
            - name: BROWSER_PROXY
              value: {{ .Values.proxy.https | quote }}
            {{- end }}
            {{- if .Values.browser.extraArgs }}
            - name: BROWSER_EXTRA_ARGS
              value: {{ .Values.browser.extraArgs | quote }}
            {{- end }}
          # CDP binds pod-loopback, so kubelet http/tcp probes against the
          # pod IP cannot reach it — probe via exec instead. The container
          # ships python3; a real CDP handshake beats a "PID 1 exists" check.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=3)\""]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=3)\""]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=3)\""]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.browser.resources | nindent 12 }}
          {{- if .Values.browser.caCert.enabled }}
          volumeMounts:
            - name: browser-ca-src
              mountPath: /certs-src
              readOnly: true
          {{- end }}
        {{- end }}
