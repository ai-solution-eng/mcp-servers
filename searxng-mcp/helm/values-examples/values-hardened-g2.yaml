# searxng-mcp — HARDENED example: the MCP network zone ON.
# USER-FACING MCP: the browser path stays ON — the SearXNG web UI must keep
# working; in-cluster callers are allowlisted explicitly, everyone else denied.
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
#
# OVERLAY: merge onto the base/g2 values document — nothing here is standalone
# (keys absent here inherit the base document/chart defaults).
# Pointer: documentation/DEPLOYMENT.md + helm/values.yaml (networkPolicy block).
#
# ⚠️ Enable AFTER confirming the LLM gateway's relay namespace is listed —
# with the zone on, every unlisted caller times out (deny by absence).
#
# Zone list: least-privilege — the namespaces the gateway netpol names as
# authorized MCP callers, plus monitoring for the ServiceMonitor scrape.
networkPolicy:
  enabled: true
  sameNamespace: true
  authorizedClients:
    namespaces:
      - pcai-llm            # LLM Gateway relay (in-cluster MCP relay)
      - dsh-web-helm        # DSH web (gateway allowlist)
      - owebui0-11-0        # OWUI instance on the gateway allowlist
      - opencode-web-helm   # OpenCode web
      - prometheus          # the ACTUAL Prometheus scraper — the monitoring ns
                            # holds otel/UA, NOT the scraper; omit and up=0
      - monitoring          # ServiceMonitor scrape ns — omit and it dies SILENTLY
  allowEzafGatewayIngress: true   # gateway rule stays ON (SearXNG UI + /mcp via the VS)
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)
  # Kubelet probes originate at the NODE.
  probeCidrs:
    - 10.0.0.1/32           # node IP example — replace per cluster
    - 10.0.0.2/32           # node IP example — replace per cluster
  probeExceptCidrs: []   # only a BROAD probe allow (0.0.0.0/0) pairs with a carve-out

# The VirtualService stays rendered (browser path unchanged).
ezua:
  virtualService:
    enabled: true

# The SDK's DNS-rebinding protection 421s in-cluster callers on the local
# service DNS — the chart auto-includes the own-service entry; list EXTRA only.
extraAllowedHosts:
  - searxng-mcp-service.<release-namespace>.svc.cluster.local:*   # replace <release-namespace>
