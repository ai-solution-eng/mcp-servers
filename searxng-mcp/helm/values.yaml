# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
# Prefer: Slack

# searxng-mcp — MCP 2.0 metasearch + content fetcher backed by a bundled
# SearXNG sidecar, for PCAI (HPE Ezmeral Unified Analytics). The
# VirtualService root serves the SearXNG web UI; /mcp routes to the MCP
# server (streamable-http + SSE) through the PCAI Istio gateway.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: searxng-mcp
  appName: searxng-mcp
  replicaCount: 1

# -- Images ------------------------------------------------------------------------
image:
  repository: ghcr.io/ai-solution-eng/searxng-mcp
  # Keep in lockstep with Chart.yaml appVersion (and the pushed image tags):
  # this default is what a deploy WITHOUT a site values file uses, and a
  # stale default is how a "v1.0.0 MCP + browser sidecar" pod happens —
  # an MCP too old to know the sidecar exists.
  tag: v1.7.0
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE. Public packages (the
# ddgs-mcp convention) pull anonymously. Create with:
#   kubectl create secret docker-registry ghcr-pull -n searxng-mcp \
#     --docker-server=ghcr.io --docker-username=<gh-user> \
#     --docker-password=<gh-PAT-with-read:packages>
imagePullSecrets: []

# Bundled SearXNG sidecar.
searxng:
  image:
    repository: docker.io/searxng/searxng
    # Pinned to the dated tag that Docker Hub 'latest' resolved to when the
    # chart was updated (2026-09-08) — a mutable 'latest' tag would give
    # different images per node/restart. To re-pin later:
    #   curl -s https://hub.docker.com/v2/repositories/searxng/searxng/tags?page_size=5 | jq -r '.results[].name' | head -3
    # For a fully immutable reference, switch to the digest form:
    #   image: docker.io/searxng/searxng@sha256:3547509b419cd6a67333d6d68bd1ffad8d46d3669d82e7a7bd538f7b45827432
    tag: "2026.9.8-3fdc6d753"
    pullPolicy: IfNotPresent
  # Secret key used by SearXNG for session/crypto. CHANGE THIS for any real
  # deployment — or better, leave the default and point existingSecret below
  # at a pre-created Secret so the value never passes through values/git
  # (kubectl create secret generic <name> --from-literal=secret=$(openssl rand -hex 32)).
  secretKey: "change-me-searxng-secret"
  # Reference to a pre-created Secret holding SEARXNG_SECRET. When set, the
  # literal secretKey above is ignored and the container gets
  #   SEARXNG_SECRET from secretKeyRef <existingSecret>/<existingSecretKey>.
  # This is the preferred wiring (rotation = update the Secret + restart).
  existingSecret: ""
  existingSecretKey: secret
  # Public base URL of the SearXNG UI (rendered into settings.yml
  # server.base_url). Leave "" to omit — the JSON API works without it; set
  # the literal https://<endpoint>/ in site values for correct UI links.
  baseUrl: ""
  # Default language/region passed to the MCP server (SEARXNG_LANGUAGE).
  language: "en-US"
  # Engines to disable via settings.yml (top-level engines key).
  #
  # Default: the engines with a track record of dying behind corporate
  # egress proxies (SE-G2 evidence: ddg/brave/startpage serve CAPTCHA walls
  # to datacenter IPs; wikidata SPARQL times out through the proxy). Keeping
  # dead engines enabled is NOT cheap on a shared egress IP: every search
  # pays their request/timeout budget, auto-suspension merely reports them
  # per query while the quota keeps burning, and the whole cluster's
  # instances share one source IP. Names MUST match SearXNG engine names
  # exactly (dots for brave variants, spaces for ddg/startpage variants) —
  # a wrong name is silently ignored. Set to [] only on open-internet
  # (non-proxied) installs.
  disabledEngines:
    - brave
    - brave.images
    - brave.news
    - brave.videos
    - duckduckgo
    - duckduckgo images
    - duckduckgo news
    - duckduckgo videos
    - startpage
    - startpage images
    - startpage news
    - wikidata
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Service exposure -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9090        # MCP server (streamable-http + SSE at /mcp)
  targetPort: 9090
  searxngPort: 8080 # SearXNG UI/API (served at the VirtualService root)

# -- Resources (MCP container) ----------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 200Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Headless-browser sidecar (optional) ----------------------------------------------------------
# Lets fetch_content render JavaScript pages (auto-escalation when plain HTTP
# fails or returns a JS-stub shell, render="always", and include_screenshot).
# The image is built from ./browser/Dockerfile (Playwright Chromium headless
# shell). Disabled by default: adds ~512Mi memory and a second image to
# maintain, while plain HTTP + curl_cffi already covers most sites. The MCP
# container reaches the browser on http://127.0.0.1:9222 (pod-localhost,
# loopback-only binding) — no service, port, or policy changes needed.
browser:
  enabled: false
  image:
    repository: ghcr.io/ai-solution-eng/searxng-mcp-browser
    tag: v1.6.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Corporate MITM CA: the entrypoint installs *.crt files from this
  # ConfigMap into the container trust store at startup (Chromium does not
  # honor SSL_CERT_FILE / NODE_EXTRA_CA_CERTS). The ConfigMap must exist in
  # the release namespace, e.g. copy the cluster-wide one:
  #   kubectl get cm ezaf-root-ca -n <existing-ns> -o yaml | \
  #     yq 'del(.metadata.namespace,.metadata.uid,.metadata.resourceVersion,
  #            .metadata.creationTimestamp)' | \
  #     kubectl apply -n <release-ns> -f -
  caCert:
    enabled: false
    configMap: "ezaf-root-ca"
  # Extra Chromium command-line flags (string), e.g. "--disable-features=x".
  extraArgs: ""
  # Skip TLS verification in rendered contexts (BROWSER_IGNORE_CERT_ERRORS on
  # the MCP container — the playwright client creates the contexts there).
  # Escape hatch for egress proxies whose CA cannot be distributed; the
  # top-level caCert bundle is the proper fix. Default false.
  ignoreCertErrors: false

# -- Environment ------------------------------------------------------------------------------------
env:
  - name: SEARXNG_URL
    value: "http://localhost:8080"

# -- /metrics + ServiceMonitor (Wave-3 C3 — ADDITIVE, DEFAULT OFF) -------------------
# Prometheus self-metrics on the MCP container (NOT the SearXNG sidecar): ONE
# counter family, searxng_mcp_tool_requests_total{tool,outcome} — per-tool
# request counts with outcome ok|error for search + fetch_content (which tools
# agents call, how often, how often they fail — SSRF-policy refusals surface
# as fetch errors). No queries, URLs, or error text are ever exported.
# DEFAULT false: the chart renders NOTHING extra (no env, no ServiceMonitor)
# and the server serves no /metrics route — the default render is
# byte-identical to the pre-metrics baseline. Flip to true per site values to
# enable; /metrics is then served key-free on the MCP port (the auth gate
# protects only /mcp — "/metrics" is not "/mcp..." — matching the probes' no
# key posture) so the ServiceMonitor can scrape it.
metrics:
  enabled: false
  # Render the monitoring.coreos.com/v1 ServiceMonitor (requires enabled).
  serviceMonitor: true
  # Scrape interval rendered into the ServiceMonitor.
  interval: 30s

# -- API keys (OPTIONAL — fleet decision 2026-09, fleet pattern: K8S-MCP) ------
# /mcp (both transports) requires a key ONLY when existingSecret is set; the
# fetch tools' SSRF surface is exactly why unauthenticated callers shouldn't
# reach them in-cluster, so prefer setting this. Leave empty for
# gateway-fronted deployments (the server then runs open, with a loud startup
# warning). The chart NEVER inlines a key in values. Comma-separated keys all
# authenticate: that is the rotation mechanism — append the new key, move
# clients over, drop the old one, no downtime. The fleet-universal
# MCP_API_KEYS env is honored too (either var authenticates).
apiKey:
  existingSecret: ""
  existingSecretKey: api-keys

# -- In-cluster host allowlist (DNS-rebinding additions) -----------------------------------
# EXTRA Host header values the MCP SDK's DNS-rebinding protection accepts, for
# in-cluster callers that address the server by its service DNS name instead of
# the public FQDN (e.g. a peer MCP →
# http://other-mcp.<ns>.svc.cluster.local:9090/mcp). Joined into
# MCP_EXTRA_ALLOWED_HOSTS. Entries are matched verbatim, or use the `host:*`
# form to accept any port. The pinned public FQDN (ezua.virtualService.endpoint,
# wired as MCP_HOSTNAME) and loopback are always allowed; without this knob
# behaviour is unchanged (the SDK's implicit loopback-only protection).
# List of strings.
#
# NOTE — the chart AUTO-INCLUDES this release's own service DNS
# (<deployment.name>-service.<ns>.svc.cluster.local:*) as the FIRST entry of
# MCP_EXTRA_ALLOWED_HOSTS whenever transport security is active (ezua
# endpoint pinned or extraAllowedHosts non-empty — the DEFAULT render has
# both, since ezua ships enabled): the LLM-gateway relay arrives with Host:
# <deployment.name>-service.<ns>.svc.cluster.local:<port>, and without that
# entry every relay hop gets 421 Misdirected Request. This key only lists
# hosts BEYOND that; a site setting extraAllowedHosts never loses the
# own-svc entry (the chart prepends it):
extraAllowedHosts: []

# -- fetch_content SSRF policy (fleet decision D6 — guard default-ON) ----------
# Escapes/caps for the fetch SSRF guard (mcp url_policy.py + fetcher.py).
# Empty strings keep the built-in defaults, so rendering is unchanged unless
# an operator sets them. Loopback/pod-local/metadata targets are NEVER
# fetchable regardless of these values.
fetch:
  # SEARXNG_FETCH_ALLOW_HOSTS — comma-separated hostnames (exact or ".suffix"),
  # IP literals or CIDRs that may resolve to private/cluster-internal space
  # (e.g. "minio.internal.example,10.0.0.0/8").
  allowHosts: ""
  # SEARXNG_FETCH_DENY_EXTRA — comma-separated entries denied on top of the
  # built-in list (deny wins over the allowlist).
  denyExtra: ""
  # SEARXNG_FETCH_CACHE_TTL — fetch result cache seconds ("" = built-in 300;
  # "0" disables caching).
  cacheTtl: ""
  # SEARXNG_FETCH_MAX_BODY_BYTES — response-body cap ("" = built-in 5000000).
  maxBodyBytes: ""
  # SEARXNG_FETCH_MAX_SCREENSHOT_KB — screenshot data-URL cap ("" = 512).
  maxScreenshotKb: ""
  # SEARXNG_FETCH_MAX_REDIRECTS — redirect hops, each re-validated ("" = 5).
  maxRedirects: ""
  # FETCH_TLS_INSECURE_FALLBACK — last-resort resilience for TLS-intercepting
  # egress: when a fetch rung fails on a certificate error specifically, it
  # retries ONCE with verification disabled and the tool output is marked.
  # Default "" (off). Consider "true" on sites whose CA bundle may lag the
  # proxy's CA rotation (Zscaler rotates roots); the proper fix is the
  # caCert bundle below.
  tlsInsecureFallback: ""

# -- Corporate egress CA (TLS interception — Zscaler/Blue Coat style) -----------
# When the egress proxy re-signs TLS, every HTTPS fetch dies with
# "unable to get local issuer certificate" (curl: (60)) and the browser rung
# with ERR_CERT_AUTHORITY_INVALID — unless the proxy's root CA is trusted.
# Point caCert at a ConfigMap in the release namespace whose keys are PEM
# certificates of the proxy's root/intermediate CAs. The chart mounts it and
# the init-ca-bundle init container combines it with the image's public
# bundle into /ca-bundle/ca-bundle.crt, wired to FETCH_CA_BUNDLE /
# SSL_CERT_FILE / CURL_CA_BUNDLE on the MCP container (verification stays
# ON — this is the proper fix; fetch.tlsInsecureFallback is the escape
# hatch). To capture and verify the CA your proxy actually presents:
#   openssl s_client -proxy <proxy-host>:<port> -connect example.com:443 \
#     -servername example.com -showcerts </dev/null
# then verify a candidate root against the captured intermediate:
#   openssl verify -CAfile candidate-root.pem intermediate.pem
caCert:
  enabled: false
  configMap: "zscaler-root-ca"

# -- Egress proxy ---------------------------------------------------------------------------------------
# Per-key proxy wiring — each key is wired into the pod only when non-empty,
# so a corporate-proxy site sets http/https (and usually noProxy), while a
# direct-egress site leaves proxy: {} (or omits it) and everything renders off.
# Non-empty keys configure BOTH: env proxies for the MCP container
# (fetch_content) and SearXNG's outgoing.proxies (engine requests).
# CAUTION: a wrong proxy breaks DNS/egress — only set it behind a real proxy.
#   proxy:
#     http: http://proxy.corp.example:8080
#     https: http://proxy.corp.example:8080
#     noProxy: ".cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,127.0.0.1,localhost"
proxy: {}

# -- PCAI (HPE Ezmeral Unified Analytics) integration ------------------------------------------------------
ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    # HARDENED-ADMIN knob: false unrenders the VS (no browser path) while
    # ezua.enabled keeps driving every other gate (kyverno, deployment).
    # ⚠️ Gate DIRECTLY on this key, never `(default true .enabled)` — Sprig's
    # `default` treats an explicit `false` as empty and would return true.
    enabled: true
    # Root of this host serves the normal SearXNG web page; /mcp is routed
    # to the MCP server (streamable-http + SSE). Doubles as MCP_HOSTNAME —
    # the DNS-rebinding Host pin (must be unique per release on the shared
    # gateway; two VirtualServices claiming one host split traffic between
    # their backends).
    endpoint: "searxng-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# -- MCP network zone (fleet decision 2026-09 — ADDITIVE, DEFAULT OFF) ------------
# Ingress allowlist for this MCP (kubernetes.io/metadata.name ns selectors).
# Once enabled, anything not matched below is DENIED (a real posture, not a
# no-op); egress stays unrestricted (policyTypes: [Ingress] only).
networkPolicy:
  enabled: false
  sameNamespace: true
  # The MCP network zone: client namespaces allowed to call this server
  # IN-CLUSTER (kubernetes.io/metadata.name labels). The LLM gateway's relay
  # namespace goes here first; add agentic frontends from the hardened-G2
  # example. `monitoring` belongs here whenever the chart ships a
  # ServiceMonitor — Prometheus scrapes /metrics on the SAME port, and an
  # unlisted scrape ns dies SILENTLY (check Prometheus targets after enabling).
  authorizedClients:
    namespaces: []
  # USER-FACING chart: the ezaf-gateway (browser) path stays ON so the
  # SearXNG web UI + VS routing keep working unchanged.
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  # LIVE-VERIFIED (G2 inventory §3): the edge pods serving VS hosts carry
  # app=istio-ingressgateway — `ezaf-gateway` is the Gateway CR NAME; no pod
  # carries it as a label. Do not "fix" this back to app=ezaf-gateway.
  ingressGatewayLabels:
    app: istio-ingressgateway
  # Node-originated kubelet probes / kubectl port-forward. NEVER 0.0.0.0/0
  # with an empty probeExceptCidrs (the template fails the render).
  probeCidrs: []
  probeExceptCidrs: []
