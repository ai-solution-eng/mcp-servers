# searxng-mcp — MCP 2.0 metasearch + content fetcher backed by a bundled
# SearXNG sidecar, for PCAI. The VirtualService root serves the SearXNG web
# UI; /mcp routes to the MCP server (streamable-http + SSE).
# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
#
# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. searxng.secretKey OR searxng.existingSecret — seeds SEARXNG_SECRET; the
#      render FAILS when both are empty (templates/deployment.yaml gate). Never
#      put a real secret in values: prefer existingSecret at a pre-created
#      Secret [key: secret]
#   2. ezua.virtualService.endpoint — required whenever ezua.enabled (chart
#      default true); templates/virtualservice.yaml calls `required` on it
# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer, don't improvise)
#   Corporate egress: proxy.{http,https,noProxy}, caCert.*, fetch.*, browser.* (+ browser.caCert)
#     — documentation/DEPLOYMENT.md "Optional values" | values-examples/values.g2.yaml
#   API-key gate on /mcp: apiKey.existingSecret — README "API-key auth" | values-examples/values.g2.yaml
#   Engine tuning: searxng.disabledEngines — documentation/DEPLOYMENT.md (chart default: corporate dead-engine list)
#   Network zone (ingress allowlist): networkPolicy.* — values-examples/values-hardened-g2.yaml (OVERLAY)
#   Self-metrics + ServiceMonitor: metrics.* — README "Prometheus self-metrics"
#   DNS-rebinding hosts: extraAllowedHosts — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment / Images
# ============================================================================

deployment:
  name: searxng-mcp
  appName: searxng-mcp
  replicaCount: 1

image:
  repository: ghcr.io/ai-solution-eng/searxng-mcp
  tag: v1.7.0   # keep in lockstep with Chart.yaml appVersion
  pullPolicy: IfNotPresent

# GHCR-pull Secret, only if the package stays PRIVATE (public pulls are anonymous):
#   kubectl create secret docker-registry ghcr-pull -n searxng-mcp --docker-server=ghcr.io --docker-username=<gh-user> --docker-password=<gh-PAT-with-read:packages>
imagePullSecrets: []

# Bundled SearXNG sidecar.
searxng:
  image:
    repository: docker.io/searxng/searxng
    tag: "2026.9.8-3fdc6d753"   # dated pin, not mutable 'latest'; digest form = fully immutable
    pullPolicy: IfNotPresent
  # SEARXNG_SECRET: prefer existingSecret (rotation = update Secret + restart);
  #   kubectl create secret generic <name> --from-literal=secret=$(openssl rand -hex 32)
  secretKey: "change-me-searxng-secret"
  existingSecret: ""
  existingSecretKey: secret
  baseUrl: ""   # rendered into settings.yml server.base_url; "" omits it
  language: "en-US"   # SEARXNG_LANGUAGE
  # Corporate-egress casualties; [] only on open-internet installs. Names MUST
  # match SearXNG engine names exactly (dots for brave, spaces for ddg/startpage).
  disabledEngines:
    - brave
    - brave.images
    - brave.news
    - brave.videos
    - duckduckgo
    - duckduckgo images
    - duckduckgo news
    - duckduckgo videos
    - startpage
    - startpage images
    - startpage news
    - wikidata
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

# ============================================================================
# Resources / Service Exposure
# ============================================================================

service:
  type: ClusterIP
  port: 9090        # MCP server (streamable-http + SSE at /mcp)
  targetPort: 9090
  searxngPort: 8080 # SearXNG UI/API (served at the VirtualService root)

resources:
  requests: {cpu: 200m, memory: 200Mi}
  limits: {cpu: "1", memory: 512Mi}

# ============================================================================
# Headless-browser Sidecar (optional)
# ============================================================================

# Lets fetch_content render JavaScript pages; off by default (adds ~512Mi +
# a second image). Reached on pod-localhost http://127.0.0.1:9222.
browser:
  enabled: false
  image:
    repository: ghcr.io/ai-solution-eng/searxng-mcp-browser
    tag: v1.6.1
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  # Corporate MITM CA for Chromium — the ConfigMap must exist in the release namespace:
  #   kubectl get cm ezaf-root-ca -n <ns> -o yaml | yq 'del(.metadata.namespace,.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp)' | kubectl apply -n <ns> -f -
  caCert:
    enabled: false
    configMap: "ezaf-root-ca"
  extraArgs: ""   # extra Chromium command-line flags, e.g. "--disable-features=x"
  ignoreCertErrors: false   # escape hatch when the proxy CA cannot be distributed

# ============================================================================
# Environment
# ============================================================================

env:
  - name: SEARXNG_URL
    value: "http://localhost:8080"

# ============================================================================
# Metrics
# ============================================================================

# ONE counter family on the MCP container (searxng_mcp_tool_requests_total);
# true serves /metrics key-free on the MCP port for the ServiceMonitor scrape.
metrics:
  enabled: false
  serviceMonitor: true
  interval: 30s

# ============================================================================
# API Keys
# ============================================================================

# /mcp requires a key ONLY when existingSecret is set (SEARXNG_API_KEYS; the
# MCP_API_KEYS env is honored too). Empty = open with a loud startup warning.
apiKey:
  existingSecret: ""
  existingSecretKey: api-keys

# ============================================================================
# Networking
# ============================================================================

# EXTRA Host values the SDK's DNS-rebinding protection accepts for in-cluster
# callers (joined into MCP_EXTRA_ALLOWED_HOSTS); own-service DNS + loopback are auto-included.
extraAllowedHosts: []

# ============================================================================
# fetch_content SSRF Policy
# ============================================================================

# Escapes/caps for the fetch SSRF guard; empty strings keep the built-in
# defaults. Loopback/pod-local/metadata targets are NEVER fetchable.
fetch:
  allowHosts: ""   # SEARXNG_FETCH_ALLOW_HOSTS — hosts/CIDRs that may resolve internal
  denyExtra: ""    # SEARXNG_FETCH_DENY_EXTRA — deny wins over the allowlist
  cacheTtl: ""     # SEARXNG_FETCH_CACHE_TTL ("" = built-in 300; "0" off)
  maxBodyBytes: "" # SEARXNG_FETCH_MAX_BODY_BYTES ("" = built-in 5000000)
  maxScreenshotKb: ""   # SEARXNG_FETCH_MAX_SCREENSHOT_KB ("" = 512)
  maxRedirects: ""      # SEARXNG_FETCH_MAX_REDIRECTS ("" = 5)
  # FETCH_TLS_INSECURE_FALLBACK — one unverified retry on a certificate error
  # ("" = off); the caCert bundle below is the proper fix.
  tlsInsecureFallback: ""

# ============================================================================
# Corporate Egress CA / Egress Proxy
# ============================================================================

# Point caCert at a release-namespace ConfigMap of the proxy's PEM certs
# (verification stays ON): openssl s_client -proxy <proxy-host>:<port> -connect example.com:443 -showcerts
caCert:
  enabled: false
  configMap: "zscaler-root-ca"

# Non-empty keys configure BOTH the MCP container env proxies (fetch_content)
# and SearXNG outgoing.proxies; a wrong proxy breaks DNS/egress.
proxy: {}

# ============================================================================
# PCAI (HPE Ezmeral Unified Analytics) Integration
# ============================================================================

ezua:
  enabled: true
  domainName: "${DOMAIN_NAME}"
  virtualService:
    # Gate DIRECTLY on this key — Sprig's `default` treats an explicit false
    # as empty; false unrenders the VS while ezua.enabled drives the other gates.
    enabled: true
    # Doubles as MCP_HOSTNAME (the DNS-rebinding Host pin); must be unique
    # per release on the shared gateway.
    endpoint: "searxng-mcp.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
    timeout: 660s
  authorizationPolicy:
    enabled: true
    namespace: "istio-system"
    providerName: "oauth2-proxy"

# ============================================================================
# MCP Network Zone
# ============================================================================

# Ingress allowlist (ns selectors): once enabled anything not matched is DENIED;
# include the scrape ns whenever a ServiceMonitor ships, or it dies SILENTLY.
networkPolicy:
  enabled: false
  sameNamespace: true
  authorizedClients:
    namespaces: []   # LLM-gateway relay ns goes here first
  allowEzafGatewayIngress: true   # browser path stays ON (user-facing chart)
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway   # live edge-pod label (NOT app=ezaf-gateway)
  probeCidrs: []   # node-originated kubelet probes; NEVER 0.0.0.0/0 with empty probeExceptCidrs
  probeExceptCidrs: []
