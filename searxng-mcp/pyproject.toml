[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searxng-mcp"
version = "1.7.0"
description = "SearXNG MCP Server — metasearch via a self-hosted SearXNG instance + content fetcher"
authors = []
requires-python = ">=3.10"
keywords = ["mcp", "searxng", "search", "metasearch", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "httpx2>=2.12.0",
    "mcp>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
    "brotli>=1.1.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "curl_cffi>=0.9.0",
]

[project.optional-dependencies]
# Playwright drives the headless-browser sidecar over CDP (client side only —
# the Chromium binary lives in the separate searxng-mcp-browser image). The
# core install stays fully functional without it: fetch_content simply never
# escalates to rendering.
browser = ["playwright>=1.49"]

# Test toolchain as a uv dependency-group so `uv sync` always yields a
# runnable test venv (uv pip install pytest used to be a manual step).
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
searxng-mcp = "searxng_mcp.server:main"

[tool.setuptools]
# DEPLOY-BLOCKER (Wave-6 packaging fix): the Dockerfile does a NON-editable
# `uv pip install --system .` and runs the installed `searxng-mcp` console
# script from site-packages. server.py imports mcp_auth (auth wave) AND
# mcp_metrics (Wave-3 C3) — both MUST ship in the wheel or the image
# crash-loops at startup with ModuleNotFoundError.
#
# Layout: the app modules live in the src layout under src/searxng_mcp/, so
# they ship as the searxng_mcp PACKAGE (package-dir points setuptools at
# src/). Only the repo-root mcp_auth.py — the fleet hardlink, imported as a
# top-level module — remains a top-level py-module.
package-dir = {searxng_mcp = "src/searxng_mcp"}
packages = ["searxng_mcp"]
py-modules = ["mcp_auth"]

[tool.pytest.ini_options]
# "src" makes "from searxng_mcp import ..." resolve (tests import the
# package absolutely); "." makes the top-level "import mcp_auth" resolve from
# the repo root. Both entries are required when pytest runs from there.
pythonpath = ["src", "."]
