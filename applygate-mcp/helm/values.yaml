deployment:
  name: applygate-mcp
  appName: applygate-mcp
  replicaCount: 1
image:
  repository: ghcr.io/ai-solution-eng/applygate-mcp
  tag: v0.1.4
  pullPolicy: IfNotPresent
imagePullSecrets: []
webui:
  enabled: true
namespaces:
  allowed: ''
  blocked: ''
kinds:
  allowed: ConfigMap,Service,Deployment,StatefulSet,Job,CronJob,Ingress,ServiceAccount,PodDisruptionBudget,HorizontalPodAutoscaler
audit:
  file: /data/audit.jsonl
persistence:
  enabled: true
  size: 1Gi
  accessModes:
  - ReadWriteOnce
service:
  type: ClusterIP
  port: 9102
  targetPort: 9102
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
serviceAccount:
  create: true
  name: applygate-mcp
rbac:
  create: true
hpe_proxies: false
proxy:
  http: http://hpeproxy.its.hpecorp.net:8080
  https: http://hpeproxy.its.hpecorp.net:8080
  noProxy: .cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.0.0.0/8,localhost
kyverno:
  enabled: false
ezua:
  enabled: false
  domainName: ${DOMAIN_NAME}
  virtualService:
    endpoint: applygate-mcp.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 120s
