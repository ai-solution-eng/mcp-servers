# applygate-mcp — values for the SE-G2 lab cluster
# (SITE: your-cluster.example — proxied corporate PCAI site)
#
# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document (PCAI's Helm Values editor replaces the
# chart's bundled values.yaml). Site edits are marked '# SITE:'.
# Sanitized for publication: no credentials, no personal namespaces — real
# site values live in helm/local/ (never committed, never packaged).

# -- Deployment ----------------------------------------------------------------
deployment:
  name: applygate-mcp
  appName: applygate-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
# repository/tag/pullPolicy are release-managed (kept in lockstep with
# Chart.yaml by the release tooling) — leave at the chart default.
image:
  repository: ghcr.io/ai-solution-eng/applygate-mcp
  tag: v0.5.0
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously).
imagePullSecrets: []

# -- Transport security (DNS-rebinding protection) ----------------------------------
# SITE: mcpHostname is the public FQDN clients use to reach /mcp — the
# DNS-rebinding pin. Keep in lockstep with ezua.virtualService.endpoint
# below: WITHOUT it every gateway-fronted request gets 421 "Invalid Host
# header". extraAllowedHosts lists EXTRA in-cluster svc-DNS hosts for callers
# that bypass the gateway (verbatim or host:* form; loopback is always
# allowed; empty = unchanged behavior). The chart AUTO-prepends the release's
# own service DNS (<deployment.name>-service.<ns>.svc.cluster.local:*) when
# transport security is active — the gateway relay's Host header — so this
# list is for hosts BEYOND that.
mcpHostname: applygate-mcp.your-cluster.example
extraAllowedHosts:
  - applygate-mcp.mcp-demo.svc.cluster.local

# -- Web console ---------------------------------------------------------------------------
# The strictly READ-ONLY HPE-branded UI at / (plan previews are ALWAYS
# dry-run; there are NO apply/delete endpoints). false strips / and /api/*
# while /mcp and the health endpoints keep working.
webui:
  enabled: true

# -- Namespace policy ------------------------------------------------------------------------
# THE guardrail. Chart default is '' = default-deny: every write refused.
namespaces:
  # SITE: namespaces this server may write in (globs like team-* are OK)
  allowed: team-alpha,team-beta,mcp-demo
  # SITE: ALWAYS wins over allowed
  blocked: kube-system,kube-public,kube-node-lease

# -- Write surface ----------------------------------------------------------------------------
kinds:
  # SITE: kept at the chart default (explicitly pinned so the editor shows it);
  # narrow per site if desired — Secret and cluster-scoped kinds are refused
  # regardless of this list.
  allowed: ConfigMap,Service,Deployment,StatefulSet,Job,CronJob,Ingress,ServiceAccount,PodDisruptionBudget,HorizontalPodAutoscaler

# -- Audit ------------------------------------------------------------------------------------
audit:
  # Hash-chained, caller-attributed JSONL audit trail (README: "Audit
  # trail: hash chain + caller identity"). Tamper-evident: each entry
  # carries prev_sha256. Fleet convention: this audit.path is documented
  # for ops mount/expose — mount THIS SAME path/PVC into the logsearch pod
  # so the governed write path's "who did what" becomes searchable.
  file: /data/audit.jsonl
planBinding:
  # D11 (ratified 2026-09): apply_manifest is sha256-bound to the planned
  # bytes; missing plan/tampered bytes refuse BY DEFAULT (server default
  # deny). Migration path for automation that predates the binding:
  unplannedApply: ''          # deny (default) | warn (logged) | allow (pre-D11)
metrics:
  # /metrics + ServiceMonitor — additive, OFF by default (default render
  # byte-identical to the Wave-0 baseline); requires prometheus-operator CRDs.
  enabled: false
  interval: 30s

# -- Persistence ------------------------------------------------------------------------------
# Audit-trail PVC — the trail must survive restarts to be worth anything.
persistence:
  enabled: true
  size: 1Gi
  accessModes:
  - ReadWriteOnce

# -- Service exposure -------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9102
  targetPort: 9102

# -- Resources --------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi

# -- Security contexts -------------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# -- Service account / RBAC ---------------------------------------------------------------------
serviceAccount:
  create: true
  name: applygate-mcp

rbac:
  # SITE: kept at the chart default (explicitly pinned by this file)
  create: true

# -- Per-key proxy wiring --------------------------------------------------------------------------
# The k8s API is in-cluster and covered by the standard NO_PROXY cluster-local
# entries, so the proxy block is fleet consistency only — each key is wired
# only when non-empty.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  noProxy: .cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.16.0.0/12,localhost

# -- Kyverno vendor-label policy ------------------------------------------------------------------
# Optional cluster-scoped ClusterPolicy — off by default so the default render
# stays unchanged; enable where EZUA vendor labeling is enforced.
kyverno:
  enabled: true

# -- PCAI (HPE Ezmeral Unified Analytics) integration ---------------------------------------------
# SITE: gateway exposure on with the literal host — a WRITE-path MCP behind
# the gateway relies on ezaf-gateway authn in front.
ezua:
  enabled: true   # SITE: deploy the VirtualService on this cluster
  # SITE: literal domain (this file must not rely on ${DOMAIN_NAME} resolution)
  domainName: your-cluster.example   # informational only — no template reads it
  virtualService:
    # SITE: literal host — /mcp -> MCP server (9102); / -> read-only console
    endpoint: applygate-mcp.your-cluster.example
    istioGateway: istio-system/ezaf-gateway
    timeout: 120s

# Fleet API-key auth: the shared fleet key Secret (key: api-keys).
apiKey:
  existingSecret: "mcp-fleet-apikeys"
  existingSecretKey: "api-keys"

# Wave-6 caller attribution — both optional; chart defaults (unset = fp-only
# audit, byte-identical render). Flip on only when a trusted relay emits
# X-MCP-Caller (set callerPassthrough.trustedCidrs to its CIDRs) and/or a
# caller-name registry is wanted (create the clients Secret out of band):
clients:
  existingSecret: ''
  existingSecretKey: clients
callerPassthrough:
  trustedCidrs: ''
