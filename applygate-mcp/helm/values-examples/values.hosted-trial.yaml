# applygate-mcp — values for a customer HOSTED-TRIAL environment
#
# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document for the PCAI Helm Values editor. Adjust the
# '# SITE:' lines, then apply.
# Secret-free by construction: nothing here needs credentials. If your PCAI
# build resolves ${DOMAIN_NAME} in ezua values, the placeholders below work as
# pasted; otherwise replace them with the literal cluster domain — an
# unresolved placeholder registers a gateway host that matches nothing.

# -- Deployment ----------------------------------------------------------------
deployment:
  name: applygate-mcp
  appName: applygate-mcp
  replicaCount: 1

# -- Image ------------------------------------------------------------------------
# repository/tag/pullPolicy are release-managed — leave at the chart default.
image:
  repository: ghcr.io/ai-solution-eng/applygate-mcp
  tag: v0.1.4
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously).
imagePullSecrets: []

# -- Web console ---------------------------------------------------------------------------
# Strictly READ-ONLY console at / (plan previews always dry-run; no
# apply/delete endpoints). Keep on for the trial so evaluators can watch the
# plan/audit flow in a browser.
webui:
  enabled: true

# -- Namespace policy ------------------------------------------------------------------------
# THE guardrail: a trial deploy with '' here is a no-op writer by design.
namespaces:
  # SITE: namespaces the trial agent may write in (globs OK) — REQUIRED
  allowed: <ALLOWED_NAMESPACES>
  # SITE: ALWAYS wins over allowed — keep the platform namespaces blocked
  blocked: kube-system,kube-public,kube-node-lease

# -- Write surface ----------------------------------------------------------------------------
kinds:
  # SITE: chart default — narrow (e.g. ConfigMap,Service,Deployment,Job) if the
  # trial only demos a subset
  allowed: ConfigMap,Service,Deployment,StatefulSet,Job,CronJob,Ingress,ServiceAccount,PodDisruptionBudget,HorizontalPodAutoscaler

# -- Audit ------------------------------------------------------------------------------------
audit:
  # Hash-chained, caller-attributed JSONL audit trail (README: "Audit
  # trail: hash chain + caller identity"). Tamper-evident: each entry
  # carries prev_sha256. Fleet convention: this audit.path is documented
  # for ops mount/expose — mount THIS SAME path/PVC into the logsearch pod
  # so the governed write path's "who did what" becomes searchable.
  file: /data/audit.jsonl
planBinding:
  # D11 (ratified 2026-09): apply_manifest is sha256-bound to the planned
  # bytes; missing plan/tampered bytes refuse BY DEFAULT (server default
  # deny). Migration path for automation that predates the binding:
  unplannedApply: ''          # deny (default) | warn (logged) | allow (pre-D11)
metrics:
  # /metrics + ServiceMonitor — additive, OFF by default (default render
  # byte-identical to the Wave-0 baseline); requires prometheus-operator CRDs.
  enabled: false
  interval: 30s

# -- Persistence ------------------------------------------------------------------------------
persistence:
  enabled: true
  size: 1Gi
  accessModes:
  - ReadWriteOnce

# -- Service exposure -------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 9102
  targetPort: 9102

# -- Resources --------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi

# -- Security contexts -------------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# -- Service account / RBAC ---------------------------------------------------------------------
# The chart's Role/RoleBinding cover the RELEASE namespace only. Writes into
# other trial namespaces need a one-time admin-applied RBAC bootstrap per
# namespace (see documentation/DEPLOYMENT.md).
serviceAccount:
  create: true
  name: applygate-mcp

rbac:
  create: true

# -- HPE corporate proxy --------------------------------------------------------------------------
# Off unless the trial cluster sits behind the HPE proxy (the k8s API is
# in-cluster and covered by the NO_PROXY entries either way).
hpe_proxies: true

proxy:
  http: http://hpeproxy.its.hpecorp.net:8080
  https: http://hpeproxy.its.hpecorp.net:8080
  noProxy: .cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.0.0.0/8,localhost

# -- Kyverno vendor-label policy ------------------------------------------------------------------
# Enable only where the trial platform enforces the hpe-ezua/* vendor labels.
kyverno:
  enabled: true

# -- PCAI (HPE Ezmeral Unified Analytics) integration ---------------------------------------------
# SITE: gateway exposure — applygate-mcp is a WRITE-path MCP; expose it only
# where the ezaf-gateway enforces real auth (SSO/bearer).
ezua:
  enabled: true   # SITE: deploy the VirtualService
  # SITE: current PCAI builds resolve ${DOMAIN_NAME} in ezua values; if yours
  # does not, replace both placeholders with the literal cluster domain.
  domainName: ${DOMAIN_NAME}   # informational only — no template reads it
  virtualService:
    endpoint: applygate-mcp.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 120s

# Fleet API-key auth: the shared fleet key Secret (key: api-keys).
apiKey:
  existingSecret: "mcp-fleet-apikeys"
  existingSecretKey: "api-keys"
