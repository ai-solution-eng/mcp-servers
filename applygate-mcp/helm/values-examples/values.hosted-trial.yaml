# applygate-mcp — values for a customer HOSTED-TRIAL environment
#
# FULL VALUES — every key from helm/values.yaml is present, so this file alone
# is the complete values document for the PCAI Helm Values editor. Adjust the
# site-specific lines, then apply. Secret-free: if your PCAI build resolves
# ${DOMAIN_NAME} in ezua values the placeholders work as pasted; otherwise
# substitute the literal cluster domain (an unresolved placeholder registers
# a gateway host that matches nothing).

# Owner: Andrew Bydlon
# Email: andrew.bydlon@hpe.com
#
# ### REQUIRED ### — set before ANY apply (render fails or containers refuse to start)
#   1. API-key Secret, out of band — the chart NEVER creates or inlines it; the pod
#      sits in CreateContainerConfigError until it exists (default ref:
#      applygate-mcp-apikey, key api-keys; /mcp 401s without keys).
#   2. ezua.virtualService.endpoint WHEN ezua.enabled — `helm required` render guard
#      (templates/virtualservice.yaml); must resolve ${DOMAIN_NAME}; unique per release.
# ### OPTIONAL ### — major tuning setups (copy the shape from the pointer, don't improvise)
#   Write surface (default-deny!): namespaces.allowed/blocked + kinds.allowed — documentation/DEPLOYMENT.md
#   Gateway exposure + mcpHostname lockstep (421s otherwise) — documentation/DEPLOYMENT.md
#   Network zone (default off) — values-examples/values-hardened-g2.yaml (overlay)
#   Metrics + ServiceMonitor: metrics.enabled/interval — documentation/DEPLOYMENT.md
#   Audit trail + persistence (hash-chained; logsearch-searchable) — README 'Audit trail'
#   Caller attribution: clients.existingSecret + callerPassthrough.trustedCidrs — README
#   Cross-namespace writes: per-namespace RBAC bootstrap — documentation/DEPLOYMENT.md

# ============================================================================
# Deployment
# ============================================================================

deployment:
  name: applygate-mcp
  appName: applygate-mcp
  replicaCount: 1

# ============================================================================
# Image
# ============================================================================

# repository/tag/pullPolicy are release-managed — leave at the chart default.
image:
  repository: ghcr.io/ai-solution-eng/applygate-mcp
  tag: v0.5.0
  pullPolicy: IfNotPresent

# Only needed if the GHCR package stays PRIVATE (public packages pull
# anonymously).
imagePullSecrets: []

# ============================================================================
# Transport Security (DNS-rebinding protection)
# ============================================================================

# mcpHostname = public FQDN (${DOMAIN_NAME} resolves in the PCAI values
# editor), in lockstep with the endpoint below (421s without it).
mcpHostname: applygate-mcp.${DOMAIN_NAME}

extraAllowedHosts: []

# ============================================================================
# Web Console
# ============================================================================

# Strictly READ-ONLY console (plan previews always dry-run; no apply/delete
# endpoints). Keep on for the trial — evaluators watch the plan/audit flow.
webui:
  enabled: true

# ============================================================================
# Namespace Policy
# ============================================================================

# THE guardrail: a trial deploy with '' here is a no-op writer by design.
namespaces:
  # Namespaces the trial agent may write in (globs OK) — REQUIRED
  allowed: <ALLOWED_NAMESPACES>
  # ALWAYS wins over allowed — keep the platform namespaces blocked
  blocked: kube-system,kube-public,kube-node-lease

# ============================================================================
# Write Surface
# ============================================================================

kinds:
  # Chart default — narrow (e.g. ConfigMap,Service,Deployment,Job) if
  # the trial only demos a subset
  allowed: ConfigMap,Service,Deployment,StatefulSet,Job,CronJob,Ingress,ServiceAccount,PodDisruptionBudget,HorizontalPodAutoscaler

# ============================================================================
# Audit Trail
# ============================================================================

audit:
  # Hash-chained JSONL trail (README "Audit trail") — mount the SAME path/PVC
  # into the logsearch pod so the write path's "who did what" is searchable.
  file: /data/audit.jsonl

planBinding:
  # Missing/tampered plan refuses BY DEFAULT (server default deny).
  unplannedApply: ''          # deny (default) | warn (logged) | allow (legacy)

metrics:
  # Additive, OFF by default (byte-identical render); needs the
  # prometheus-operator CRDs.
  enabled: false
  interval: 30s

# ============================================================================
# Persistence
# ============================================================================

persistence:
  enabled: true
  size: 1Gi
  accessModes:
  - ReadWriteOnce

# ============================================================================
# Service Exposure
# ============================================================================

service:
  type: ClusterIP
  port: 9102
  targetPort: 9102

# ============================================================================
# Resources
# ============================================================================

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi

# ============================================================================
# Security Contexts
# ============================================================================

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# ============================================================================
# Service Account / RBAC
# ============================================================================

# The chart's Role/RoleBinding cover the RELEASE namespace only — writes into
# other trial namespaces need a one-time admin RBAC bootstrap (DEPLOYMENT.md).
serviceAccount:
  create: true
  name: applygate-mcp

rbac:
  create: true

# ============================================================================
# Per-Key Proxy Wiring
# ============================================================================

# On unless the site wants it off — each key wired only when non-empty
# (proxy: {} = fully off); the in-cluster k8s API is covered by NO_PROXY.
proxy:
  http: http://proxy.corp.example:8080
  https: http://proxy.corp.example:8080
  noProxy: .cluster.local,.svc,.svc.cluster,.svc.cluster.local,10.0.0.0/8,10.96.0.1,127.0.0.1,172.16.0.0/12,localhost

# ============================================================================
# Kyverno Vendor-Label Policy
# ============================================================================

# Enable only where the trial platform enforces the hpe-ezua/* vendor labels.
kyverno:
  enabled: true

# ============================================================================
# PCAI (HPE Ezmeral Unified Analytics) Integration
# ============================================================================

# Gateway exposure — a WRITE-path MCP; expose it only where the
# ezaf-gateway enforces real auth (SSO/bearer).
ezua:
  enabled: true   # deploy the VirtualService
  # Current PCAI builds resolve ${DOMAIN_NAME} in ezua values; if yours
  # does not, replace both placeholders with the literal cluster domain.
  domainName: ${DOMAIN_NAME}   # informational only — no template reads it
  virtualService:
    endpoint: applygate-mcp.${DOMAIN_NAME}
    istioGateway: istio-system/ezaf-gateway
    timeout: 120s

# Fleet API-key auth: the shared fleet key Secret (key: api-keys).
apiKey:
  existingSecret: "mcp-fleet-apikeys"
  existingSecretKey: "api-keys"

# Caller attribution — unset = fp-only audit; enable when a trusted relay
# emits X-MCP-Caller (set trustedCidrs to its CIDRs) or a registry is wanted:
clients:
  existingSecret: ''
  existingSecretKey: clients

callerPassthrough:
  trustedCidrs: ''

# ============================================================================
# MCP Network Zone (fleet decision 2026-09 — ADDITIVE, DEFAULT OFF)
# ============================================================================

# Ingress allowlist (ns selectors): once enabled anything unmatched is DENIED;
# egress unrestricted. Zone OFF on a trial — the relay's netpol governs access.
networkPolicy:
  enabled: false
  sameNamespace: true
  authorizedClients:
    namespaces: []
  allowEzafGatewayIngress: true
  ingressGatewayNamespace: istio-system
  ingressGatewayLabels:
    app: istio-ingressgateway
  probeCidrs: []
  probeExceptCidrs: []
  egress:
    enabled: false
    extraEgress: []
